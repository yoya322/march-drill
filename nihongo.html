<style>
/* 片手で解く縦長の1画面アプリ。下にタブ、出題中は全画面。押すと沈む立体ボタンが基調 */
:root{
  --bg:#F4F8EF; --surface:#FFFFFF; --fg:#1E2A1B; --muted:#66745F; --line:#DCE5D4; --line-d:#C6D2BB;

  --sky:#1CA7EC; --sky-d:#1588C2; --sky-t:#DDF2FC;
  --yellow:#FFC800; --yellow-d:#D9A900; --gold:#E9A800; --gold-t:#FFF3C9;
  --on-color:#FFFFFF;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",system-ui,sans-serif;
  font-size:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11180F; --surface:#1B2418; --fg:#EDF3E8; --muted:#9BAA93; --line:#2C3A28; --line-d:#3A4B35;
  --green:#22B3A1; --green-d:#11887A; --green-t:#14302C;
  --red:#F25F5F; --red-d:#B83D3D; --red-t:#3A2020;
  --sky:#35B3F0; --sky-d:#1C86BD; --sky-t:#163246;
  --yellow:#FFCE2E; --yellow-d:#C99E10; --gold:#F2BC2F; --gold-t:#3A3112;
  --on-color:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11180F; --surface:#1B2418; --fg:#EDF3E8; --muted:#9BAA93; --line:#2C3A28; --line-d:#3A4B35;
  --green:#22B3A1; --green-d:#11887A; --green-t:#14302C;
  --red:#F25F5F; --red-d:#B83D3D; --red-t:#3A2020;
  --sky:#35B3F0; --sky-d:#1C86BD; --sky-t:#163246;
  --yellow:#FFCE2E; --yellow-d:#C99E10; --gold:#F2BC2F; --gold-t:#3A3112;

html,body{height:100%}

*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.15rem;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 16px;border-radius:16px;border:2px solid var(--line-d);border-bottom-width:5px;background:var(--surface);font-weight:800;font-size:1rem;width:100%;transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--green);border-color:var(--green-d);color:var(--on-color)}
.btn.sky{background:var(--sky);border-color:var(--sky-d);color:var(--on-color)}
.btn.red{background:var(--red);border-color:var(--red-d);color:var(--on-color)}
.btn.gold{background:var(--yellow);border-color:var(--yellow-d);color:#3B2E00}
.btn.slim{min-height:44px;font-size:.9rem;border-bottom-width:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:12px;font-size:.72rem;font-weight:800;color:var(--muted);min-height:56px}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--green-d);background:var(--green-t)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--green)}}
.badge{position:absolute;top:2px;right:18%;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:var(--on-color);font-size:.7rem;line-height:20px;text-align:center}
.hero{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.1rem;color:var(--gold)}
.streak svg{width:28px;height:28px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-d);display:grid;place-items:center;font-size:.75rem}
.dot.on{background:var(--yellow);border-color:var(--yellow-d)}
.dot.free{background:var(--sky-t);border-color:var(--sky)}
.dot.today{outline:2px solid var(--green);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.note{padding:12px 14px;border-radius:14px;background:var(--gold-t);font-size:.9rem}
.note.sky{background:var(--sky-t)} .note.green{background:var(--green-t)} .note.red{background:var(--red-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line-d);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px 12px;font-weight:700;font-size:.9rem;min-height:48px;text-align:left}
.chip[aria-pressed="true"]{background:var(--green-t);border-color:var(--green)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.li .t{flex:1;min-width:0}
.tag{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--muted)}
.tag.red{background:var(--red-t);color:var(--red-d)} .tag.sky{background:var(--sky-t);color:var(--sky-d)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-h{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:700}
.bar-h span:last-child{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;border-radius:7px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:7px;background:var(--green)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
.sw{width:56px;height:32px;border-radius:16px;border:2px solid var(--line-d);background:var(--bg);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--green);border-color:var(--green-d)}
.sw[aria-checked="true"]::after{left:26px;background:var(--on-color)}
textarea{width:100%;min-height:110px;border-radius:12px;border:2px solid var(--line-d);background:var(--bg);color:var(--fg);padding:10px;font:inherit;font-size:.8rem}
input[type=text]{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--line-d);background:var(--bg);color:var(--fg);padding:8px 12px;font:inherit}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}

/* 出題画面 */
.quiz{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.quiz.boss{box-shadow:inset 0 0 0 5px var(--gold),inset 0 0 40px var(--gold-t)}
.qhead{padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.qhead-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.x{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:26px;height:26px}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.prog i.ok{background:var(--green)} .prog i.ng{background:var(--red)} .prog i.now{background:var(--sky)}
.prog i.boss{outline:2px solid var(--gold);outline-offset:1px}
.combo{display:flex;align-items:center;gap:2px;font-weight:800;color:var(--gold);min-width:44px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.combo svg{width:22px;height:22px}
.combo.pop{animation:pop .35s}
.qbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qbody-in{max-width:520px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.bossbar{border-radius:14px;padding:10px 12px;background:var(--gold-t);border:2px solid var(--gold);font-weight:800;font-size:.9rem;display:flex;gap:8px;align-items:center}
.bossbar svg{width:22px;height:22px;flex:none;color:var(--gold)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qtext{font-size:1.08rem;font-weight:700;white-space:pre-line}
.qcard.bounce{animation:bounce .45s}
.qcard.shake{animation:shake .4s}
.qcard.burst{animation:burst .6s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:56px;padding:12px 14px;border-radius:16px;border:2px solid var(--line-d);border-bottom-width:5px;background:var(--surface);font-weight:700;font-size:.97rem;width:100%}
.opt .n{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line-d);display:grid;place-items:center;font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-t)}
.opt[aria-pressed="true"] .n{border-color:var(--sky);background:var(--sky);color:var(--on-color)}
.opt.right{border-color:var(--green);background:var(--green-t)}
.opt.right .n{background:var(--green);border-color:var(--green);color:var(--on-color)}
.opt.wrong{border-color:var(--red);background:var(--red-t)}
.opt.wrong .n{background:var(--red);border-color:var(--red);color:var(--on-color)}
.opt:disabled{cursor:default}
.recall-ans{padding:16px;border-radius:16px;background:var(--sky-t);border:2px solid var(--sky);font-weight:800;font-size:1.1rem;text-align:center}
.sheet{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--line);animation:up .3s ease-out}
.sheet.ok{border-color:var(--green)} .sheet.ng{border-color:var(--red)}
.verdict{display:flex;align-items:center;gap:10px}
.verdict svg{width:34px;height:34px;flex:none}
.verdict b{font-size:1.2rem}
.sheet.ok .verdict{color:var(--green-d)} .sheet.ng .verdict{color:var(--red-d)}
.sec-t{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pit{padding:10px 12px;border-radius:12px;background:var(--gold-t)}
.onotes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.onotes li{display:flex;gap:8px}
.onotes .m{flex:none;font-weight:800}
.onotes .m.ok{color:var(--green-d)} .onotes .m.ng{color:var(--red-d)}
.src{font-size:.78rem;color:var(--muted);word-break:break-all}
.src a{color:var(--sky-d)}
.xpchip{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--sky-d);font-size:.9rem}
.qfoot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line);background:var(--surface)}
.qfoot-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.confrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.confrow .btn{flex-direction:column;gap:0;font-size:.9rem;padding:6px}
.confrow .btn .e{font-size:1.3rem;line-height:1.2}
.ask{font-size:.85rem;font-weight:800;color:var(--muted);text-align:center}
.result{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.result .wrap{padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.big{font-size:2rem;font-weight:800;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;max-width:90vw}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes burst{0%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

.storebox{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;background:rgba(240,150,40,.14);border:1px solid rgba(240,150,40,.6)}
.storebox b{display:block;margin-bottom:2px}
.storeok{font-size:13px;opacity:.75;line-height:1.5}
.codemodal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.codebox{width:100%;max-width:440px;background:var(--surface,#fff)}
</style>

function fresh(){return {v:1,cards:{},log:[],days:{},streak:{count:0,last:null,freezeWeek:null},xp:0,popped:0,settings:{sound:false,conf:true,size:"m",formats:{choice4:true,truefalse:true,combo:true,order:true,write:true,recall:true}},flags:[],extra:[],offset:0,cheered:[]};}
function mergeSettings(x){const d=fresh().settings;x=x||{};return Object.assign(d,x,{formats:Object.assign(d.formats,x.formats||{})});}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){return Object.assign(fresh(),s,{settings:mergeSettings(s.settings)});}}catch(e){}return fresh();}

const ID_KEY="drill-id",IDCODE_KEY="drill-idcode";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function getCode(){return lsGet(ID_KEY)?(lsGet(IDCODE_KEY)||""):"";}
function getName(){return lsGet(ID_KEY)||"";}
// IDは全角半角・大文字小文字・空白をそろえる。パスワードは大文字小文字を区別し、全角半角と空白だけそろえる
function normId(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/\s+/g,"");}
function normPw(s){return String(s||"").normalize("NFKC").replace(/\s+/g,"");}
async function codeOf(id,pw){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("drill-v2:"+normId(id)+":"+normPw(pw)));return "h-"+[...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,"0")).join("");}
let SYNC={busy:false,dirty:false,last:+(lsGet(KEY+"-sync")||0),err:false};
function summary(){
  const L=S.log.slice(-50),t=today();const cats={};
  cats["ID:"+getName()]=null;
  Object.keys(CATS).forEach(k=>{const a=acc(k);cats[CATS[k]]=a.a==null?null:Math.round(a.a*100);});
  return {total:S.log.length,recent:L.length?Math.round(L.filter(l=>l.ok).length/L.length*100):null,streak:streakView(),today:S.days[t]||0,revenge:revengePool().length,cats};
}
function cloudPush(keep){
  const code=getCode();if(!SYNC_URL||!code||SYNC.busy)return;
  SYNC.busy=true;SYNC.dirty=false;
  const body=JSON.stringify({code,app:KEY,savedAt:S.savedAt||Date.now(),data:S,summary:summary()});
  fetch(SYNC_URL,{method:"POST",keepalive:!!keep&&body.length<60000,headers:{"Content-Type":"text/plain;charset=utf-8"},body})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw 0;SYNC.last=Date.now();SYNC.err=false;lsSet(KEY+"-sync",String(SYNC.last));})
    .catch(()=>{SYNC.err=true;SYNC.dirty=true;}).finally(()=>{SYNC.busy=false;});
}
async function cloudGet(code){
  const r=await fetch(SYNC_URL+"?code="+encodeURIComponent(code)+"&app="+encodeURIComponent(KEY));const j=await r.json();
  if(!j.ok)throw new Error("ng");return j.data||null;
}
function adopt(o){if(!o||o.v!==1||!o.cards)return false;S=Object.assign(fresh(),o,{settings:mergeSettings(o.settings)});try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}return true;}
// 開いたとき：クラウドの方が新しければ取り込む（別の端末で解いた分）
if(SYNC_URL&&getCode()){cloudGet(getCode()).then(o=>{if(o&&(o.savedAt||0)>(S.savedAt||0)+60000&&adopt(o)){if(!SES)render();toast("クラウドの新しい記録を読み込みました");}else if(SYNC.dirty||(S.savedAt||0)>SYNC.last)cloudPush();}).catch(()=>{});}

function tone(seq){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});}catch(e){}}

function rawBank(){const m=new Map();BANK_BASE.forEach(q=>m.set(q.id,q));(S.extra||[]).forEach(q=>{const o=m.get(q.id);if(!o||(q.version||1)>=(o.version||1))m.set(q.id,q);});return [...m.values()].filter(q=>q.status==="verified");}
// 出題の形の切り替え：オフにした形は、出せる形に置き換えるか、出さない
const FMT_LABEL={choice4:"選択式（3〜4択）",truefalse:"〇×",combo:"組合せ",order:"並べ替え",write:"入力式（書いて答える）",recall:"思い出し（頭で答えてめくる）"};
function present(q,F){F=F||S.settings.formats;const f=q.format;if(F[f]!==false)return q;
  const hasAcc=q.accept&&q.accept.length;
  if(f==="write")return F.recall!==false?Object.assign({},q,{format:"recall",from:"write"}):null;
  if(f==="recall")return (F.write!==false&&hasAcc)?Object.assign({},q,{format:"write",from:"recall"}):null;
  if(hasAcc&&F.write!==false)return Object.assign({},q,{format:"write",options:undefined,from:f});
  return null;}
function bankWith(F){return rawBank().map(q=>present(q,F)).filter(Boolean);}
function bank(){return bankWith();}
function card(id){return S.cards[id]||(S.cards[id]={stage:0,due:null,seen:0,ok:0,ng:0,revenge:false,hits:0,hitDay:null,confWrong:false,grad:false,checkDue:null});}
function isDue(q,t){const c=S.cards[q.id];if(!c||c.seen===0)return false;if(c.grad)return c.checkDue!=null&&c.checkDue<=t;return c.stage>=1&&c.due!=null&&c.due<=t;}
function acc(cat,n=20){const L=S.log.filter(l=>l.cat===cat).slice(-n);if(!L.length)return {a:null,n:0};return {a:L.filter(l=>l.ok).length/L.length,n:L.length};}
function targetDiff(cat){const {a,n}=acc(cat);if(a==null||n<4)return 2;if(a>.9)return 3;if(a<.6)return 1;return 2;}
function mastery(cat){const qs=bank().filter(q=>q.category===cat);if(!qs.length)return null;let s=0;qs.forEach(q=>{const c=S.cards[q.id];if(!c)return;s+=c.grad?1:Math.min(c.stage,5)/5;});return s/qs.length;}
function revengePool(){return bank().filter(q=>S.cards[q.id]&&S.cards[q.id].revenge);}

function interleave(list){const out=[];let rest=list.slice();while(rest.length){let i=rest.findIndex(q=>!(out.length>=2&&out[out.length-1].category===q.category&&out[out.length-2].category===q.category));if(i<0)i=0;out.push(rest.splice(i,1)[0]);}return out;}

function pickDaily(){
  const B=bank(),t=today(),n=Math.min(10,B.length);
  let due=B.filter(q=>isDue(q,t)).sort((a,b)=>{const A=S.cards[a.id],C=S.cards[b.id];return (C.confWrong-A.confWrong)||((A.due||A.checkDue||0)-(C.due||C.checkDue||0));}).slice(0,6);
  const unseen=shuffle(B.filter(q=>!S.cards[q.id]||S.cards[q.id].seen===0)).sort((a,b)=>Math.abs(a.difficulty-targetDiff(a.category))-Math.abs(b.difficulty-targetDiff(b.category)));
  const minNew=Math.min(3,unseen.length);
  if(due.length>n-minNew)due=due.slice(0,n-minNew);
  let set=due.concat(unseen.slice(0,n-due.length));
  if(set.length<n){const ids=new Set(set.map(q=>q.id));const rest=shuffle(B.filter(q=>!ids.has(q.id))).sort((a,b)=>(acc(a.category).a??.5)-(acc(b.category).a??.5));set=set.concat(rest.slice(0,n-set.length));}
  // BOSS（第10問）：応用問題を、苦手すぎない分野から
  let bossIdx=-1,best=-1;
  set.forEach((q,i)=>{if(!isBossable(q))return;const a=acc(q.category).a;const sc=(a==null?.6:(a>=.4&&a<=.9?1:.3))+Math.random()*.1;if(sc>best){best=sc;bossIdx=i;}});
  if(bossIdx<0){const ids=new Set(set.map(q=>q.id));const cand=B.filter(q=>isBossable(q)&&!ids.has(q.id));if(cand.length&&set.length){const dueIds=new Set(due.map(q=>q.id));let ri=set.findIndex(q=>!dueIds.has(q.id));if(ri<0)ri=set.length-1;set[ri]=pick(cand);bossIdx=ri;}}
  let boss=null;if(bossIdx>=0){boss=set.splice(bossIdx,1)[0];}
  set=interleave(set);if(boss)set.push(boss);
  return {list:set,bossId:boss?boss.id:null};
}
function pickCustom(cats,n){
  const B=bank().filter(q=>cats.includes(q.category)),t=today();
  const due=shuffle(B.filter(q=>isDue(q,t)));const ids=new Set(due.map(q=>q.id));
  const unseen=shuffle(B.filter(q=>!ids.has(q.id)&&(!S.cards[q.id]||S.cards[q.id].seen===0)));unseen.forEach(q=>ids.add(q.id));
  const rest=shuffle(B.filter(q=>!ids.has(q.id))).sort((a,b)=>(acc(a.category).a??.5)-(acc(b.category).a??.5));
  return {list:interleave(due.concat(unseen,rest).slice(0,n)),bossId:null};
}
function pickRevenge(n=10){
  const P=shuffle(revengePool()).sort((a,b)=>{const A=S.cards[a.id],C=S.cards[b.id];return (C.confWrong-A.confWrong)||(A.hits-C.hits);});
  return {list:interleave(P.slice(0,n)),bossId:null};
}

/* ===== 判定後の記録（間隔反復） ===== */
function applyResult(q,correct,conf){
  const c=card(q.id),t=today(),r={};
  c.seen++;S.log.push({id:q.id,cat:q.category,d:t,ok:correct,conf});if(S.log.length>3000)S.log=S.log.slice(-3000);
  if(correct){
    c.ok++;
    if(conf==="guess"){c.revenge=true;if(c.stage<1)c.stage=1;c.grad=false;c.due=t+INTERVAL[c.stage];r.guess=true;}
    else{
      if(c.grad){c.checkDue=null;}
      else if(c.stage>=5){c.grad=true;c.due=null;c.checkDue=t+60;r.grad=true;}
      else{c.stage++;c.due=t+INTERVAL[c.stage];}
      if(c.revenge){
        if(c.hits>=1&&c.hitDay!=null&&c.hitDay<t){c.revenge=false;c.hits=0;c.hitDay=null;S.popped++;r.popped=true;}
        else if(c.hits===0){c.hits=1;c.hitDay=t;r.cracked=true;}
        else r.sameDay=true;
      }
      c.confWrong=false;
    }
  }else{
    c.ng++;c.stage=1;c.due=t+1;c.grad=false;c.checkDue=null;c.revenge=true;c.hits=0;c.hitDay=null;
    if(conf==="sure"){c.confWrong=true;r.confWrong=true;}
  }
  save();return r;
}

  on("dPlus",()=>{S.offset++;save();render();$("#testBox").hidden=false;});
  on("dMinus",()=>{S.offset--;save();render();$("#testBox").hidden=false;});
  on("dZero",()=>{S.offset=0;save();render();$("#testBox").hidden=false;});
  bindSync();
}

/* ===== 出題 ===== */
let SES=null;
function startSession(mode){
  const p=mode==="daily"?pickDaily():mode==="custom"?pickCustom(CUST.cats,CUST.n):pickRevenge(10);
  if(!p.list.length){toast("出せる問題がありません");return;}
  SES={mode,queue:p.list.map(q=>({q,retry:false})),idx:0,first:p.list.length,done:[],firstOk:0,retakes:0,retakeOk:0,xp:0,combo:0,maxCombo:0,wrongIds:[],bossId:p.bossId,boss:null,popped:0,cracked:0,confNg:0};
  $("#tabs").hidden=true;$("#quiz").hidden=false;document.body.style.overflow="hidden";
  showQ();
}
function quitSession(){SES=null;$("#quiz").hidden=true;$("#tabs").hidden=false;document.body.style.overflow="";render();}

let QS=null; // 1問ぶんの状態
function showQ(){
  const item=SES.queue[SES.idx];const q=item.q;
  const nOpt=(q.options||[]).length;const canShuffle=["choice4","combo"].includes(q.format)&&!(q.options||[]).some(o=>/^[ア-エ][\s　]/.test(o));
  QS={item,q,sel:null,order:[],phase:"answer",revealed:false,perm:canShuffle?shuffle([...Array(nOpt).keys()]):[...Array(nOpt).keys()]};
  const isBoss=q.id===SES.bossId&&!item.retry;
  const quiz=$("#quiz");quiz.classList.toggle("boss",isBoss);
  quiz.innerHTML=`
   <header class="qhead"><div class="qhead-in">
     <button class="x" id="qx" aria-label="中断する">${IC.x}</button>
     <div class="prog" aria-hidden="true">${progHTML()}</div>
     <div class="combo" id="combo">${SES.combo>=2?IC.flame+SES.combo:""}</div>
   </div></header>
   <div class="qbody" id="qbody"><div class="qbody-in">
     ${isBoss?`<div class="bossbar">${IC.crown}BOSS BATTLE：応用・上位級の問題</div>`:""}
     ${item.retry?`<div class="note sky small">取り返しチャンス！さっき間違えた問題です</div>`:""}
     <div class="qcard stack" id="qcard">
       <div class="qmeta"><span class="tag">${esc(CATS[q.category])}</span><span class="tag">${DIFF[q.difficulty]||""}</span>${String(q.topic||"").startsWith("【上位級】")?`<span class="tag sky">上位級</span>`:""}${q.from?`<span class="tag">${q.format==="recall"?"思い出しで出題":"入力式で出題"}</span>`:""}</div>
       <div class="qtext">${esc(q.question)}</div>
       <div id="qarea"></div>
     </div>
     <div id="sheet"></div>
   </div></div>
   <footer class="qfoot"><div class="qfoot-in" id="qfoot"></div></footer>`;
  $("#qx").onclick=()=>{if(confirmQuit())quitSession();};
  renderArea();renderFoot();
  $("#qbody").scrollTop=0;
}
let quitArm=0;
function confirmQuit(){if(Date.now()-quitArm<2500)return true;quitArm=Date.now();toast("もう一度押すと中断します（ここまでの記録は残ります）");return false;}
function progHTML(){
  let h="";for(let i=0;i<SES.first;i++){const d=SES.done[i];const cls=d===true?"ok":d===false?"ng":(i===firstIndex()?"now":"");const isB=SES.bossId&&i===SES.first-1;h+=`<i class="${cls} ${isB?"boss":""}"></i>`;}return h;
}
function firstIndex(){let c=0;for(let i=0;i<SES.idx;i++)if(!SES.queue[i].retry)c++;return SES.queue[SES.idx]&&SES.queue[SES.idx].retry?-1:c;}

function renderArea(){
  const q=QS.q,a=$("#qarea");
  if(q.format==="write"){
    if(QS.phase==="reveal"){a.innerHTML=`<div class="recall-ans" style="text-align:left">あなたの答え：${esc(QS.typed||"（空欄）")}</div>`;return;}
    a.innerHTML=`<input type="text" id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" value="${esc(QS.typed||"")}" style="font-size:1.1rem">`;
    const inp=$("#qin");inp.oninput=()=>{QS.typed=inp.value;renderFoot();};inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();checkWrite();}};
    return;
  }
  if(q.format==="recall"){
    a.innerHTML=QS.revealed?`<div class="recall-ans">${esc(q.answerText)}</div>`:`<p class="muted small" style="margin:0">答えを頭の中で言ってから、めくってください。</p>`;
    return;
  }
  if(q.format==="order"){
    a.innerHTML=`<p class="muted small" style="margin:0 0 8px">正しい順にタップ（${QS.order.length}/${q.options.length}）</p><div class="opts">${q.options.map((o,i)=>{const k=QS.order.indexOf(i);const cls=QS.phase==="reveal"?(QS.correct?"right":"wrong"):"";return `<button class="opt ${cls}" data-i="${i}" aria-pressed="${k>=0}" ${QS.phase==="reveal"?"disabled":""}><span class="n">${k>=0?k+1:""}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
    a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(QS.phase==="reveal")return;const i=+b.dataset.i;if(QS.order.includes(i))return;QS.order.push(i);if(QS.order.length===q.options.length)QS.phase=S.settings.conf?"conf":"judge";renderArea();renderFoot();if(QS.phase==="judge")judge(null);});
    return;
  }
  a.innerHTML=`<div class="opts">${QS.perm.map((i,k)=>{const o=q.options[i];let cls="";if(QS.phase==="reveal"){if(i===q.answer)cls="right";else if(i===QS.sel)cls="wrong";}return `<button class="opt ${cls}" data-i="${i}" aria-pressed="${QS.phase!=="reveal"&&QS.sel===i}" ${QS.phase==="reveal"?"disabled":""}><span class="n">${CIRC[k]||k+1}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
  a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(QS.phase==="reveal")return;QS.sel=+b.dataset.i;if(S.settings.conf){QS.phase="conf";renderArea();renderFoot();}else{judge(null);}});
}
function renderFoot(){
  const f=$("#qfoot"),q=QS.q;
  if(QS.phase==="reveal"){f.innerHTML=`<button class="btn primary" id="next">${SES.idx+1<SES.queue.length?"次へ":"結果を見る"}</button>`;$("#next").onclick=next;return;}
  if(q.format==="write"){
    f.innerHTML=`<button class="btn primary" id="wchk" ${(QS.typed||"").trim()?"":"disabled"}>答え合わせ</button>`;$("#wchk").onclick=checkWrite;return;
  }
  if(q.format==="recall"){
    if(!QS.revealed){f.innerHTML=`<button class="btn sky" id="flip">答えを見る</button>`;$("#flip").onclick=()=>{QS.revealed=true;renderArea();renderFoot();};}
    else{f.innerHTML=`<div class="ask">言えた？</div><div class="confrow"><button class="btn" id="r1"><span class="e">🔥</span>言えた</button><button class="btn" id="r2"><span class="e">🤔</span>あいまい</button><button class="btn" id="r3"><span class="e">💭</span>言えなかった</button></div>`;
      $("#r1").onclick=()=>judge("sure",true);$("#r2").onclick=()=>judge("guess",true);$("#r3").onclick=()=>judge(null,false);}
    return;
  }
  if(QS.phase==="conf"){
    f.innerHTML=`<div class="ask">どのくらい自信がある？</div><div class="confrow"><button class="btn" id="c1"><span class="e">🔥</span>自信あり</button><button class="btn" id="c2"><span class="e">🤔</span>たぶん</button><button class="btn" id="c3"><span class="e">🎲</span>勘</button></div>${q.format==="order"?`<button class="btn slim" id="redo">並べ直す</button>`:""}`;
    $("#c1").onclick=()=>judge("sure");$("#c2").onclick=()=>judge("maybe");$("#c3").onclick=()=>judge("guess");
    const r=$("#redo");if(r)r.onclick=()=>{QS.order=[];QS.phase="answer";renderArea();renderFoot();};
    return;
  }
  if(q.format==="order"&&QS.order.length){f.innerHTML=`<button class="btn slim" id="redo">並べ直す</button>`;$("#redo").onclick=()=>{QS.order=[];renderArea();renderFoot();};return;}
  f.innerHTML=`<div class="ask">${q.format==="order"?"順番にタップして答えよう":"答えをタップしよう"}</div>`;
}

function judge(conf,recallOk){
  const q=QS.q,item=QS.item;
  let correct;
  if(q.format==="recall"||q.format==="write")correct=!!recallOk;
  else if(q.format==="order")correct=JSON.stringify(QS.order)===JSON.stringify(q.answer);
  else correct=QS.sel===q.answer;
  QS.correct=correct;QS.phase="reveal";
  const isBoss=q.id===SES.bossId&&!item.retry;
  let r={};let gain=0;let bonus=false;
  if(!item.retry){
    r=applyResult(q,correct,conf);
    SES.done.push(correct);if(correct)SES.firstOk++;
    if(!correct){SES.wrongIds.push(q.id);SES.queue.push({q,retry:true});}
    if(r.popped)SES.popped++;if(r.cracked)SES.cracked++;if(r.confWrong)SES.confNg++;
    if(isBoss)SES.boss=correct;
  }else{SES.retakes++;if(correct)SES.retakeOk++;}
  if(correct){SES.combo++;SES.maxCombo=Math.max(SES.maxCombo,SES.combo);gain=item.retry?4:10;if(SES.combo>=3)gain+=5;if(isBoss)gain+=20;if(!item.retry&&Math.random()<.1){bonus=true;gain*=2;}}
  else{SES.combo=0;gain=2;}
  if(conf&&conf!=="guess"&&!item.retry)gain+=1;
  SES.xp+=gain;S.xp+=gain;save();
  // 演出
  const qc=$("#qcard");qc.classList.remove("bounce","shake","burst");void qc.offsetWidth;
  if(r.popped){qc.classList.add("burst");tone(SND.pop);vib([20,40,20]);}
  else if(correct){qc.classList.add("bounce");tone(SND.ok);vib(15);}
  else{qc.classList.add("shake");tone(SND.ng);vib([40,30,40]);}
  if(isBoss&&correct){tone(SND.fan);confetti();}
  const cb=$("#combo");cb.innerHTML=SES.combo>=2?IC.flame+SES.combo:"";if(SES.combo>=2){cb.classList.remove("pop");void cb.offsetWidth;cb.classList.add("pop");}
  $(".prog").innerHTML=progHTML();
  renderArea();renderFoot();renderSheet(correct,conf,r,isBoss,gain,bonus);
}

function message(correct,conf,r,isBoss){
  if(isBoss)return pick(correct?MSG.bossWin:MSG.bossLose);
  if(r.popped)return "撃破！カードが弾けて消えた。もう自分の知識だ";
  if(r.cracked)return "ヒビが入った！別の日にもう1回正解で撃破";
  if(!correct&&conf==="sure")return pick(MSG.confNg);
  if(correct&&conf==="guess")return pick(MSG.guessOk);
  if(correct&&MSG.combo[SES.combo])return MSG.combo[SES.combo];
    return pick(correct?MSG.ok:MSG.ng);
}

function renderSheet(correct,conf,r,isBoss,gain,bonus){
  const q=QS.q;
  let notes="";
  if(q.format==="order"){
    notes=`<div class="sec-t">正しい順番</div><ol class="onotes">${q.answer.map((i,k)=>`<li><span class="m ok">${k+1}</span><span>${esc(q.options[i])}${q.optionNotes&&q.optionNotes[i]?`<br><span class="muted">${esc(q.optionNotes[i])}</span>`:""}</span></li>`).join("")}</ol>`;
  }else if(q.format!=="recall"&&q.format!=="write"&&q.optionNotes){
    notes=`<div class="sec-t">選択肢ごとの説明</div><ul class="onotes">${QS.perm.map((i,k)=>{const n=q.optionNotes[i];return `<li><span class="m ${i===q.answer?"ok":"ng"}">${CIRC[k]||k+1}</span><span>${esc(n)}${i===QS.sel&&i!==q.answer?` <span class="tag red">あなたの答え</span>`:""}</span></li>`;}).join("")}</ul>`;
  }
  const src=(q.sources||[]).map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)).join("<br>");
  $("#sheet").innerHTML=`<section class="sheet ${correct?"ok":"ng"}" aria-live="polite">
    <div class="verdict">${correct?IC.ok:IC.ng}<div><b>${correct?(isBoss?"BOSS撃破！":"正解！"):(isBoss?"BOSSに挑んだ！":"ナイスチャレンジ")}</b><div class="small">${esc(message(correct,conf,r,isBoss))}</div></div></div>
    <div class="row" style="gap:8px"><span class="xpchip">+${gain} XP</span>${bonus?`<span class="tag sky">ボーナス解説 XP×2</span>`:""}${r.guess?`<span class="tag red">リベンジに追加</span>`:""}${!correct&&!QS.item.retry?`<span class="tag red">リベンジに追加</span>`:""}</div>
    ${q.format!=="recall"&&q.format!=="write"&&q.format!=="order"&&!correct?`<div><div class="sec-t">正解</div><div style="font-weight:800">${CIRC[QS.perm.indexOf(q.answer)]||""} ${esc(q.options[q.answer])}</div></div>`:""}
    ${q.format==="recall"||q.format==="write"?`<div><div class="sec-t">答え</div><div style="font-weight:800">${esc(q.answerText)}</div>${q.format==="write"&&q.accept&&q.accept.length>1?`<div class="small muted">正解にする表記：${q.accept.map(esc).join("／")}</div>`:""}</div>`:""}
    ${q.format==="write"&&!correct&&!QS.item.retry&&(QS.typed||"").trim()?`<button class="btn slim" id="wfix">表記が違うだけで、合っていた</button>`:""}
    <div><div class="sec-t">解説</div><div>${esc(q.explanation)}</div></div>
    ${q.pitfall?`<div class="pit"><div class="sec-t">落とし穴</div><div>${esc(q.pitfall)}</div></div>`:""}
    ${notes}
    ${q.related?`<div><div class="sec-t">あわせて覚えると強い</div><div class="small">${esc(q.related)}</div></div>`:""}
    ${src?`<div class="src">出典：${src}</div>`:""}
    <div id="flagBox"><button class="btn slim" id="flagBtn">${IC.flag}これ合ってる？</button></div>
  </section>`;
  const wf=$("#wfix");if(wf)wf.onclick=()=>{fixWrite();};
  const fb=$("#flagBtn");fb.onclick=()=>{$("#flagBox").innerHTML=`<div class="stack"><input type="text" id="flagMemo" placeholder="どこが気になった？（なくてもOK）"><button class="btn slim sky" id="flagSave">印を付ける</button></div>`;$("#flagSave").onclick=()=>{S.flags.push({id:q.id,version:q.version||1,topic:q.topic,q:String(q.question).slice(0,60),memo:$("#flagMemo").value.trim(),day:today()});save();$("#flagBox").innerHTML=`<div class="note sky small">印を付けました。「仕上がり」タブで一覧にできます。</div>`;};};
  setTimeout(()=>{const s=$("#sheet .sheet");if(s)s.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});},250);
}

function checkWrite(){const q=QS.q;const v=norm(QS.typed);const acc=(q.accept&&q.accept.length?q.accept:[q.answerText]).map(norm);const ok=acc.includes(v);judge(ok?"sure":null,ok);}
function fixWrite(){ // 表記ゆれの自己申告：記録を正解に直す（勘扱い＝リベンジには残す）
  const q=QS.q,c=card(q.id),t=today();
  const L=S.log;for(let i=L.length-1;i>=0;i--){if(L[i].id===q.id&&L[i].d===t){L[i].ok=true;L[i].conf="guess";break;}}
  c.ng=Math.max(0,c.ng-1);c.ok++;c.confWrong=false;c.stage=Math.max(c.stage,1);c.due=t+1;c.revenge=true;
  SES.done[SES.done.length-1]=true;SES.firstOk++;SES.wrongIds=SES.wrongIds.filter(id=>id!==q.id);
  const qi=SES.queue.findIndex((it,i)=>i>SES.idx&&it.retry&&it.q.id===q.id);if(qi>=0)SES.queue.splice(qi,1);
  save();$(".prog").innerHTML=progHTML();const w=$("#wfix");if(w)w.outerHTML=`<div class="note green small">正解に直しました。念のためリベンジに残しています。</div>`;$("#next").textContent=SES.idx+1<SES.queue.length?"次へ":"結果を見る";
}
function next(){SES.idx++;if(SES.idx<SES.queue.length)showQ();else finish();}

function finish(){
  const t=today();
  S.days[t]=(S.days[t]||0)+1;
  const s=S.streak;let usedFreeze=false;
  if(s.last!==t){if(s.last===t-1)s.count++;else if(s.last===t-2&&s.freezeWeek!==weekOf(t)){s.count++;s.freezeWeek=weekOf(t);usedFreeze=true;}else s.count=1;s.last=t;}
  let cheer="";if(CHEERS.length&&[3,7,14,30].includes(s.count)&&!S.cheered.includes(s.count)){cheer=pick(CHEERS);S.cheered.push(s.count);}
  save();cloudPush();
  const sc=SES.firstOk,n=SES.first,rate=n?sc/n:0;
  const head=rate===1?"パーフェクト！":rate>=.8?"すばらしい仕上がり！":rate>=.5?"着実に前進！":"いい練習になった！";
  const good=[];good.push(`今日も${n}問を積み上げた`);if(SES.retakeOk)good.push(`間違えた問題を${SES.retakeOk}問その場で取り返した`);if(SES.popped)good.push(`リベンジを${SES.popped}問撃破`);if(SES.cracked)good.push(`${SES.cracked}問にヒビを入れた`);if(SES.maxCombo>=3)good.push(`最大${SES.maxCombo}連続正解`);if(SES.confNg)good.push(`思い込みを${SES.confNg}つ発見（ここが一番伸びる）`);
  const wrongLeft=SES.wrongIds.filter(id=>S.cards[id]&&S.cards[id].revenge).length;
  const sets=S.days[t];
  const R=$("#result");
  R.innerHTML=`<div class="wrap stack">
    <div class="big">${esc(head)}</div>
    ${SES.boss===true?`<div class="note" style="text-align:center;font-weight:800">${IC.crown.replace('<svg','<svg width="22" height="22" style="vertical-align:-4px;color:var(--gold)"')} BOSS撃破</div>`:SES.boss===false?`<div class="note sky" style="text-align:center">BOSSはリベンジに登録。次は倒せる</div>`:""}
    <div class="card stack"><div class="sec-t">今日よかったこと</div><ul style="margin:0;padding-left:1.2em">${good.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div>
    <div class="stats">
      <div class="stat"><b>${sc}/${n}</b><span>正解</span></div>
      <div class="stat"><b>+${SES.xp}</b><span>XP</span></div>
      <div class="stat"><b>${s.count}</b><span>連続日数</span></div>
    </div>
    ${usedFreeze?`<div class="note sky small">お休みチケットを使って、連続記録をつなげました。</div>`:""}
    ${cheer?`<div class="note"><div class="sec-t">家族から</div>${esc(cheer)}</div>`:""}
    ${sets>=5?`<div class="note sky">${MSG.rest}</div>`:""}
    ${wrongLeft?`<button class="btn red" id="goRv">間違えた${wrongLeft}問を今すぐリベンジ</button>`:""}
    <button class="btn ${wrongLeft?"":"primary"}" id="again">${sets>=5?"それでももう1セット":"もう1セット"}</button>
    <button class="btn slim" id="home">ホームへ</button>
  </div>`;
  R.hidden=false;R.scrollTop=0;$("#quiz").hidden=true;
  const mode=SES.mode;SES=null;
  const close=()=>{R.hidden=true;$("#tabs").hidden=false;document.body.style.overflow="";};
  const g=$("#goRv");if(g)g.onclick=()=>{close();startSession("revenge");};
  $("#again").onclick=()=>{close();startSession(mode==="revenge"?"daily":mode);};
  $("#home").onclick=()=>{close();setTab("daily");};
  if(rate===1)confetti();
}

/* ===== 紙吹雪 ===== */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx");c.hidden=false;const x=c.getContext("2d");const W=c.width=innerWidth,H=c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=["--green","--yellow","--sky","--red","--gold"].map(v=>cs.getPropertyValue(v).trim()||"#58CC02");
  const P=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*11-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});if(++f<110)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.hidden=true;}})();
}

setTab("daily");
</script>
