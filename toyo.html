なればなるほど、道具は私たちにとって遠い存在になる」とはどういうことか。最も適当なものを、次の5つから一つ選べ。\n\nかつてのラジオや時計は、裏ぶたを開ければ歯車や部品が見え、使う人が仕組みを想像することができた。今日の電子機器は、はるかに高性能になったが、内部は小さな部品に密閉され、利用者が中をのぞいても何が起きているのかは分からない。私たちは、仕組みを理解しないまま、画面に触れれば望む結果が得られることに慣れていく。こうして、①道具が便利になればなるほど、道具は私たちにとって遠い存在になる。故障したとき、自分では手の施しようがなく、ただ買い替えるしかないのは、その表れである。", "options": ["道具が高性能になるにつれて値段が上がり、誰もが気軽に手に入れられるものではなくなっていくということ。", "道具が便利になるほど人々は道具を使う機会が減り、日常生活から道具が姿を消していくということ。", "道具が使いやすくなるほど、その仕組みは利用者の理解の及ばないものとなり、自分の手では扱いきれない存在になっていくということ。", "道具の内部が見えなくなったために、人々は道具の便利さそのものに気づかなくなっていくということ。", "道具が便利になったのは、人々が道具の仕組みに関心を持たなくなった結果であるということ。"], "answer": 2, "answerText": "道具が使いやすくなるほど、その仕組みは利用者の理解の及ばないものとなり、自分の手では扱いきれない存在になっていくということ。", "explanation": "「遠い存在」とは、物理的な距離ではなく、仕組みが分からず、故障しても「手の施しようがない」ほど理解や手の届かないものになることを指す。仕組みが分からない（前）と、自分では直せない（後）の両方をふまえたものが適当。", "optionNotes": ["誤り。値段の話は本文にない。", "誤り。本文は便利な道具に「慣れていく」と述べており、使う機会が減るわけではない（逆）。", "正解。傍線部の前（仕組みを理解しない）と後（手の施しようがない）に対応する。", "誤り。見えなくなるのは仕組みであって、便利さに気づかなくなるとは本文にない（すり替え）。", "誤り。本文では、仕組みが見えなくなった結果、理解しないまま使うことに慣れる。原因と結果が逆。"], "pitfall": "「遠い」を文字どおりに読むと、値段が上がる・生活から姿を消すといった選択肢に引かれる。比喩の言い換えは、傍線部の前後で具体的に何が起きているかから決める。", "related": "「手の施しようがない」は処置のしようがないこと。仕組みが外から見えないことを「ブラックボックス化」ということもある。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「手の施しようがない」", "url": "https://kotobank.jp/word/%E6%89%8B%E3%81%AE%E6%96%BD%E3%81%97%E3%82%88%E3%81%86%E3%81%8C%E3%81%AA%E3%81%84-573155", "checked": "2026-10-31"}]}, {"id": "tk-gendai-020", "version": 1, "status": "verified", "category": "gendai", "topic": "傍線部の理由（分かりやすさが理解を妨げる）", "format": "choice4", "difficulty": 3, "question": "次の文章の傍線部①「分かりやすい説明は、ときに理解を妨げる」とあるが、そう言えるのはなぜか。最も適当なものを、次の5つから一つ選べ。\n\n近ごろは、難しい話題を短い言葉や図で分かりやすく伝える工夫があふれている。分かりやすさは、多くの人に関心を持ってもらう入り口として大切である。しかし、複雑な問題を単純な図式に置き換えるとき、そこからこぼれ落ちるものが必ずある。しかも、一度分かったと感じた人は、それ以上考えようとしなくなりやすい。①分かりやすい説明は、ときに理解を妨げる。本当に理解するとは、単純な答えに満足せず、割り切れない部分に目を向け続けることだからである。", "options": ["分かりやすい説明は、問題の複雑な部分を切り捨てたうえで受け手に分かったという感覚を与え、それ以上考えることをやめさせてしまうことがあるから。", "分かりやすい説明は内容が誤っていることが多く、受け手に間違った知識を植えつけてしまうから。", "分かりやすい説明は多くの人に関心を持たせるが、関心を持った人ほど難しい説明を求めるようになるから。", "分かりやすさを求める人が増えたことで、説明する側が複雑な問題を扱うことを避けるようになったから。", "分かりやすい説明は問題を単純な図式に置き換えるため、受け手はかえって説明の内容を覚えにくくなるから。"], "answer": 0, "answerText": "分かりやすい説明は、問題の複雑な部分を切り捨てたうえで受け手に分かったという感覚を与え、それ以上考えることをやめさせてしまうことがあるから。", "explanation": "傍線部の前に「図式に置き換えるとこぼれ落ちるものがある」「分かったと感じた人はそれ以上考えなくなる」、後に「本当の理解は割り切れない部分に目を向け続けること」とある。複雑な部分が切り捨てられ、考えるのをやめてしまうので、本当の理解に届かなくなる。これをまとめたものが適当。", "optionNotes": ["正解。傍線部の前の二つの事情と、後の「本当に理解する」の定義に対応。", "誤り。本文は内容が誤っているとは言っていない（本文にない・言い過ぎ）。", "誤り。関心を持った人が難しい説明を求めるとは本文にない。", "誤り。説明する側の態度の変化は本文にない。", "誤り。問題は「覚えにくい」ことではなく、それ以上考えなくなること（すり替え）。"], "pitfall": "「しかも」は前と同じ方向の内容を付け加える語。前の「こぼれ落ちる」と、後の「考えなくなる」の二つを両方含む選択肢を選ぶ。", "related": "「図式」は物事の関係を分かりやすく示した図や枠組み。「割り切れない」は単純に結論を出せないこと。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「図式」", "url": "https://kotobank.jp/word/%E5%9B%B3%E5%BC%8F-83788", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-009", "category": "kobun_bunpo", "topic": "「る」「らる」の接続（四段には「る」、下二段には「らる」）と受身", "difficulty": 2, "question": "次は『枕草子』「ありがたきもの」の段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。\n\nありがたきもの。舅にほめ「らるる」婿。また姑に思は「るる」嫁の君。\n\n＊ありがたし＝めったにない。＊舅（しうと）＝妻の父。＊姑（しうとめ）＝夫の母。\n\n傍線部「らるる」「るる」の説明として最も適当なものを選べ。", "options": ["どちらも受身の助動詞の連体形。下二段動詞「ほむ」の未然形「ほめ」には「らる」が、四段動詞「思ふ」の未然形「思は」には「る」が付いている", "どちらも尊敬の助動詞の連体形。「ほめ」「思は」はどちらも未然形で、意味の違いはない", "「らるる」は受身、「るる」は自発の助動詞で、どちらも連用形に付いている", "どちらも受身の助動詞の連体形。「ほめ」は連用形なので「らる」が、「思は」は未然形なので「る」が付いている", "「らるる」は受身の助動詞「らる」の連体形、「るる」は完了の助動詞「り」の連体形"], "answer": 0, "answerText": "どちらも受身の助動詞の連体形。下二段「ほめ」（未然形）には「らる」、四段「思は」（未然形）には「る」", "explanation": "「る」「らる」はどちらも未然形に付くが、四段・ナ変・ラ変の未然形（ア段の音）には「る」、それ以外の動詞には「らる」が付く。「ほめ」は下二段「ほむ」の未然形なので「らる」、「思は」は四段「思ふ」の未然形なので「る」。「舅に」「姑に」と動作をする人が「に」で示されているので受身。体言（婿・嫁の君）に続く連体形。（舅にほめられる婿、姑にかわいがられる嫁）", "optionNotes": ["正しい。違いは意味ではなく、上の動詞の活用の種類（＝接続）。", "「舅に」「姑に」と、される側から言っているので受身。舅が婿をほめなさる、という尊敬の文ではない。", "「姑に思はるる」は「姑にかわいがられる」で受身。また「ほめ」「思は」はどちらも未然形。", "「らる」も未然形に付く。下二段は未然形と連用形が同じ「ほめ」なので、ここは未然形と考える。", "完了「り」は四段の已然形（思へ）に付いて「思へる」となる。「思はるる」は未然形「思は」＋「る」の連体形。"], "pitfall": "「らるる」と「るる」で意味が変わるのではない。上の動詞が四段・ナ変・ラ変なら「る」、それ以外なら「らる」と、接続で使い分けている。「…に」とされる側が示されていれば受身。", "related": "「す」「さす」も同じ使い分け（四段・ナ変・ラ変の未然形には「す」、それ以外には「さす」）。", "sources": [{"title": "枕草子 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SeiMaku/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「らる」", "url": "https://kobun.weblio.jp/content/%E3%82%89%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「る」", "url": "https://kobun.weblio.jp/content/%E3%82%8B", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-010", "category": "kobun_bunpo", "topic": "用言の活用（自動詞「抜く」はカ行下二段）", "difficulty": 3, "question": "次は『枕草子』「ありがたきもの」の段の一節で、めったにないものの一つとして挙げられている（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。\n\n物よく「抜くる」銀（しろがね）の毛抜。\n\n＊毛抜＝毛を抜く道具。\n\n傍線部「抜くる」の活用の種類と活用形の組み合わせとして最も適当なものを選べ。", "options": ["カ行四段活用・連体形", "カ行上二段活用・連体形", "カ行下二段活用・終止形", "カ行下二段活用・連体形", "カ行変格活用・連体形"], "answer": 3, "answerText": "カ行下二段活用・連体形", "explanation": "「抜く」には、四段活用の他動詞（引き抜く）と、下二段活用（け／け／く／くる／くれ／けよ）の自動詞（抜ける）がある。「抜くる」という形は下二段の連体形にしかない。毛抜で毛が「よく抜ける」の意味で、体言「銀の毛抜」に続くので連体形。", "optionNotes": ["四段（か／き／く／く／け／け）なら連体形は「抜く」で、「抜くる」という形にならない。", "上二段なら「き／き／く／くる／くれ／きよ」。「抜く」に上二段の活用はない。", "終止形は「抜く」。「抜くる」は体言「毛抜」に続く連体形。", "正しい。自動詞「抜く（＝抜ける）」は下二段で、連体形が「抜くる」。", "カ変は「来（く）」（と複合語）だけ。"], "pitfall": "同じ字の動詞でも、自動詞と他動詞で活用の種類が違うことがある。「〜くる」「〜つる」「〜ゆる」など「u段＋る」の連体形は、二段活用（またはカ変・サ変）のしるし。", "related": "現代語で「〜ける」になる自動詞は、古語では下二段のことが多い（抜く＝抜ける、焼く＝焼ける、解く＝解ける）。", "sources": [{"title": "枕草子 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SeiMaku/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「抜く」", "url": "https://kobun.weblio.jp/content/%E6%8A%9C%E3%81%8F", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-011", "category": "kobun_bunpo", "topic": "上一段「似る」の活用形と自発の「る」", "difficulty": 2, "question": "次は『源氏物語』若紫巻の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。北山で少女（のちの紫の上）を垣間見た光源氏が、なぜその子から目が離せないのかに気づく場面。\n\nさるは、限りなう心を尽くしきこゆる人に、いとよう「A似」たてまつれるが、まもら「Bるる」なりけり、と思ふにも涙ぞ落つる。\n\n＊さるは＝実は。＊限りなう心を尽くしきこゆる人＝源氏がこの上なく恋い慕っている人（藤壺）。＊まもる＝じっと見つめる。\n（本文の「」は省いた）\n\n傍線部A「似」の活用の種類・活用形と、B「るる」の文法的意味の組み合わせとして最も適当なものを選べ。", "options": ["A ナ行上二段活用・連用形／B 受身", "A ナ行上一段活用・連用形／B 自発", "A ナ行上一段活用・未然形／B 尊敬", "A ナ行下二段活用・連用形／B 自発", "A ナ行上一段活用・連用形／B 可能"], "answer": 1, "answerText": "A ナ行上一段活用・連用形／B 自発", "explanation": "A「似る」はナ行上一段（に／に／にる／にる／にれ／によ）。未然形と連用形が同じ「に」なので下で判断する。謙譲の補助動詞「たてまつる」に続くので連用形。B 四段「まもる」の未然形「まもら」に付く「る」の連体形。少女が藤壺によく似ているので「自然と見つめてしまうのだった」と、源氏が自分の心の動きに気づく場面なので自発。", "optionNotes": ["「似る」は上一段（「似る」「似れ」の形がある）。また、見つめているのは源氏自身で、誰かに見つめられるのではない。", "正しい。上一段の連用形＋たてまつる、心の動きを表す自発の「る」。", "補助動詞「たてまつる」に続くのは連用形。また「るる」の上に尊敬語がなく、地の文で源氏の心中を述べる部分なので尊敬ではない。", "「似る」は「に・に・にる・にる・にれ・によ」と活用する上一段で、下二段ではない。", "可能の「る」は平安時代には多く打消を伴う。ここは「思わず見つめてしまう」という心の動きで自発。"], "pitfall": "上一段は未然形と連用形が同じ形なので、下に続く語で決める（て・たり・けり・たてまつる→連用形、ず・む→未然形）。「る・らる」が心の動き・知覚の動詞（思ふ・しのぶ・ながむ・まもる など）に付いたら、まず自発を考える。", "related": "上一段の主な語：干る・射る・鋳る・着る・似る・煮る・見る・居る・率る（「ひ・い・き・に・み・ゐ」＋る）。", "sources": [{"title": "源氏物語 若紫 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/MurGenj/vol5.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「似る」", "url": "https://kobun.weblio.jp/content/%E4%BC%BC%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「る」", "url": "https://kobun.weblio.jp/content/%E3%82%8B", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-012", "category": "kobun_bunpo", "topic": "「召させん」の分解（四段未然形＋使役「す」＋意志「む」）", "difficulty": 3, "question": "次は『徒然草』第二百三十六段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改め、本文の「掻餅」は「かいもちひ」とかなで書いた）。聖海上人が、丹波の出雲神社への参拝に人々を誘う場面。\n\n丹波に出雲といふ所あり。大社を移して、めでたく造れり。しだのなにがしとかやしる所なれば、秋の比、聖海上人、その外も人数多誘ひて、「いざ給へ、出雲拝みに。かいもちひ「召させん」」とて、具しもて行きたるに、\n\n＊かいもちひ＝ぼたもちの類。＊召す＝ここでは「食ふ」の尊敬語（召し上がる）。\n\n傍線部「召させん」の文法的説明として最も適当なものを選べ。", "options": ["尊敬の動詞「召す」の未然形＋尊敬の助動詞「さす」の未然形＋推量の助動詞「む」の終止形", "尊敬の動詞「召す」の連用形＋使役の助動詞「さす」の連用形＋意志の助動詞「む」の終止形", "尊敬の動詞「召す」の未然形＋尊敬の助動詞「す」の未然形＋意志の助動詞「む」の終止形", "尊敬の動詞「召す」の未然形＋使役の助動詞「す」の未然形＋推量の助動詞「む」の終止形", "尊敬の動詞「召す」の未然形＋使役の助動詞「す」の未然形＋意志の助動詞「む」の終止形"], "answer": 4, "answerText": "「召す」の未然形「召さ」＋使役「す」の未然形「せ」＋意志「む（ん）」", "explanation": "「召させん」＝「召さ（四段「召す」の未然形）＋せ（使役「す」の未然形）＋ん（意志「む」の終止形）」。「す」は四段・ナ変・ラ変の未然形に付く。上人が人々に「ぼたもちを召し上がらせよう（＝ごちそうしよう）」と言っているので使役。これからする自分の行為を言うので「む」は意志。", "optionNotes": ["「召す」は四段なので未然形は「召さ」。四段には「さす」ではなく「す」が付く。また「さす」が尊敬になるのは「させ給ふ」のように尊敬語と重なるとき。", "連用形なら「召し」。「召させ」の「さ」は「召す」の未然形の語尾で、「召」＋「させ」とは切れない。", "「す」が尊敬になるのは「せ給ふ」「せおはします」のように尊敬語と重なるとき。ここは単独で、人々に食べさせる意味なので使役。", "分解は正しいが、話し手の上人自身がこれからすることを言っているので「む」は意志。", "正しい。召さ（未然形）＋せ（使役）＋ん（意志）。"], "pitfall": "「〜させ」を見たらすぐ助動詞「さす」と切らない。四段動詞の未然形の語尾「さ」＋助動詞「す」のことがある（召させ＝召さ＋せ）。上の動詞が四段なら「す」、下二段などなら「さす」。", "related": "「す・さす・しむ」は、単独なら使役。下に「給ふ」「おはします」などが付くと尊敬のことが多い（ただし文中に使役の相手がいれば使役）。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「召す」", "url": "https://kobun.weblio.jp/content/%E5%8F%AC%E3%81%99", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「す」", "url": "https://kobun.weblio.jp/content/%E3%81%99", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「む」", "url": "https://kobun.weblio.jp/content/%E3%82%80", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-013", "category": "kobun_bunpo", "topic": "ワ行下二段「飢う」の活用形と使役の「しむ」", "difficulty": 3, "question": "次は『徒然草』第百四十二段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた。中略あり）。盗みや罪をなくすための政治のあり方を論じている。\n\nされば、盗人をいましめ、僻事をのみ罪せんよりは、世の人の「A饑ゑ」ず寒からぬやうに、世をば行はまほしきなり。（中略）人を苦しめ、法を犯さ「Bしめ」て、それを罪なはん事、不便のわざなり。\n\n＊僻事＝悪事。＊「饑ゑ」は「うゑ」と読む。＊罪なふ＝処罰する。＊不便のわざ＝気の毒なこと。\n\n傍線部A「饑ゑ」の活用の種類・活用形と、B「しめ」の文法的意味・活用形の組み合わせとして最も適当なものを選べ。", "options": ["A ワ行下二段活用・連用形／B 尊敬・連用形", "A ハ行四段活用・未然形／B 使役・連用形", "A ワ行下二段活用・未然形／B 使役・連用形", "A ア行下二段活用・未然形／B 使役・未然形", "A ワ行下二段活用・未然形／B 尊敬・連用形"], "answer": 2, "answerText": "A ワ行下二段活用・未然形／B 使役・連用形", "explanation": "A「饑う（飢う）」はワ行下二段（ゑ／ゑ／う／うる／うれ／ゑよ）。下に打消の「ず」が付くので未然形（世の人が飢えず寒くないように）。B「しむ」は使役・尊敬の助動詞。ここは（為政者が）人々に法を犯させて、それを処罰する、という意味なので使役。接続助詞「て」に続くので連用形。", "optionNotes": ["「ず」は未然形に付く。下二段は未然形と連用形が同じ「ゑ」なので、下の語で決める。また「しめ」は人々に「犯させる」意味で使役。", "「ゑ」はワ行の字。ハ行四段なら「飢はず」となるはず。", "正しい。ワ行下二段の未然形＋ず、使役「しむ」の連用形＋て。", "ア行下二段は「得（う）」と「心得」などの複合語だけ。また「て」に続く「しめ」は連用形。", "「しむ」が尊敬になるのは「しめ給ふ」のように尊敬語と重なり、使役の相手がいないとき。ここは単独で使役。"], "pitfall": "ワ行下二段は「植う・飢う・据う」の3語だけで、「植ゑ・飢ゑ・据ゑ」と「ゑ」で書く。ア行の「え」（得）、ヤ行の「え」（見ゆ・聞こゆ など）と区別する。", "related": "ア行下二段＝得（心得・所得）。ヤ行下二段＝覚ゆ・聞こゆ・見ゆ・消ゆ・越ゆ など。ワ行下二段＝植う・飢う・据う。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「飢う」", "url": "https://kobun.weblio.jp/content/%E9%A3%A2%E3%81%86", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「しむ」", "url": "https://kobun.weblio.jp/content/%E3%81%97%E3%82%80", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-014", "category": "kobun_bunpo", "topic": "「む」の意味（推量・仮定婉曲・意志）の識別", "difficulty": 2, "question": "次は『大鏡』「道長」の一節（いわゆる「肝試し」）である（本文はウィキソース所収『国文大観』本による。表記は読みやすく一部改めた。中略あり）。雨の激しい夜、殿上で怖い話をしていた花山天皇が、こう言い出した。\n\n「今宵こそいとむつかしげなる夜なめれ。かく人がちなるにだにけしきおぼゆ。まして物離れたる所などいかなら「Aむ」。さあら「Bむ」所に一人いなむや」と（中略）、入道殿は「いづくなりともまかりな「Cむ」」と申し給ひければ、\n\n＊むつかしげなり＝気味が悪い。＊人がちなり＝人が多い。＊けしきおぼゆ＝ぞっとする。＊入道殿＝藤原道長（このときはまだ若い）。＊まかる＝参る（「行く」の謙譲語）。\n\n傍線部A〜Cの「む」の文法的意味の組み合わせとして最も適当なものを選べ。", "options": ["A 推量／B 適当／C 意志", "A 意志／B 仮定・婉曲／C 推量", "A 推量／B 仮定・婉曲／C 推量", "A 推量／B 仮定・婉曲／C 意志", "A 適当／B 推量／C 意志"], "answer": 3, "answerText": "A 推量／B 仮定・婉曲／C 意志", "explanation": "A 文末にあり、主語は「物離れたる所」の様子（三人称）なので推量（人けのない所などはどんなだろう）。B 体言「所」に続く連体形なので仮定・婉曲（そのような所に）。C「まかり（四段の連用形）＋な（完了「ぬ」の未然形・強意）＋む」。主語は話し手の道長自身なので意志（どこへでもきっと参りましょう）。", "optionNotes": ["Bは体言「所」に続く連体形の用法で、「…するのがよい」という適当・勧誘ではない。", "Aは人ではなく場所の様子を推し量っているので推量。Cは話し手自身の行為なので意志。", "Cの主語は話し手の道長（一人称）なので意志。", "正しい。", "Aは何かを勧めているのではなく、様子を推し量っている。Bは体言に続く連体形で仮定・婉曲。"], "pitfall": "文末の「む」は主語の人称で考える（一人称→意志、二人称→適当・勧誘、三人称→推量）。体言や助詞に続く連体形の「む」は仮定・婉曲。", "related": "「なむ」「てむ」の「な」「て」は確述（強意）。「まかりなむ」＝きっと参りましょう。", "sources": [{"title": "大鏡（国文大観）本文（ウィキソース）", "url": "https://ja.wikisource.org/wiki/%E5%A4%A7%E9%8F%A1_%28%E5%9C%8B%E6%96%87%E5%A4%A7%E8%A7%80%29", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「む」", "url": "https://kobun.weblio.jp/content/%E3%82%80", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ぬ」", "url": "https://kobun.weblio.jp/content/%E3%81%AC", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-015", "category": "kobun_bunpo", "topic": "「べし」（可能）・「ね」（打消）・「む」（婉曲）の識別", "difficulty": 3, "question": "次は『方丈記』で、元暦二年（1185年）の大地震のようすを記した一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。この本文は流布本系で、大福光寺本などとは字句が一部異なる。表記は読みやすく改めた）。\n\n家の中に居れば、忽ちにうちひしげなむとす。走り出づれば、また地割れ裂く。羽なければ、空へもあがる「Aべから」ず。龍なら「Bね」ば、雲にのぼら「Cむ」こと難し。\n\n＊うちひしぐ＝押しつぶされる。\n\n傍線部A〜Cの文法的意味の組み合わせとして最も適当なものを選べ。", "options": ["A 可能／B 打消／C 仮定・婉曲", "A 当然／B 完了／C 推量", "A 可能／B 完了／C 意志", "A 推量／B 打消／C 仮定・婉曲", "A 当然／B 打消／C 推量"], "answer": 0, "answerText": "A 可能／B 打消／C 仮定・婉曲", "explanation": "A 羽がないので空へも上がることが「できない」。打消と組んだ「べからず」は不可能を表すことが多く、ここは可能の「べし」。B 断定「なり」の未然形「なら」に付く「ね」は、打消「ず」の已然形（龍ではないので）。C 体言「こと」に続く連体形なので仮定・婉曲（雲に上るようなことは難しい）。", "optionNotes": ["正しい。", "「なら」は未然形。完了「ぬ」は連用形に付くので、ここは打消。Cも体言に続く連体形の用法。", "Bは未然形に付く打消。Cの「雲にのぼらむこと」は話し手の意志ではなく、体言に続く婉曲。", "Aは「羽がないので上がれない」という能力の問題なので可能。推量（きっと…だろう）では文意に合わない。", "Aを当然と取ると「上がるはずがない」となり、「羽がないので（できない）」とのつながりが弱い。Cは体言に続く連体形で婉曲。"], "pitfall": "「ね」は上の形で見分ける。未然形＋ね→打消「ず」の已然形（下に「ば・ども」が多い）、連用形＋ね→完了「ぬ」の命令形。「なら」「龍なら」は断定「なり」の未然形。", "related": "「べし」の意味はスイカトメテ（推量・意志・可能・当然・命令・適当）。打消を伴う「べからず」「べくもあらず」は不可能のことが多い。", "sources": [{"title": "方丈記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/ChoHojo/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「べし」", "url": "https://kobun.weblio.jp/content/%E3%81%B9%E3%81%97", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ず」", "url": "https://kobun.weblio.jp/content/%E3%81%9A", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「む」", "url": "https://kobun.weblio.jp/content/%E3%82%80", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-016", "category": "kobun_bunpo", "topic": "「けむ」の意味（過去推量・過去の伝聞婉曲）の識別", "difficulty": 3, "question": "次のA〜Cの傍線部「けむ（けん）」の文法的意味の組み合わせとして最も適当なものを選べ（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。\n\nA 足柄山のふもとに宿った夜、どこからともなく遊女が三人現れた。（『更級日記』「足柄山」）\n　昔、こはたといひ「けむ」が孫といふ。\n\nB・C 村上天皇の女御が『古今和歌集』をすべて暗記していたという昔の話を聞いて、作者が感想を述べる。（『枕草子』「清涼殿の丑寅の隅の」）\n　聞えさせ給ひけんほど、いかにめでたくをかしかり「Bけん」。御前に侍ひ「Cけん」人さへこそ羨しけれ。\n\n＊こはた＝昔の有名な遊女の名。＊侍ふ＝お仕えする。", "options": ["A 過去推量／B 過去の伝聞・婉曲／C 過去推量", "A 過去の伝聞・婉曲／B 過去推量／C 過去の伝聞・婉曲", "A 過去の伝聞・婉曲／B 過去の原因推量／C 過去推量", "A 過去推量／B 過去の原因推量／C 過去の伝聞・婉曲", "A 過去の原因推量／B 過去推量／C 過去の伝聞・婉曲"], "answer": 1, "answerText": "A 過去の伝聞・婉曲／B 過去推量／C 過去の伝聞・婉曲", "explanation": "「けむ」は過去のことについて、（ア）過去推量（…ただろう）、（イ）過去の原因推量（どうして…たのだろう）、（ウ）過去の伝聞・婉曲（…たとかいう・…たような）を表す。A「こはたといひけむ」は下の「が（＝人）」に続く連体形で、「昔こはたといったとかいう（遊女の）孫」→伝聞・婉曲。B「いかに…けん」は「どんなにすばらしく趣深かっただろう」と過去の様子を推し量る→過去推量。C 体言「人」に続く連体形で「（その場に）お仕えしていたような人までもうらやましい」→伝聞・婉曲。", "optionNotes": ["Aは「が（人）」に、Cは体言「人」に続く連体形の用法。過去推量ではない。", "正しい。", "Bの「いかに」は「どんなに」と程度を表す語で、理由を問う「どうして」ではない。Cは体言に続く連体形の用法。", "Aは体言相当の語に続く連体形で伝聞・婉曲。Bは程度の推量で、原因推量ではない。", "Aは理由を推し量っているのではなく、昔そう呼ばれたと人づてに聞いたことを言っている。"], "pitfall": "「けむ」が体言（や体言のはたらきをする語）に続くときは、まず伝聞・婉曲を考える。疑問語があっても、「いかに＋形容詞（どんなに…）」は程度で、過去推量。理由を問う「など・なぜ・いかで」と組むときが原因推量。", "related": "「らむ」（現在）と「けむ」（過去）は、推量・原因推量・伝聞婉曲の三用法がきれいに対応している。「けむ」は連用形に付く。", "sources": [{"title": "更級日記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SugSara/text.html", "checked": "2026-10-31"}, {"title": "枕草子 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SeiMaku/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「けむ」", "url": "https://kobun.weblio.jp/content/%E3%81%91%E3%82%80", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-017", "category": "kobun_bunpo", "topic": "「え得まじかり」（ア行下二段「得」の終止形＋不可能推量「まじ」）", "difficulty": 3, "question": "次は『伊勢物語』第六段（芥川）の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文〔かな書き〕に、Wikibooks「高等学校国語総合/伊勢物語」の本文を参考にして漢字をあてた）。\n\n昔、男ありけり。女の「え得まじかりける」を、年を経てよばひわたりけるを、からうじて盗み出でて、いと暗きに来けり。\n\n＊「得」は「う」と読む。＊よばひわたる＝求婚し続ける。\n\n傍線部「え得まじかりける」の文法的説明として最も適当なものを選べ。", "options": ["「得」はア行下二段活用の連用形、「まじかり」は打消推量の助動詞「まじ」の連用形", "「得」はア行下二段活用の未然形、「まじかり」は不可能推量の助動詞「まじ」の連用形", "「得」はア行下二段活用の終止形、「まじかり」は打消意志の助動詞「まじ」の連用形", "「得」はア行上二段活用の終止形、「まじかり」は不可能推量の助動詞「まじ」の終止形", "「得」はア行下二段活用の終止形、「まじかり」は不可能推量の助動詞「まじ」の連用形"], "answer": 4, "answerText": "「得」はア行下二段の終止形、「まじかり」は不可能推量「まじ」の連用形", "explanation": "「まじ」は終止形に付く（ラ変型には連体形）。「得（う）」はア行下二段（え／え／う／うる／うれ／えよ）で、「う」と読むのは終止形。副詞「え」と呼応して「とても手に入れられそうにない」→不可能推量。下に過去「けり」（連用形に付く）が続くので、補助活用の連用形「まじかり」。（男がとても妻にできそうになかった女を…）", "optionNotes": ["連用形なら「え」と読む。「う」は終止形。意味も、副詞「え」と呼応しているので不可能推量。", "未然形も「え」。「まじ」は終止形に付く。", "打消意志は話し手の「決して…まい」という意志。ここは副詞「え」と呼応した不可能（…できそうにない）。", "「得」は下二段。「まじかり」は「けり」に続くので連用形。", "正しい。"], "pitfall": "「えうまじ」の「え」は副詞（え〜打消＝…できない）、「う」が動詞「得」。「得」は一字で一語なので、語幹と語尾の区別がない。", "related": "「まじ」の補助活用（まじから・まじかり・まじかる）は、下に助動詞が付くときに使う。「え〜まじ」は不可能推量の代表的な形。", "sources": [{"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "Wikibooks「高等学校国語総合/伊勢物語」（芥川・筒井筒の本文と訳）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E4%BC%8A%E5%8B%A2%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「得」", "url": "https://kobun.weblio.jp/content/%E5%BE%97", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「まじ」", "url": "https://kobun.weblio.jp/content/%E3%81%BE%E3%81%98", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-018", "category": "kobun_bunpo", "topic": "「なり」の識別（伝聞推定・断定、撥音無表記「あなる」）", "difficulty": 3, "question": "次は『徒然草』第八十九段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。\n\n「奥山に猫またといふものありて、人を食ふ「Aなる」」と、人の言ひけるに、「山「Bなら」ねども、これらにも猫の経上りて、猫またになりて、人とる事はあ「Cなる」ものを」と言ふ者ありけるを、\n\n＊猫また＝年を経た猫が化けたという妖怪。＊経上る＝年を経て化ける。\n\n傍線部A〜Cの助動詞の文法的意味の組み合わせとして最も適当なものを選べ。", "options": ["A 断定／B 断定／C 伝聞推定", "A 断定／B 伝聞推定／C 断定", "A 伝聞推定／B 断定／C 伝聞推定", "A 伝聞推定／B 伝聞推定／C 断定", "A 断定／B 断定／C 断定"], "answer": 2, "answerText": "A 伝聞推定／B 断定／C 伝聞推定", "explanation": "A 四段「食ふ」は終止形と連体形が同じ形なので、接続からは決められない。「…と人の言ひける」とうわさとして語られているので伝聞（人を食うそうだ）。B 体言「山」に付くので断定「なり」の未然形（山ではないけれども）。C「あなる」は「ある（ラ変の連体形）＋なる」が「あんなる」と撥音便になり、「ん」が書かれない形。ラ変型に付く伝聞推定（人をとることはあるそうだよ）。", "optionNotes": ["Aは、人から聞いたうわさとして語られている言葉なので伝聞。", "Bは体言「山」に付くので断定。Cは撥音便の無表記「あ（ん）なる」で伝聞推定。", "正しい。", "Bは体言に付くので断定。伝聞推定の「なり」は終止形（ラ変型には連体形）に付く。", "Cの「あなる」は「あんなる」の「ん」が書かれない形で、伝聞推定の目印。"], "pitfall": "「あなり・ななり・ざなり・べかなり」など撥音便（の無表記）の下の「なり」は伝聞推定。四段動詞＋「なり」は終止形と連体形が同形なので、うわさ・音声などの文脈で判断する。", "related": "断定「なり」は体言・連体形に、伝聞推定「なり」は終止形（ラ変型には連体形）に付く。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「なり」", "url": "https://kobun.weblio.jp/content/%E3%81%AA%E3%82%8A", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-019", "category": "kobun_bunpo", "topic": "「たり」の識別（断定と完了・存続、接続で判断）", "difficulty": 2, "question": "次は『平家物語』巻第一「殿上闇討」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた。中略あり）。\n\nしかるを忠盛備前守「Aたり」し時、鳥羽院の御願得長寿院を造進して、三十三間の御堂を建て、一千一体の御仏を据ゑ奉る。（中略）勧賞には闕国を給ふべき由仰せ下されける。境節但馬国のあき「Bたり」けるを給ひにけり。\n\n＊忠盛＝平忠盛（清盛の父）。＊勧賞＝ほうび。＊闕国＝国司が欠けている国。＊境節＝ちょうどそのとき。\n\n傍線部A・Bの「たり」の説明の組み合わせとして最も適当なものを選べ。", "options": ["A 体言に付く断定の「たり」／B 連用形に付く完了・存続の「たり」", "A 連用形に付く完了・存続の「たり」／B 体言に付く断定の「たり」", "A 体言に付く断定の「たり」／B 連体形に付く断定の「たり」", "A 終止形に付く完了・存続の「たり」／B 連用形に付く完了・存続の「たり」", "A 体言に付く完了・存続の「たり」／B 未然形に付く完了・存続の「たり」"], "answer": 0, "answerText": "A 断定（体言に付く）／B 完了・存続（連用形に付く）", "explanation": "A 体言「備前守」に付く「たり」は断定（備前守であった時）。断定の「たり」は主に和漢混交文で、身分・資格を表す名詞に付くことが多い。B 四段動詞「あく」の連用形「あき」に付く「たり」は完了・存続（ちょうど空いていた但馬国を）。", "optionNotes": ["正しい。", "Aの上は名詞「備前守」、Bの上は動詞の連用形「あき」。接続が逆。", "Bの「あき」は動詞「あく」の連用形。断定の「たり」は体言に付く。", "Aの上は名詞で、動詞の終止形ではない。", "完了・存続の「たり」は連用形に付く。体言に付くのは断定、未然形に付く「たり」はない。"], "pitfall": "「たり」は直前を見る。体言→断定（…である）、連用形→完了・存続（…た・…ている）。断定の「たり」は漢文調の文章（軍記物語など）に多い。", "related": "断定「たり」の活用：たら／たり・と／たり／たる／たれ／たれ（形容動詞タリ活用型）。完了・存続の「たり」はラ変型。", "sources": [{"title": "平家物語 巻第一 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoHeik/vol1.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たり」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%82%8A", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-020", "category": "kobun_bunpo", "topic": "「ぬ」「ね」の識別（未然形と連用形が同形のとき）", "difficulty": 3, "question": "次のA〜Dは、いずれも『源氏物語』若紫巻で、病気の加持のため北山を訪れた光源氏の場面の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。傍線部のうち、打消の助動詞「ず」であるものの組み合わせとして最も適当なものを選べ。\n\nA （供人の言葉）「暮れかかり「ぬれ」ど、おこらせたまはずなりぬるにこそはあめれ」\nB 君も、かかる旅寝も慣らひたまは「ね」ば、さすがにをかしくて、\nC （僧都の言葉）「このころ、わづらふことはべるにより、かく京にもまかで「ね」ば、頼もし所に籠りてものしはべるなり」\nD とて、立つ音すれば、帰りたまひ「ぬ」。\n\n＊おこる＝（病気の）発作が起こる。＊まかづ＝出かける・退出する（下二段動詞）。", "options": ["AとB", "BとC", "CとD", "AとD", "BとD"], "answer": 1, "answerText": "BとC", "explanation": "「ぬ」「ね」は上の語の活用形で見分ける。未然形＋ぬ・ね→打消「ず」の連体形・已然形、連用形＋ぬ・ね→完了「ぬ」の終止形・命令形。A 四段「暮れかかる」の連用形＋「ぬれ」は完了「ぬ」の已然形。B 四段「たまふ」の未然形「たまは」＋「ね」は「ず」の已然形（お慣れにならないので）。C 下二段「まかづ」は未然形・連用形が同じ「まかで」だが、完了「ぬ」の命令形「ね」に「ば」は付かないので、「ず」の已然形（京にも出かけないので）。D 連用形「たまひ」に付いて文が終わる「ぬ」は完了の終止形。", "optionNotes": ["Aの「ぬれ」は連用形「暮れかかり」に付く完了「ぬ」の已然形。", "正しい。B・Cはどちらも「ね＋ば」で、打消「ず」の已然形。", "Dは連用形「たまひ」に付いて文末にある完了「ぬ」の終止形。", "A・Dはどちらも連用形に付く完了の「ぬ」。", "Dは完了の「ぬ」。"], "pitfall": "下二段・上一段などは未然形と連用形が同じ形なので、下を見る。「ね＋ば・ども」→打消の已然形、「ぬ＋体言」→打消の連体形、「ぬ。」（文末）→完了の終止形。", "related": "打消「ず」：ず／ず／ず／ぬ／ね／○（ざら・ざり・ざる・ざれ）。完了「ぬ」：な／に／ぬ／ぬる／ぬれ／ね。", "sources": [{"title": "源氏物語 若紫 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/MurGenj/vol5.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ず」", "url": "https://kobun.weblio.jp/content/%E3%81%9A", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ぬ」", "url": "https://kobun.weblio.jp/content/%E3%81%AC", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-021", "category": "kobun_bunpo", "topic": "「に」の識別（断定・ナ変の語尾・形容動詞の語尾・完了）", "difficulty": 3, "question": "次は『徒然草』第二百三十六段の結末である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。出雲神社の獅子・狛犬が背中合わせに立っているのを見て深く感動した上人が、神官に由来を尋ねる場面。\n\n「この御社の獅子の立てられやう、定めて習ひあること「Aに」侍らん。ちと承らばや」と言はれければ、「その事に候ふ。さがなき童べどもの仕りける、奇怪に候ふことなり」とて、さし寄りて、据ゑ直して去「Bに」ければ、上人の感涙いたづら「Cに」なり「Dに」けり。\n\n＊さがなし＝いたずらだ。＊奇怪なり＝けしからぬ。＊据ゑ直す＝（獅子・狛犬を正しい向きに）置き直す。\n\n傍線部A〜Dの「に」の説明の組み合わせとして最も適当なものを選べ。", "options": ["A 格助詞／B 完了の助動詞／C 形容動詞の活用語尾／D 完了の助動詞", "A 断定の助動詞／B 完了の助動詞／C 格助詞／D 断定の助動詞", "A 断定の助動詞／B ナ変動詞の活用語尾／C 格助詞／D 完了の助動詞", "A 断定の助動詞／B ナ変動詞の活用語尾／C 形容動詞の活用語尾／D 完了の助動詞", "A 格助詞／B ナ変動詞の活用語尾／C 形容動詞の活用語尾／D 断定の助動詞"], "answer": 3, "answerText": "A 断定／B ナ変の活用語尾／C 形容動詞の活用語尾／D 完了", "explanation": "A 体言「こと」に付き、下に「侍り（「あり」の丁寧語）」が続くので断定「なり」の連用形（きっと由来のあることでございましょう）。B「去ぬ」はナ変（な／に／ぬ／ぬる／ぬれ／ね）で、「去に」は連用形の活用語尾。C「いたづらなり」はナリ活用の形容動詞で、「いたづらに」は連用形の活用語尾（むだに）。D 四段「なる」の連用形「なり」に付き、下に「けり」が続く「に」は完了「ぬ」の連用形（むだになってしまった）。", "optionNotes": ["Aは下に「侍り」があるので「に＋あり」の形の断定。Bの「去に」は一語の動詞の一部。", "Bは動詞「去ぬ」の一部、Cは形容動詞「いたづらなり」の一部、Dは連用形「なり」に付く完了。", "Cは「いたづらなり」という一語の形容動詞の連用形の語尾で、格助詞ではない。", "正しい。", "Aは断定。Dは連用形に付き「けり」に続くので完了。"], "pitfall": "「に」の識別：（ア）体言・連体形＋に＋（あり・侍り・候ふ／て・して）→断定、（イ）連用形＋に＋き・けり・たり・けむ→完了、（ウ）「〜げに・〜かに・いたづらに」など状態を表す語の一部→形容動詞の語尾、（エ）「死に・去（往）に」→ナ変の語尾。", "related": "ナ変は「死ぬ」「去（往）ぬ」の2語だけ。上人の感動は、子どものいたずらだったと分かって「いたづら（むだ）」になった。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「なり」", "url": "https://kobun.weblio.jp/content/%E3%81%AA%E3%82%8A", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「去ぬ」", "url": "https://kobun.weblio.jp/content/%E5%8E%BB%E3%81%AC", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「いたづらなり」", "url": "https://kobun.weblio.jp/content/%E3%81%84%E3%81%9F%E3%81%A5%E3%82%89%E3%81%AA%E3%82%8A", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ぬ」", "url": "https://kobun.weblio.jp/content/%E3%81%AC", "checked": "2026-10-31"}]}, {"version": 2, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-022", "category": "kobun_bunpo", "topic": "「なむ」の識別（ぬ＋む・願望の終助詞・係助詞）", "difficulty": 3, "question": "次の傍線部A〜Cの「なむ」の説明の組み合わせとして最も適当なものを選べ（Aは『源氏物語』若紫巻、B・Cは『伊勢物語』第六段〔芥川〕。本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。B・Cは Wikibooks の本文を参考に漢字をあてた）。\n\nA （日が暮れてきたので、供人が光源氏に京へ戻ることを勧める）\n　「はや帰らせたまひ「なむ」」\nB （男は女を荒れた蔵の奥に入れ、自分は戸口で弓矢を持って番をしていた）\n　はや夜も明け「なむ」と思ひつつゐたりけるに、\nC （女を連れて芥川のほとりを行くと、女は草の上の露を見て）\n　「かれは何ぞ」と「なむ」男に問ひける。", "options": ["A 係助詞／B 願望の終助詞／C 係助詞", "A 完了「ぬ」＋推量「む」／B 完了「ぬ」＋推量「む」／C 係助詞", "A 願望の終助詞／B 完了「ぬ」＋推量「む」／C 係助詞", "A 完了「ぬ」＋推量「む」／B 願望の終助詞／C 願望の終助詞", "A 完了「ぬ」＋推量「む」／B 願望の終助詞／C 係助詞"], "answer": 4, "answerText": "A 完了「ぬ」＋推量「む」／B 願望の終助詞／C 係助詞", "explanation": "A 四段「たまふ」の連用形「たまひ」に付くので、完了「ぬ」の未然形「な」（強意）＋「む」（ここは適当：早くお帰りになるのがよいでしょう）。B 下二段「明く」は未然形と連用形が同じ「明け」なので、形では決まらない。副詞「はや」（一刻も早く）は願望・命令・勧誘などの表現と呼応する。男が夜明けを待ちわびる心中なので、未然形に付いて他に対する願望を表す終助詞（早く夜も明けてほしい）。C 文中にあり、文末が連体形「ける」で結ばれている（係り結び）ので係助詞。取り除いても文意が通る。（選択肢の「推量「む」」は推量の助動詞「む」のこと。Aでの意味は適当。）", "optionNotes": ["Aは文末にあり、上が連用形「たまひ」なので係助詞ではなく「ぬ＋む」。", "Bは副詞「はや」と呼応して「早く夜も明けてほしい」と待ち望む心。「ぬ＋む」と取っても、推量の「きっと明けるだろう」は「はや」（一刻も早く）と合わず、主語が「夜」なので意志や適当（Aの「…のがよい」）にもならない。", "Aの上は連用形。願望の終助詞「なむ」は未然形に付く（帰らせたまはなむ、となるはず）。", "Cは文中にあり「ける」（連体形）で結ばれているので係助詞。", "正しい。"], "pitfall": "「なむ」は上の形で見分ける。未然形＋なむ→願望の終助詞、連用形＋なむ→「ぬ」＋「む」、体言・連体形・助詞など＋なむ（文末が連体形）→係助詞。下二段「明け」のように未然形と連用形が同形のときは、文脈で決める。", "related": "願望の終助詞「なむ」（他に対する願望：…てほしい）と「ばや」（自分の願望：…たい）を区別する。", "sources": [{"title": "源氏物語 若紫 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/MurGenj/vol5.html", "checked": "2026-10-31"}, {"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "Wikibooks「高等学校国語総合/伊勢物語」（芥川・筒井筒の本文と訳）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E4%BC%8A%E5%8B%A2%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「なむ」", "url": "https://kobun.weblio.jp/content/%E3%81%AA%E3%82%80", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「はや」", "url": "https://kobun.weblio.jp/content/%E3%81%AF%E3%82%84", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-004", "category": "kobun_kaishaku", "topic": "完了「つ」・存続「たり」と「ものを」を含む訳（雀の子）", "difficulty": 1, "question": "次は『源氏物語』若紫巻の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。北山で光源氏が垣間見ていると、十歳ほどの少女（のちの紫の上）が泣きはらした顔で走ってきて、尼君にこう訴えた。\n\n「雀の子を犬君が逃がしつる。伏籠のうちに籠めたりつるものを」\n\n＊犬君（いぬき）＝少女に仕える女の子の名。＊伏籠＝かごの一種。\n\nこの言葉の現代語訳として最も適当なものを選べ。", "options": ["雀の子を犬君が逃がしたらしいの。伏籠の中に閉じこめておいたので。", "雀の子を犬君が逃がそうとしているの。伏籠の中に閉じこめておくつもりなのに。", "雀の子を犬君が逃がしてしまったの。伏籠の中に閉じこめておいたのに。", "雀の子を犬君が逃がすでしょう。伏籠の中に閉じこめておいたのだから。", "雀の子を犬君に逃がしてもらったの。伏籠の中に閉じこめておいたのに。"], "answer": 2, "answerText": "雀の子を犬君が逃がしてしまったの。伏籠の中に閉じこめておいたのに。", "explanation": "「逃がしつる」の「つる」は完了「つ」の連体形（連体形で言い止めて、訴える気持ちを込める）。「籠めたりつる」は存続「たり」＋完了「つ」で「閉じこめておいた」。「ものを」は「…のに（なあ）」と不満や残念な気持ちを表す。「犬君が」の「が」は主語を示す。", "optionNotes": ["「つ」は完了で、推定（…らしい）の意味はない。「ものを」は「…なので」という理由ではない。", "「つ」は完了（…てしまった）。これからのことを言う表現ではない。", "正しい。完了「つ」、存続「たり」、残念な気持ちの「ものを」。", "「つる」に推量の意味はない。「ものを」も「…のだから」ではない。", "「犬君が」の「が」は主語。少女が頼んで逃がしてもらったのではなく、犬君が逃がしてしまったと怒っている。"], "pitfall": "「つ」「ぬ」は過去ではなく完了（…てしまった・…た）。「ものを」は「…のに（なあ）」で、「…なので」と順接に訳さない。", "related": "このあと尼君は「いで、あな幼や」と、雀のことばかり気にかける少女をたしなめる。", "sources": [{"title": "源氏物語 若紫 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/MurGenj/vol5.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ものを」", "url": "https://kobun.weblio.jp/content/%E3%82%82%E3%81%AE%E3%82%92", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「つ」", "url": "https://kobun.weblio.jp/content/%E3%81%A4", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たり」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%82%8A", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-005", "category": "kobun_kaishaku", "topic": "可能の「べし」と類推の「だに」を含む訳", "difficulty": 2, "question": "次は『大鏡』「道長」の一節である（本文はウィキソース所収『国文大観』本による。表記は読みやすく一部改めた）。何事にもすぐれた四条大納言（藤原公任）をうらやんで、大入道殿（藤原兼家）が言った言葉。\n\n「いかでかからむ。うらやましくあるかな。我が子どもの影だに踏むべくもあらぬこそ口惜しけれ」\n\n＊我が子ども＝兼家の息子たち（道隆・道兼・道長）。\n\n「我が子どもの影だに踏むべくもあらぬこそ口惜しけれ」の現代語訳として最も適当なものを選べ。", "options": ["わが子たちが、（公任の）影さえ踏むこともできそうにないのは残念だ", "わが子たちが、（公任の）影さえ踏むはずがないのは当然のことだ", "わが子たちが、（公任の）影だけでも踏むべきではないのは残念だ", "わが子たちが、（公任の）影を踏んでしまったのは残念だ", "わが子たちが、（公任の）影さえ踏もうとしないのは残念だ"], "answer": 0, "answerText": "わが子たちが、（公任の）影さえ踏むこともできそうにないのは残念だ", "explanation": "「だに」は下に打消があるので、軽いものを挙げて重いものを類推させる「…さえ」。「べく」は可能の「べし」（…できそうだ）で、「もあらぬ」と打消が付いて「踏むこともできそうにない」。「こそ…けれ」は強調の係り結び、「口惜し」は「残念だ」。息子たちは公任の影さえ踏めないほど及ばない、と嘆いている。", "optionNotes": ["正しい。", "「口惜し」は「残念だ」で、「当然だ」の意味はない。「べく」も当然ではなく、できるかどうかを言う可能。", "「だに」が「せめて…だけでも」になるのは、下に願望・命令・意志・仮定があるとき。ここは打消なので「…さえ」。「べし」も不適当ではない。", "「あらぬ」の「ぬ」は未然形「あら」に付く打消「ず」の連体形。完了ではない。", "主語は三人称（息子たち）で、「べし」を意志と取るのは不自然。「踏む力がない」という可能の意味。"], "pitfall": "「だに」は下を見て訳し分ける。願望・命令・意志・仮定がある→「せめて…だけでも」、それ以外（打消など）→「…さえ」。打消を伴う「べくもあらず」は「…できそうにもない」。", "related": "これを聞いた若い道長だけは、国文大観本では「かげをばふまで、つらをやはふまぬ」（影など踏まないで、顔を踏まずにおくものか）と言い返している。", "sources": [{"title": "大鏡（国文大観）本文（ウィキソース）", "url": "https://ja.wikisource.org/wiki/%E5%A4%A7%E9%8F%A1_%28%E5%9C%8B%E6%96%87%E5%A4%A7%E8%A7%80%29", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「べし」", "url": "https://kobun.weblio.jp/content/%E3%81%B9%E3%81%97", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「だに」", "url": "https://kobun.weblio.jp/content/%E3%81%A0%E3%81%AB", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-006", "category": "kobun_kaishaku", "topic": "打消意志「じ」・受身「る」・婉曲「む」を含む訳", "difficulty": 2, "question": "次は『徒然草』第百五十段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改め、会話に「」を補った）。\n\n能をつかんとする人、「よくせざらんほどは、なまじひに人に知られじ。うちうちよく習ひ得てさし出でたらんこそ、いと心にくからめ」と常に言ふめれど、かく言ふ人、一芸も習ひ得ることなし。\n\n＊能をつく＝芸能を身につける。＊なまじひに＝中途半端に、なまじっか。＊心にくし＝奥ゆかしい。\n\n「よくせざらんほどは、なまじひに人に知られじ」の現代語訳として最も適当なものを選べ。", "options": ["上手にできないうちは、なまじっか人に知られないだろう", "上手にしなかったのだから、なまじっか人に知られないようにしよう", "上手にできないうちは、なまじっか人に知られることはできまい", "上手にできないうちは、なまじっか人に知られないようにしよう", "上手にできないうちは、なまじっか人を知ろうとはするまい"], "answer": 3, "answerText": "上手にできないうちは、なまじっか人に知られないようにしよう", "explanation": "「せざらん」は「せ（サ変の未然形）＋ざら（打消）＋ん（婉曲）」で、体言「ほど」に続く「上手にできないような間は」。「知られじ」は「知ら＋れ（受身）＋じ」。芸を身につけようとする人が自分の心構えとして言う言葉（主語は一人称）なので、「じ」は打消意志「…ないようにしよう」。", "optionNotes": ["主語は話し手自身なので、「じ」は打消推量ではなく打消意志。", "「せざらん」は未然形＋「ん」で、体言「ほど」に続く婉曲。「しなかったのだから」という確定の意味ではない。", "「れ」は「人に」と相手が示された受身。可能と取ると、話し手の心構えを述べる文にならない。", "正しい。", "「知られ」の「れ」は受身。「人を知る」のではなく「人に知られる」。"], "pitfall": "「じ」は主語が一人称なら打消意志（…まい・…ないようにしよう）、二人称・三人称なら打消推量（…ないだろう）。「む」の裏返しと考えるとよい。", "related": "兼好は、こう言う人は一芸も身につかず、下手なうちから上手の中に交じって励む人こそ上達する、と続ける。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「じ」", "url": "https://kobun.weblio.jp/content/%E3%81%98", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「る」", "url": "https://kobun.weblio.jp/content/%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「む」", "url": "https://kobun.weblio.jp/content/%E3%82%80", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-007", "category": "kobun_kaishaku", "topic": "反実仮想「ましかば」と「こそ〜しか」を含む訳", "difficulty": 2, "question": "次は『徒然草』第十一段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。作者は山里の奥で、ひっそりと住みなした庵を見つけ、「こんなふうにしても住んでいられるのだなあ」と感心していた。\n\nかくてもあられけるよと、あはれに見るほどに、かなたの庭に、大きなる柑子の木の、枝もたわわになりたるが、まはりをきびしく囲ひたりしこそ、少しことさめて、この木なからましかばと覚えしか。\n\n＊柑子＝みかんの一種。＊ことさむ＝興がさめる。\n\n「この木なからましかばと覚えしか」の現代語訳として最も適当なものを選べ。", "options": ["この木がなかったので、よかったと思われた", "この木がなかったならば（よかったのに）、と思われた", "この木はきっとなくなるだろう、と思われた", "この木がなかったならば（よかったのに）、と思われるだろう", "この木がなくなってしまうならば困る、と思われた"], "answer": 1, "answerText": "この木がなかったならば（よかったのに）、と思われた", "explanation": "「なからましかば」は「なから（形容詞「なし」の未然形）＋ましか（反実仮想「まし」の未然形）＋ば」で「もし…なかったならば」。下に「よからまし」などが省略されている。実際にはみかんの木が厳重に囲ってあり、住む人の欲が見えて興ざめしたので、「なかったらよかったのに」と思った。「覚えしか」は「覚え（自然に思われる）＋しか（過去「き」の已然形）」で、前の「こそ」の結び。", "optionNotes": ["「ましかば」は事実と反対の仮定（もし…だったら）。実際には木はあったので、「なかったので」は誤り。", "正しい。", "「まし」は推量ではなく反実仮想。", "「しか」は過去「き」の已然形（「こそ」の結び）。これから先の推量ではない。", "作者は木を惜しんでいるのではなく、木を囲う欲深さに興ざめしている。反実仮想の訳にもなっていない。"], "pitfall": "「ましかば〜まし」「せば〜まし」は反実仮想。後半が省略されて「ましかば」で終わるときは、「…だったらよかったのに」と補って訳す。", "related": "「かくてもあられけるよ」の「れ」は可能（住んでいられる）。「こそ」の結びは已然形（ここでは過去「き」の已然形「しか」）。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「まし」", "url": "https://kobun.weblio.jp/content/%E3%81%BE%E3%81%97", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「き」", "url": "https://kobun.weblio.jp/content/%E3%81%8D", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-008", "category": "kobun_kaishaku", "topic": "現在推量「らむ」と疑問の「や」を含む和歌の訳", "difficulty": 2, "question": "次は『伊勢物語』第二十三段（筒井筒）の一節である（本文は Wikibooks「高等学校国語総合/伊勢物語」の本文による。この歌は『古今和歌集』巻第十八にも収められている）。男は河内の国の別の女のもとへ通うようになったが、もとの女は嫌な顔も見せずに送り出す。不審に思った男が庭の植え込みに隠れて見ていると、女は念入りに化粧をし、物思いにふけって次の歌を詠んだ。\n\n風吹けば沖つ白波たつた山夜半にや君がひとり越ゆらむ\n\n＊上の句は、白波が「立つ」から同じ音の「たつた山（竜田山）」を導く序詞。竜田山は、女の住む大和から河内へ行く途中の山。\n\n下の句「夜半にや君がひとり越ゆらむ」の現代語訳として最も適当なものを選べ。", "options": ["夜中にあなたはひとりで越えたのだろうか", "夜中にあなたはひとりで越えようとするのだろうか", "夜中にどうしてあなたはひとりで越えるのだろうか", "夜中にあなたがひとりで越えるだろうか、いや越えはしない", "今ごろ夜中にあなたはひとりで越えているのだろうか"], "answer": 4, "answerText": "今ごろ夜中にあなたはひとりで越えているのだろうか", "explanation": "「や」は疑問の係助詞で、結びは「らむ」の連体形。「越ゆ」はヤ行下二段の終止形で、「らむ」は終止形に付く現在推量（今ごろ…ているだろう）。女は家にいながら、今まさに夜の山道を越えているであろう夫の身を案じている。", "optionNotes": ["過去を推量するなら「けむ」。「らむ」は目の前にない現在の事態を推量する。", "「らむ」に意志の意味はない。", "原因推量は目の前の事実の理由を推し量るときで、ここでは女は夫の姿を見ていない。「や」にも「どうして」の意味はない。", "女は夫の身を案じて問いかけている。打ち消す反語ではなく疑問。", "正しい。"], "pitfall": "「らむ」は「今ごろ…ているだろう」（目の前にない現在の推量）が基本。「越ゆらむ」の「越ゆ」は終止形（「らむ」は終止形接続）で、「越ゆる」とはならない。", "related": "この歌を聞いた男は女をいとしく思い、河内へ通うのをやめた。", "sources": [{"title": "Wikibooks「高等学校国語総合/伊勢物語」（芥川・筒井筒の本文と訳）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E4%BC%8A%E5%8B%A2%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「らむ」", "url": "https://kobun.weblio.jp/content/%E3%82%89%E3%82%80", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「越ゆ」", "url": "https://kobun.weblio.jp/content/%E8%B6%8A%E3%82%86", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-009", "category": "kobun_kaishaku", "topic": "「だに〜ば」（最小限）・謙譲「たてまつる」・「なむ」（ぬ＋む）を含む訳", "difficulty": 3, "question": "次は『宇治拾遺物語』「絵仏師良秀」の一節である（本文は Wikibooks「高等学校国語総合/宇治拾遺物語」所収の、教科書等で通行の本文による）。自分の家が焼けるのを見て笑っていた良秀が、あきれる人々に答えた言葉。\n\n「年ごろ不動尊の火炎を悪しくかきけるなり。今見れば、かうこそ燃えけれと、心得つるなり。これこそせうとくよ。この道を立てて世にあらんには、仏だによくかきたてまつらば、百千の家もいできなん」\n\n＊不動尊＝不動明王。炎を背負った姿で描かれる。＊せうとく＝もうけもの。＊この道＝仏画を描く絵仏師の道。＊「いできなん」の「き」は「来」。\n\n「仏だによくかきたてまつらば、百千の家もいできなん」の現代語訳として最も適当なものを選べ。", "options": ["仏でさえ上手にお描きになるのだから、百や千の家もきっとできるだろう", "仏さえ上手にお描き申し上げたので、百や千の家もできてほしい", "仏さえ上手にお描き申し上げるならば、百や千の家もきっとできるだろう", "仏さえ上手にお描きになるならば、百や千の家もきっとできるだろう", "仏さえ上手にお描き申し上げるならば、百や千の家もできてほしいものだ"], "answer": 2, "answerText": "仏さえ上手にお描き申し上げるならば、百や千の家もきっとできるだろう", "explanation": "「だに」は下に仮定「…ば」があるので最小限の限定（せめて…だけでも・…さえ…ならば）。「たてまつら」は謙譲の補助動詞（お…申し上げる）で、描かれる仏への敬意。「たてまつら（未然形）＋ば」は仮定条件（…ならば）。「いでき（カ変「いでく」の連用形）＋な（完了「ぬ」の未然形・強意）＋ん（推量「む」）」で「きっとできるだろう」。", "optionNotes": ["下に仮定があるので「だに」は「…でさえ（…のだから）」ではない。「たてまつる」は謙譲語で「お描きになる」は誤り。「未然形＋ば」は確定ではなく仮定。", "「たてまつら」は未然形なので「ば」は仮定（…ならば）。「…たので」は已然形＋ばの訳。「なん」は連用形「いでき」に付くので「ぬ＋む」で、願望ではない。", "正しい。", "「たてまつる」は謙譲語。描くのは良秀で、その動作の相手である仏を敬っている。", "「いでき」は連用形。連用形＋「なむ」は「ぬ＋む」で「きっと…だろう」。願望の終助詞「なむ」なら未然形「いでこ」に付く。"], "pitfall": "「だに」は下を見る（仮定・願望・意志・命令→せめて…だけでも、それ以外→…さえ）。「いできなん」は「来」を「き」と読むので連用形→「ぬ＋む」。「ば」は未然形なら仮定、已然形なら確定。", "related": "良秀は、腕さえあれば家などいくらでも建つと言い、物を惜しむ人々をあざ笑った。のちに彼の描いた不動尊は「よぢり不動」として人々にほめられた。", "sources": [{"title": "Wikibooks「高等学校国語総合/宇治拾遺物語」（絵仏師良秀の本文と訳）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「だに」", "url": "https://kobun.weblio.jp/content/%E3%81%A0%E3%81%AB", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たてまつる」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%A6%E3%81%BE%E3%81%A4%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「なむ」", "url": "https://kobun.weblio.jp/content/%E3%81%AA%E3%82%80", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ば」", "url": "https://kobun.weblio.jp/content/%E3%81%B0", "checked": "2026-10-31"}]}, {"id": "tk-keigo-004", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "謙譲の補助動詞「奉る」と丁寧の「侍り」の敬意の対象", "format": "choice4", "difficulty": 2, "question": "次は『徒然草』第三十二段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。\n\n九月廿日の比、ある人にさそはれ「A奉り」て、明くるまで月見ありく事「B侍り」しに、おぼしいづる所ありて、案内せさせて入り給ひぬ。\n\n＊九月廿日の比＝九月二十日のころ。＊ある人＝作者（兼好）が敬う身分の高い人。「おぼしいづる」「入り給ひぬ」の主語もこの人。＊案内せさせて＝（従者に）取り次ぎを頼ませて。\n\n傍線部A「奉り」とB「侍り」は、それぞれ作者から誰への敬意を表すか。組み合わせとして最も適当なものを選べ。", "options": ["A ある人／B ある人", "A ある人／B 読者", "A 読者／B ある人", "A 作者自身／B 読者", "A ある人が訪ねた家の人／B 読者"], "answer": 1, "answerText": "A ある人／B 読者", "explanation": "A「さそはれ奉り」は「（ある人に）お誘いいただいて」。誘う動作をしたのはある人なので、謙譲の補助動詞「奉る」はある人への敬意。B「侍り」は「（月見して歩くことが）ございました」という丁寧語で、地の文なので作者から読者への敬意。", "optionNotes": ["Bは「月見ありく事（が）ありました」という丁寧語。丁寧語は話の中の人物ではなく、読み手（会話なら聞き手）への敬意。", "正しい。A「誘ふ」動作をした人＝ある人への謙譲、B 地の文の丁寧語＝読者への敬意。", "逆。謙譲語「奉る」は動作の相手（ある人）への敬意、丁寧語「侍り」が読者への敬意。", "敬語は自分自身には向けない。Aは誘ってくれた「ある人」への敬意。", "その家の人はこのあとに出てくる人物で、「さそはれ奉り」の誘った人ではない。"], "pitfall": "受身「る」と一緒の「〜れ奉る」は、「その動作をしてくれた人」（ここでは誘った人）への敬意になる。また、地の文の「侍り」は丁寧語で読者への敬意。会話文の中なら聞き手への敬意になる。", "related": "敬意の出どころ：地の文→作者、会話文→話し手。敬意の向き先：尊敬→動作をする人、謙譲→動作を受ける人、丁寧→読者・聞き手。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「奉る」", "url": "https://kobun.weblio.jp/content/%E5%A5%89%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「侍り」", "url": "https://kobun.weblio.jp/content/%E4%BE%8D%E3%82%8A", "checked": "2026-10-31"}]}, {"id": "tk-keigo-005", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "「侍ふ（さぶらふ）」の謙譲本動詞と最高敬語「させ給ふ」", "format": "choice4", "difficulty": 3, "question": "次は『枕草子』「宮に始めて参りたるころ」の段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の有朋堂文庫本による。旧字体を新字体に改めた）。\n\n宮に始めて参りたるころ、物の恥しきこと数知らず、涙も落ちぬべければ、夜々まゐりて、三尺の御几帳の後に「A侍ふ」に、絵など取り出でて「B見せさせ給ふ」だに、手もえさし出すまじうわりなし。\n\n＊宮＝中宮定子。作者（清少納言）はこの中宮に女房として仕え始めたところである。＊A「侍ふ」は「さぶらふ」と読む。＊三尺の御几帳＝布を垂らした低い仕切り。＊わりなし＝どうしようもない（つらい）。\n\n傍線部A・Bの説明の組み合わせとして最も適当なものを選べ。", "options": ["A 丁寧語の本動詞で作者から読者への敬意／B 尊敬語を重ねた最高敬語で作者から中宮への敬意", "A 謙譲語の補助動詞で作者から中宮への敬意／B 尊敬語を重ねた最高敬語で作者から中宮への敬意", "A 尊敬語の本動詞で作者から中宮への敬意／B 謙譲語と尊敬語で作者から中宮への敬意", "A 謙譲語の本動詞で作者から中宮への敬意／B 尊敬語を重ねた最高敬語で作者から中宮への敬意", "A 謙譲語の本動詞で作者から中宮への敬意／B 尊敬語を重ねた最高敬語で中宮から作者への敬意"], "answer": 3, "answerText": "A 謙譲語の本動詞で作者から中宮への敬意／B 尊敬語を重ねた最高敬語で作者から中宮への敬意", "explanation": "A「侍ふ（さぶらふ）」は「おそばにお控え申し上げる」という謙譲語の本動詞で、控える先の中宮への敬意。B「見せさせ給ふ」は、絵を取り出して見せる中宮の動作に「させ（尊敬）＋給ふ（尊敬）」を重ねた最高敬語で、作者から中宮への敬意。", "optionNotes": ["「さぶらふ」は丁寧語にもなるが、ここは貴人（中宮）のそばに控える意味の謙譲語。「御几帳の後に」控える場面。", "Aは動詞の連用形に付いていない。「〜の後に侍ふ」と単独で「控える」意味を表す本動詞。", "「さぶらふ」に尊敬の用法はない。また「見せさせ給ふ」の「させ」は謙譲語ではない。", "正しい。A＝中宮のおそばにお控え申し上げる（謙譲）、B＝絵を見せてくださるのは中宮（最高敬語）。", "Bは地の文なので敬意の出どころは作者。中宮が女房に敬語を使っているのではない。"], "pitfall": "「侍」の字でも、ここは「さぶらふ」と読み、謙譲語（お仕えする・お控えする）。「侍り」「候ふ」は、貴人のそばにいる意味なら謙譲、「あります・ございます」の意味なら丁寧と、意味で分ける。", "related": "最高敬語（せ給ふ・させ給ふ・おはします・のたまはす など）は地の文では天皇・中宮など最上位の人に使う。主語が書かれていないときの手がかりになる。", "isJiji": false, "sources": [{"title": "枕草子 本文（有朋堂文庫本・バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SeiMaku/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「さぶらふ」", "url": "https://kobun.weblio.jp/content/%E3%81%95%E3%81%B6%E3%82%89%E3%81%B5", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまふ」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%BE%E3%81%B5", "checked": "2026-10-31"}]}, {"id": "tk-keigo-006", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "命令形「給へ」（四段・尊敬）と会話の中の敬意の方向", "format": "choice4", "difficulty": 3, "question": "次は『徒然草』第二百十五段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。くの字点をかなに改めた）。平宣時（たいらののぶとき）が、若いころ夜に最明寺入道（北条時頼）に呼ばれて参上したときの思い出を語る言葉の一部。\n\n（前略）銚子に土器とり添へてもて出でて、『此の酒をひとりたうべんがさうざうしければ、申しつるなり。さかなこそなけれ。人はしづまりぬらん。さりぬべき物やあると、いづくまでも求め「給へ」』とありしかば、（後略）\n\n＊「もて出でて」の主語と『　』の話し手は最明寺入道。聞き手は宣時。＊さりぬべき物＝（酒のさかなに）適当な物。\n\n傍線部「給へ」の説明として最も適当なものを選べ。", "options": ["尊敬の補助動詞（四段活用・命令形）で、最明寺入道から宣時への敬意", "謙譲の補助動詞（下二段活用）で、最明寺入道から宣時への敬意", "尊敬の補助動詞（四段活用・命令形）で、宣時から最明寺入道への敬意", "尊敬の補助動詞（四段活用・已然形）で、作者（兼好）から最明寺入道への敬意", "丁寧の補助動詞で、最明寺入道から宣時への敬意"], "answer": 0, "answerText": "尊敬の補助動詞（四段活用・命令形）で、最明寺入道から宣時への敬意", "explanation": "「求め給へ」は動詞「求む」の連用形に付いた尊敬の補助動詞「給ふ」（四段）の命令形で、「どこまでもお探しください」の意味。話し手は入道、探す動作をするのは聞き手の宣時なので、入道から宣時への敬意。目上の入道が年下の宣時に敬語を使っている点に注意。", "optionNotes": ["正しい。「お探しください」と宣時に頼む言葉。", "下二段の「給ふ」は「思ふ・見る・聞く」などに付き、話し手自身の動作をへりくだる語で、命令形の用法がない。「求める」のは聞き手の宣時。", "『　』の中は入道の言葉。宣時が思い出を語っていても、この敬語を使った話し手は入道。", "会話文中なので敬意の出どころは話し手。文が「〜給へ」と言い切られ、「と」で受けられているので命令形。", "丁寧の補助動詞は「侍り」「候ふ」。「給ふ」は尊敬語（下二段なら謙譲語）で、丁寧語にはならない。"], "pitfall": "身分が上の人の言葉には敬語がないと思いこまない。会話文の尊敬語は「話し手から、その動作をする人へ」。また「給へ」は四段（尊敬）の命令形・已然形にも、下二段（謙譲）の未然形・連用形にもなる形なので、「誰の動作か」「下に何が続くか」で見分ける。", "related": "下二段「給ふ」（謙譲）：会話・手紙で、話し手自身の「思ふ・見る・聞く・知る」に付く（思ひ給へ知る など）。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまふ」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%BE%E3%81%B5", "checked": "2026-10-31"}]}, {"id": "tk-keigo-007", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "尊敬の本動詞「奉る」（召し上がる）", "format": "choice4", "difficulty": 3, "question": "次は『竹取物語』「かぐや姫の昇天」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。旧字体を新字体に改め、会話を『　』で示した）。月からかぐや姫を迎えに来た天人たちは、天の羽衣と不死の薬を入れた箱を持っていた。\n\n一人の天人いふ、『壺なる御薬「奉れ」。穢き所の物食しめしたれば、御心地悪しからむものぞ』とて、持てよりたれば、\n\n＊穢き所＝けがれた所（人間の世界）。＊食しめす＝「きこしめす」と読む。召し上がる。＊持てよる＝（かぐや姫のそばに）持って近寄る。\n\n傍線部「奉れ」の意味と敬語の種類・敬意の対象の組み合わせとして最も適当なものを選べ。", "options": ["差し上げよ（謙譲語）── 天人から月の世界の王への敬意", "お召しになれ〔＝着よ〕（尊敬語）── 天人からかぐや姫への敬意", "召し上がれ（尊敬語）── 天人からかぐや姫への敬意", "差し上げよ（謙譲語）── 天人から翁への敬意", "お与え申し上げよ（謙譲語）── 天人からかぐや姫への敬意"], "answer": 2, "answerText": "召し上がれ（尊敬語）── 天人からかぐや姫への敬意", "explanation": "「奉る」は本来「差し上げる」の謙譲語だが、「飲む・食ふ・着る・乗る」の尊敬語（召し上がる・お召しになる・お乗りになる）にもなる。ここは壺の薬をかぐや姫に勧め、「けがれた人間界の物を召し上がったので気分が悪いでしょう」と続くので、「召し上がれ」。天人からかぐや姫への敬意。", "optionNotes": ["薬を飲ませる場面で、誰かに献上するのではない。", "「奉る」には「着る」の尊敬語の用法もあるが、ここで勧めているのは衣ではなく壺の薬。", "正しい。「飲む」の尊敬語。薬を飲むのはかぐや姫。", "翁に薬を差し上げる場面ではない。直後の「御心地悪しからむ」も、薬を飲む本人（かぐや姫）を気づかう言葉。", "ほかの天人に「姫に与えよ」と命じているのではない。持って近寄った相手はかぐや姫で、本人に「飲め」と勧めている。"], "pitfall": "「奉る」を見たら謙譲と決めつけない。目的語が食べ物・飲み物・衣服・乗り物で、それを使うのが貴人なら尊敬語。「参る」（召し上がる）、「召す」も同じ働きをする。", "related": "飲食の尊敬語：奉る・参る・召す・きこしめす。着る・乗るの尊敬語：奉る・召す。", "isJiji": false, "sources": [{"title": "竹取物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoTake/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「奉る」", "url": "https://kobun.weblio.jp/content/%E5%A5%89%E3%82%8B", "checked": "2026-10-31"}]}, {"id": "tk-keigo-008", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "謙譲の本動詞「まうづ」の主体と敬意の対象", "format": "choice4", "difficulty": 2, "question": "次は『伊勢物語』第八十四段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。踊り字をかなに改めた）。\n\nむかし、おとこありけり。身はいやしながら、ははなむ宮なりける。そのはは、ながをかといふ所にすみ給けり。子は京に宮づかへしければ、「まうづ」としけれど、しばしばえまうでず。\n\n＊宮＝皇族の女性（内親王）。＊ながをか＝長岡（地名）。＊え〜ず＝〜できない。\n\n傍線部「まうづ」について、動作をする人（主体）と、作者からの敬意の対象の組み合わせとして最も適当なものを選べ。", "options": ["主体＝母／敬意の対象＝男（子）", "主体＝男（子）／敬意の対象＝天皇（宮仕え先）", "主体＝母／敬意の対象＝母", "主体＝男（子）／敬意の対象＝男（子）", "主体＝男（子）／敬意の対象＝母"], "answer": 4, "answerText": "主体＝男（子）／敬意の対象＝母", "explanation": "「まうづ」は「行く」の謙譲語「参上する」。京で宮仕えしている子（男）が、長岡に住む母のもとへ参上しようとするのだから、主体は男、敬意の対象は行き先の母（皇族）。前の「すみ給けり」の尊敬語「給ふ」も母への敬意。", "optionNotes": ["長岡に住んでいるのは母。京から出向こうとするのは宮仕えしている子の男。", "宮仕えは京での話。「まうづ」の行き先は母の住む長岡。", "謙譲語は動作をする人ではなく、動作を受ける人（行き先の人）を高める。", "謙譲語は動作をする人を低める語なので、主体（男）への敬意にはならない。", "正しい。息子が、母のいる長岡へ参上しようとする。謙譲語なので行き先の母への敬意。"], "pitfall": "謙譲語の敬意は「動作を受ける人・行き先の人」へ向かう。動作をする人に向けるのは尊敬語。身分の高い母（宮）には、作者は尊敬語（すみ給ふ）と謙譲語（まうづ）の両方で敬意を示している。", "related": "「まうづ」⇔「まかづ」：まうづ＝参上する、まかづ＝（貴人のもとから）退出する。どちらも謙譲語。", "isJiji": false, "sources": [{"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「まうづ」", "url": "https://kobun.weblio.jp/content/%E8%A9%A3%E3%81%A5", "checked": "2026-10-31"}]}, {"id": "tk-keigo-009", "version": 2, "status": "verified", "category": "kobun_keigo", "topic": "二方面の敬語（まかでさせたてまつりたまふ）と使役", "format": "choice4", "difficulty": 3, "question": "次は『源氏物語』桐壺巻の一節である（本文はバージニア大学図書館 Japanese Text Initiative の渋谷栄一校訂本による）。\n\nその年の夏、御息所、はかなき心地にわづらひて、まかでなむとしたまふを、暇さらに許させたまはず。（中略）日々に重りたまひて、ただ五六日のほどにいと弱うなれば、母君泣く泣く奏して、「まかでさせたてまつりたまふ」。\n\n＊御息所＝帝に愛された桐壺更衣。＊母君＝桐壺更衣の母。＊まかづ＝（宮中から）退出する（謙譲語）。＊「許させたまはず」の主語は帝。＊奏す＝帝に申し上げる。\n\n傍線部の「たてまつり」と「たまふ」は、それぞれ作者から誰への敬意を表すか。組み合わせとして最も適当なものを選べ。", "options": ["たてまつり＝帝／たまふ＝御息所", "たてまつり＝御息所／たまふ＝母君", "たてまつり＝母君／たまふ＝御息所", "たてまつり＝帝／たまふ＝母君", "たてまつり＝御息所／たまふ＝御息所"], "answer": 1, "answerText": "たてまつり＝御息所／たまふ＝母君", "explanation": "「まかで（謙譲）＋させ（使役）＋たてまつり（謙譲）＋たまふ（尊敬）」。主語は「泣く泣く奏し」た母君で、母君が娘の御息所を宮中から退出させる。尊敬「たまふ」は動作をする母君へ、謙譲「たてまつる」は動作を受ける（退出させられる）御息所への敬意。なお「まかづ」自体は、退出する元である宮中の主＝帝への敬意。", "optionNotes": ["帝への敬意を表すのは「まかづ」（宮中から退出する）のほう。「たてまつり」は「させる」相手への敬意。", "正しい。退出させる（主体）＝母君→尊敬「たまふ」。退出させられる（受け手）＝御息所→謙譲「たてまつる」。", "逆。「させ」は使役なので、動作をさせる主体は母君、させられるのが御息所。", "「たてまつる」は「まかでさせ」の受け手（退出させられる御息所）への敬意。", "「たまふ」は文の主語（泣く泣く奏した母君）の動作に付いている。"], "pitfall": "「させ」は「給ふ」と並ぶと尊敬のことが多いが、ここは「母君が御息所を退出させる」使役。主語を確かめてから、謙譲は受け手、尊敬は主体へと一つずつ割り当てる。", "related": "二方面の敬語：謙譲語＋尊敬語の組み合わせ（聞こえ給ふ・奉り給ふ・参り給ふ など）は、一つの動作で受け手と主体の両方を高める。", "isJiji": false, "sources": [{"title": "源氏物語 桐壺 本文（渋谷栄一校訂・バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/MurGenj/vol1.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「まかづ」", "url": "https://kobun.weblio.jp/content/%E7%BD%B7%E3%81%A5", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「奉る」", "url": "https://kobun.weblio.jp/content/%E5%A5%89%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまふ」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%BE%E3%81%B5", "checked": "2026-10-31"}]}, {"id": "tk-keigo-010", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "「候ふ」の丁寧の補助動詞と丁寧の本動詞", "format": "choice4", "difficulty": 2, "question": "次は『平家物語』巻第九「木曾最期」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。会話を『　』で示した）。いつもは何とも思わない鎧が今日は重く感じる、と弱音をはいた主君の木曾義仲（木曾殿）に、家来の今井四郎兼平が答える。\n\n今井四郎申けるは、『御身も未疲れさせ給はず、御馬も弱り「A候は」ず。（中略）矢七八「B候へ」ば、暫く防ぎ矢仕らん。（後略）』\n\n＊未＝いまだ。＊防ぎ矢＝敵を防ぐために射る矢。＊仕る＝いたす。\n\n傍線部A「候は」・B「候へ」の説明として最も適当なものを選べ。", "options": ["A 謙譲の補助動詞／B 謙譲の本動詞（お仕えする）── どちらも今井四郎から木曾殿への敬意", "A 丁寧の補助動詞／B 謙譲の本動詞（おそばに控える）── どちらも作者から木曾殿への敬意", "A 丁寧の本動詞（あります）／B 丁寧の補助動詞 ── どちらも今井四郎から木曾殿への敬意", "A 丁寧の補助動詞／B 丁寧の本動詞（あります）── どちらも今井四郎から木曾殿への敬意", "A 丁寧の補助動詞／B 丁寧の本動詞（あります）── どちらも作者から読者への敬意"], "answer": 3, "answerText": "A 丁寧の補助動詞／B 丁寧の本動詞（あります）── どちらも今井四郎から木曾殿への敬意", "explanation": "Aは動詞「弱る」の連用形「弱り」に付いて「…ます」と丁寧の意味を添える補助動詞（弱っておりません）。Bは「矢（が）七、八本ございますので」と「あり」の丁寧語として単独で使われた本動詞。どちらも会話文で、話し手の今井四郎から聞き手の木曾殿への敬意。", "optionNotes": ["補助動詞の「候ふ」は丁寧のみ。Bも主語は「矢」で、矢が「お仕えする」のではなく「ある」。", "会話文なので敬意の出どころは話し手の今井四郎。Bも「矢が控える」ではなく「矢がある」。", "逆。Aは動詞「弱る」の連用形に付く補助動詞、Bは「矢七八（が）」を主語にした本動詞。", "正しい。A「弱っておりません」、B「矢が七、八本ございますので」。会話の聞き手への敬意。", "地の文の丁寧語なら読者への敬意だが、ここは今井四郎の言葉の中なので聞き手（木曾殿）への敬意。"], "pitfall": "「候ふ（さぶらふ・さうらふ）」「侍り」は、貴人のそばに控える・仕える意味なら謙譲、「あり」の意味（あります・ございます）なら丁寧、用言に付く補助動詞なら丁寧。物が主語なら「控える」にはならないので丁寧と判断できる。", "related": "軍記物語では武士の会話に「候ふ」が非常に多い。「思食（おぼしめし）候べき」のように尊敬語＋丁寧語が重なる形もある。", "isJiji": false, "sources": [{"title": "平家物語 巻第九 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoHeik/vol9.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「候ふ」", "url": "https://kobun.weblio.jp/content/%E5%80%99%E3%81%B5", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「さぶらふ」", "url": "https://kobun.weblio.jp/content/%E3%81%95%E3%81%B6%E3%82%89%E3%81%B5", "checked": "2026-10-31"}]}, {"id": "tk-keigo-011", "version": 1, "status": "verified", "category": "kobun_keigo", "topic": "謙譲の本動詞「たまはる」（いただく）と敬意の対象", "format": "choice4", "difficulty": 3, "question": "次は『伊勢物語』第七十六段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。\n\nむかし、二条のきさきの、まだ春宮のみやすん所と申ける時、氏神にまうで給けるに、このゑづかさにさぶらひけるおきな、人々のろくたまはるついでに、御くるまより「たまはり」て、よみてたてまつりける。\n\n＊二条のきさき＝藤原高子（清和天皇の后）。＊春宮のみやすん所＝皇太子の母。＊ゑづかさ＝近衛府（宮中の警護をする役所）。＊ろく＝ほうびの品。＊御くるま＝二条のきさきの乗る車。\n\n傍線部「たまはり」の意味と、作者からの敬意の対象の組み合わせとして最も適当なものを選べ。", "options": ["お与えになって（尊敬語）── 翁への敬意", "いただいて（謙譲語）── 翁への敬意", "いただいて（謙譲語）── 二条のきさきへの敬意", "お与えになって（尊敬語）── 二条のきさきへの敬意", "お仕え申し上げて（謙譲語）── 二条のきさきへの敬意"], "answer": 2, "answerText": "いただいて（謙譲語）── 二条のきさきへの敬意", "explanation": "「たまはる」は「受く・もらふ」の謙譲語で「いただく」。近衛府にお仕えする翁が、ほかの人々がほうびをいただく機会に、きさきの車から直接（ほうびを）いただいて、歌を詠んで差し上げた。与えたのはきさきなので、作者からきさきへの敬意。", "optionNotes": ["主語は翁で、翁は受け取る側。平安時代の「たまはる」は「いただく」の謙譲語。", "謙譲語は動作をする翁を低め、与えてくれる相手（きさき）を高める。", "正しい。翁が、きさきの車から（ほうびを）いただく。与えた人＝きさきへの敬意。", "「たまはる」が「くださる」の意味になるのは中世以降。ここは受け取る翁の動作なので「いただく」。「たまふ」（お与えになる）と混同しない。", "「お仕えする」は前の「さぶらひ」の意味。「たまはる」は物を受け取る意味。"], "pitfall": "「たまふ（四段）」＝お与えになる（尊敬）、「たまはる」＝いただく（謙譲）。形が似ているが向きが逆。誰が誰に物を渡しているかをはっきりさせる。", "related": "「たてまつる」（差し上げる）⇔「たまはる」（いただく）。どちらも謙譲語で、相手（きさき）への敬意。", "isJiji": false, "sources": [{"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまはる」", "url": "https://kobun.weblio.jp/content/%E8%B3%9C%E3%82%8B", "checked": "2026-10-31"}]}, {"id": "tk-tango-007", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "かなし（いとしい）", "format": "choice4", "difficulty": 2, "question": "次は『伊勢物語』第二十三段（いわゆる「筒井筒」）の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。踊り字をかなに改めた）。男は河内国の新しい女のもとへ通うようになったが、もとの妻はいやな顔もせずに送り出す。男が植え込みに隠れて見ていると、妻は美しく化粧をし、夜の山道を一人で越えていく男の身を案じる歌を詠んだ。\n\n（歌略）……とよみけるをききて、かぎりなく「かなし」と思て、かうちへもいかずなりにけり。\n\n＊かうち＝河内（新しい女の住む所）。\n\n傍線部「かなし」の意味として最も適当なものを選べ。", "options": ["いとしい", "悲しい", "うらやましい", "腹立たしい", "恐ろしい"], "answer": 0, "answerText": "いとしい", "explanation": "古語「かなし」には「悲し」のほかに「愛し」の意味があり、「しみじみとかわいい・いとしい」。夫の浮気を責めず、夜道を行く夫の身だけを案じる妻の歌を聞いて、男はこの上なくいとしいと思い、河内へ通わなくなった。", "optionNotes": ["正しい。自分を案じる妻をこの上なくいとしく思い、河内へ通うのをやめた。", "現代語の意味。妻の歌に心を打たれて通うのをやめた、という流れに合わない。", "「かなし」にこの意味はない。", "妻は男を責めておらず、男が腹を立てる理由がない。", "夜道の危険を歌ったのは妻。男の気持ちは妻への愛情。"], "pitfall": "「かなし」を見たら「悲しい」だけでなく「いとしい」を必ず考える。親が子を、男が女を思う場面ではたいてい「いとしい」。", "related": "「かなしうす」＝かわいがる（伊勢物語第八十四段「いとかなしうしたまひけり」）。似た意味の語：うつくし・らうたし。", "isJiji": false, "sources": [{"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「かなし」", "url": "https://kobun.weblio.jp/content/%E3%81%8B%E3%81%AA%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-008", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "ねんごろなり（熱心だ・心をこめている）", "format": "choice4", "difficulty": 2, "question": "次は『伊勢物語』第二十四段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。踊り字をかなに改めた）。\n\n昔、おとこ、かたゐなかにすみけり。おとこ、宮づかへしにとて、わかれおしみてゆきにけるままに三とせこざりければ、まちわびたりけるに、いと「ねむごろに」いひける人に、こよひあはむとちぎりたりけるを、このおとこきたりけり。\n\n＊かたゐなか＝片田舎。＊宮づかへ＝都に出て宮廷に仕えること。＊「まちわびたりける」の主語は、残された女。＊ちぎる＝約束する。＊「ねむごろなり」は「ねんごろなり」と同じ語。\n\n傍線部「いとねむごろにいひける人」の意味として最も適当なものを選べ。", "options": ["たいそう遠慮がちに言葉をかけてきた人", "たいそう乱暴に言いがかりをつけてきた人", "たいそう冷ややかに別れを告げてきた人", "たいそう冗談めかして口説いてきた人", "たいそう熱心に（心をこめて）言い寄ってきた人"], "answer": 4, "answerText": "たいそう熱心に（心をこめて）言い寄ってきた人", "explanation": "「ねんごろ（ねむごろ）なり」は「手厚い・心をこめている」「一途だ・本気だ」の意味。男を三年待ちわびた女に、熱心に心をこめて求婚してきた別の男がいて、女はその人と「今夜結婚しよう」と約束した。", "optionNotes": ["「ねんごろなり」に「遠慮がち」の意味はない。", "女が「今夜会おう」と約束した相手なので、乱暴な人ではない。", "別れを告げたのではなく、会う約束をした相手。", "「ねんごろなり」は本気で心をこめている様子で、冗談とは反対。", "正しい。三年待った女に、心をこめて求婚し続けた別の男。"], "pitfall": "現代語の「ねんごろ」（男女が深い仲になる）や「懇意だ」の意味だけで覚えていると迷う。古文では「心をこめて・熱心に・丁寧に」がまず大事。", "related": "この段では、約束の夜に元の男が帰ってきて、女が戸を開けずに歌を詠む。「ちぎる」（約束する・夫婦の約束をする）も頻出。", "isJiji": false, "sources": [{"title": "伊勢物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoIsem/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ねんごろなり」", "url": "https://kobun.weblio.jp/content/%E3%81%AD%E3%82%93%E3%81%94%E3%82%8D%E3%81%AA%E3%82%8A", "checked": "2026-10-31"}]}, {"id": "tk-tango-009", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "さうざうし（物足りない・心寂しい）", "format": "choice4", "difficulty": 3, "question": "次は『大鏡』（太政大臣道長）の一節である（本文はウィキソース所収『国文大観』本による）。\n\n花山院の御時に、五月しもつやみに、五月雨も過ぎて、いとおどろおどろしくかきみだれ雨の降る夜、御門「さうざうしく」や思しめしけむ、殿上に出でさせおはしまして遊びおはしましけるに、\n\n＊花山院＝花山天皇。＊五月しもつやみ＝五月下旬の、月の出ていない暗い夜。＊御門＝花山天皇。このあと天皇は、人々に一人ずつ気味の悪い場所へ行ってくるよう命じる（いわゆる肝試し）。\n\n傍線部「さうざうしく」の意味として最も適当なものを選べ。", "options": ["騒がしくやかましく", "恐ろしく気味が悪く", "もの足りなく寂しく", "晴れ晴れとさわやかに", "腹立たしく不快に"], "answer": 2, "answerText": "もの足りなく寂しく", "explanation": "「さうざうし」は「物足りない・心寂しい・張り合いがない」の意味。激しい雨の夜、花山天皇は物足りなくお思いになったのか、殿上の間にお出ましになって人々と遊んだ。退屈しのぎから肝試しの話につながる。", "optionNotes": ["現代語「騒々しい」との混同。「さうざうし」とは別の語。", "雨の夜の様子からの連想。天皇はむしろ退屈しのぎに人々を集めている。", "正しい。することもない雨の夜を物足りなく思い、殿上の間に出て遊んだ。", "ひどい雨の夜で、さわやかな気分ではない。", "「さうざうし」に怒りの意味はない。"], "pitfall": "現代語の「騒々しい（そうぞうしい）」とは別の語。古文の「さうざうし」は、あるはずのものがなくて寂しい気持ち。", "related": "『徒然草』第二百十五段の「この酒をひとりたうべんがさうざうしければ」（一人で飲むのは物足りないので）も有名な例。", "isJiji": false, "sources": [{"title": "大鏡（國文大觀）ウィキソース（底本：国立国会図書館デジタルコレクション所蔵『国文大観』歴史部1）", "url": "https://ja.wikisource.org/wiki/%E5%A4%A7%E9%8F%A1_%28%E5%9C%8B%E6%96%87%E5%A4%A7%E8%A7%80%29", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「さうざうし」", "url": "https://kobun.weblio.jp/content/%E3%81%95%E3%81%86%E3%81%96%E3%81%86%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-010", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "いたづらなり（無駄だ）", "format": "choice4", "difficulty": 2, "question": "次は『徒然草』第二百三十六段の結びである（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。旧字体を新字体に改め、会話を『　』で示した）。出雲神社の獅子と狛犬が背中合わせに後ろ向きに立っているのを見た聖海上人は、深いわけがあるに違いないと感激して涙ぐんでいた。\n\n上人なほゆかしがりて、おとなしく物知りぬべき顔したる神官を呼びて、『此の御社の獅子の立てられやう、定めて習あることに侍らん。ちと承はらばや』といはれければ、『其の事に候。さがなきわらはべ共の仕りける、奇怪に候ことなり』とて、さしよりて、据ゑ直して去にければ、上人の感涙「いたづらに」なりにけり。\n\n＊習＝いわれ。＊さがなし＝いたずらだ。＊奇怪なり＝けしからぬ。\n\n傍線部「いたづらに」を含む「上人の感涙いたづらになりにけり」の意味として最も適当なものを選べ。", "options": ["上人の感激の涙はいっそう深くなった", "上人の感激の涙は無駄になってしまった", "上人の感激の涙はいつまでも止まらなかった", "上人の感激の涙は人々のいたずらの種になった", "上人の感激の涙はかえって尊いものになった"], "answer": 1, "answerText": "上人の感激の涙は無駄になってしまった", "explanation": "「いたづらなり」は「無駄だ・無意味だ」「むなしい」「手持ちぶさただ」の意味。獅子の向きは子どものいたずらで、神官はさっさと直してしまったので、深いわけを想像して流した上人の感激の涙は無駄になってしまった。", "optionNotes": ["神官の答えは「子どものいたずらで、けしからぬこと」。感激が深まる話ではない。", "正しい。いたずらな子どもの仕業とわかり、流した涙が無意味になった。", "「いたづらなり」に「止まらない」の意味はない。", "現代語の「いたずら（悪ふざけ）」からの誤解。いたずらをしたのは子どもたちで、話の結びではない。", "勘違いで流した涙が尊くなるわけではない。この段は早合点を笑う話。"], "pitfall": "現代語の「いたずら（悪ふざけ）」と結びつけない。古文の「いたづらなり」は「むだ・むなしい」。「いたづらになる」は「死ぬ」の意味になることもある。", "related": "同じ段の「ゆかしがる」（知りたがる）、「おとなし」（大人びている・分別がある）、「さがなし」（いたずらだ・意地が悪い）も頻出。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「いたづらなり」", "url": "https://kobun.weblio.jp/content/%E5%BE%92%E3%82%89%E3%81%AA%E3%82%8A", "checked": "2026-10-31"}]}, {"id": "tk-tango-011", "version": 2, "status": "verified", "category": "kobun_tango", "topic": "かたはらいたし（きまりが悪い・いたたまれない）", "format": "choice4", "difficulty": 3, "question": "次は『枕草子』「かたはらいたきもの」の段の書き出しである（本文はバージニア大学図書館 Japanese Text Initiative の有朋堂文庫本による。旧字体を新字体に改めた）。\n\n「かたはらいたき」もの\n客人などにあひて物いふに、奥の方にうち解けごと人のいふを、制せで聞く心地。\n\n＊客人＝（自分の家に来た）客。＊うち解けごと＝気を許した内輪の話。＊制す＝止める。\n\n上の例（客と話している最中の場面）での「かたはらいたき」の意味として最も適当なものを選べ。", "options": ["おかしくて笑い出したくなる", "話の続きが気になってしかたがない", "しみじみと心ひかれる", "（客の手前）きまりが悪く、いたたまれない", "うらやましくてたまらない"], "answer": 3, "answerText": "（客の手前）きまりが悪く、いたたまれない", "explanation": "「かたはらいたし」は、そばの人の目や耳が気になる気持ちで、「きまりが悪い・いたたまれない」「（他人の言動が）苦々しい」「気の毒だ」などの意味。この例は、客と話している最中に、奥で家の者が気を許した話をしているのが聞こえ、止めることもできずに聞いている場面なので、客の手前きまりが悪い気持ち。", "optionNotes": ["「おかしい・笑止だ」の意味（「片腹痛い」）は、内輪話が客に聞こえて困っているこの場面に合わない。", "内輪話を聞きたいのではなく、客に聞かれてしまうのが気になってたまらない場面。", "「あはれなり」などの意味。困っている場面に合わない。", "正しい。客と話している最中に家の者の内輪話が聞こえ、止められずにいる気持ち。", "「かたはらいたし」にこの意味はない。"], "pitfall": "現代語の「片腹痛い（身のほど知らずでおかしい）」は、「傍ら痛し」の「かたはら」を「片腹」と解して生まれた語（デジタル大辞泉）。平安時代の文章では、そばの人を意識する気持ちとして、「きまりが悪い」「苦々しい」「気の毒だ」から文脈で選ぶ。", "related": "似た意味の語：はしたなし（中途半端できまりが悪い）、やさし（身も細る思いだ・気恥ずかしい）。", "isJiji": false, "sources": [{"title": "枕草子 本文（有朋堂文庫本・バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SeiMaku/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「かたはらいたし」", "url": "https://kobun.weblio.jp/content/%E5%82%8D%E3%82%89%E7%97%9B%E3%81%97", "checked": "2026-10-31"}, {"title": "コトバンク「傍痛い」（精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%82%8D%E7%97%9B%E3%81%84-3137223", "checked": "2026-10-31"}, {"title": "コトバンク「片腹痛い」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E7%89%87%E8%85%B9%E7%97%9B%E3%81%84-463633", "checked": "2026-10-31"}]}, {"id": "tk-tango-012", "version": 2, "status": "verified", "category": "kobun_tango", "topic": "いとほし（気の毒だ）", "format": "choice4", "difficulty": 2, "question": "次は『竹取物語』「蓬莱の玉の枝」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。旧字体を新字体に改め、会話を『　』で示した）。求婚者の皇子が、かぐや姫の求めた「蓬莱の玉の枝」を持ってきた。翁は、もう断れないと結婚を勧めている。\n\n赫映姫のいふやう、『親の宣ふ事を、一向に辞み申さむ事の「いとほしさ」に、得難き物を、ゆかし、とは申しつるを、かく浅ましく持て来る事をなむ、妬く思ひ侍る』といへど、\n\n＊赫映姫＝かぐや姫。＊親＝翁。＊一向に＝ひたすら。＊辞む＝断る。＊ゆかし＝（ここでは）欲しい。＊妬し＝しゃくだ。\n\n傍線部「いとほしさに」の意味として最も適当なものを選べ。", "options": ["（親が）いとしくてたまらないので", "（断ることが）うれしくて心がはずむので", "（断ることが）恐ろしくて身がすくむので", "（断ることが）おもしろくて興味をひかれるので", "（結婚を勧める親に）気の毒なので"], "answer": 4, "answerText": "（結婚を勧める親に）気の毒なので", "explanation": "「いとほし」の中心の意味は「気の毒だ・かわいそうだ」。親（翁）のすすめる結婚をひたすらお断りするのも親に気の毒なので、手に入れにくい物を「欲しい」と申し上げたのに、と言っている。", "optionNotes": ["「いとほし」と感じる対象は「辞み申さむ事」。お断りすることが「いとしい」では意味が通らない。", "かぐや姫は困っている。「いとほし」にこの意味はない。", "「いとほし」に恐怖の意味はない。", "「をかし」などの意味。この場面に合わない。", "正しい。親の言うことを断り続けるのが気の毒で、手に入りにくい物を求めた。"], "pitfall": "「いとほし」を現代語の「いとおしい（かわいい）」と同じだと思うと誤る。古文ではまず「気の毒だ」で考える（「かわいい」「困る」の意味もある）。", "related": "かぐや姫の昇天の「翁をいとほし、かなしと思しつることも失せぬ」（翁を気の毒で、ふびんだとお思いになっていた心も消えた）も頻出。", "isJiji": false, "sources": [{"title": "竹取物語 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/AnoTake/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「いとほし」", "url": "https://kobun.weblio.jp/content/%E3%81%84%E3%81%A8%E3%81%BB%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-013", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "あさまし（驚きあきれる）", "format": "choice4", "difficulty": 2, "question": "次は『徒然草』第八十七段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。旧字体を新字体に改めた）。宇治に住む男が、義理の兄弟の具覚房（ぐかくぼう）という僧を迎えに、馬と口取りの男（従者）を送った。具覚房に酒をふるまわれて酔った従者は、帰り道で暴れて具覚房を斬りつけ、取り押さえられた。\n\n馬は血つきて、宇治大路の家に走り入りたり。「あさましく」て、男共あまた走らかしたれば、具覚房は、くちなし原にによび伏したるを、求め出でてかきもてきつ。\n\n＊宇治大路の家＝馬を送った宇治の男の家。＊走らかす＝走らせる。＊によぶ＝うめく。＊かきもて来＝かついで連れて来る。\n\n傍線部「あさましく」の意味として最も適当なものを選べ。", "options": ["驚きあきれて", "当然のことと思って", "うれしく思って", "あさはかだと思って", "眠たく思って"], "answer": 0, "answerText": "驚きあきれて", "explanation": "「あさまし」は、意外なことに「驚きあきれる」のが中心の意味で、よい意味にも悪い意味にも使い、「情けない」「あきれるほどひどい」にもなる。乗せていったはずの具覚房がおらず、血のついた馬だけが家に走りこんできたので、家の者は驚きあきれて、男たちを大勢走らせて探させた。", "optionNotes": ["正しい。血のついた馬だけが走りこんできたので、家の者はびっくりして使用人を走らせた。", "思いがけない出来事に驚く場面。「当然」とは反対。", "血のついた馬が帰ってきた場面で、喜ぶはずがない。", "現代語「浅はか」との混同。「あさまし」は「浅し」とは別の意味の語。", "「あさまし」にこの意味はない（「いぎたなし」などと混同しない）。"], "pitfall": "現代語の「浅ましい（さもしい）」や「浅はか」で訳さない。まず「驚きあきれる」で考え、文脈から「情けない・ひどい」へ広げる。", "related": "同じ段の「なまめく」（優美だ）、「かひがひし」（頼もしい）、「ひたぎりに」（めったやたらに）も見ておくとよい。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「あさまし」", "url": "https://kobun.weblio.jp/content/%E3%81%82%E3%81%95%E3%81%BE%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-014", "version": 2, "status": "verified", "category": "kobun_tango", "topic": "らうたし（かわいい・いとしい）", "format": "choice4", "difficulty": 2, "question": "次は『源氏物語』桐壺巻の一節である（本文はバージニア大学図書館 Japanese Text Initiative の渋谷栄一校訂本による。会話を『　』で示した）。帝は亡き桐壺更衣によく似た藤壺を迎えた。幼い光源氏は母に似ていると聞いて、藤壺を慕っている。\n\n上も限りなき御思ひどちにて、『な疎みたまひそ。あやしくよそへきこえつべき心地なむする。なめしと思さで、「らうたくし」たまへ。つらつき、まみなどは、いとよう似たりしゆゑ、かよひて見えたまふも、似げなからずなむ』など聞こえつけたまへれば、\n\n＊上＝帝。＊御思ひどち＝（光源氏も藤壺も）大切に思う者どうし。『　』は帝が藤壺に言う言葉。＊な〜そ＝〜するな。＊よそふ＝なぞらえる（藤壺を光源氏の母に見立てる）。＊なめし＝無礼だ。\n\n傍線部「らうたくしたまへ」の意味として最も適当なものを選べ。", "options": ["厳しくしつけてやってください", "遠ざけておいてください", "かわいがってやってください", "敬ってお仕えしてください", "気の毒に思ってそっとしておいてください"], "answer": 2, "answerText": "かわいがってやってください", "explanation": "「らうたし」は「（弱い者・幼い者が）かわいい・いとしい・いじらしい」。「らうたくす」で「かわいがる」。帝は藤壺に、光源氏を嫌わず、亡き母になぞらえられても無礼と思わずにかわいがってやってほしいと頼んでいる。", "optionNotes": ["「らうたし」は「かわいい・いとしい」。しつけの意味はない。", "直前の「な疎みたまひそ」（嫌わないでください）と逆の内容。", "正しい。帝が藤壺に、母を亡くした光源氏をかわいがるよう頼む言葉。", "藤壺は帝の后で、光源氏は幼い子。藤壺が光源氏に仕えるのではない。", "「らうたし」は守ってやりたいほどかわいい気持ち。「そっとしておく」のとは逆。"], "pitfall": "「らうたし」は「労（らう）甚し」から、いたわってやりたい気持ち。現代語にない語なので、うつくし・かなしと一緒に「かわいい」系として覚える。", "related": "「らうたげなり」（かわいらしい様子だ）も頻出。似た意味の語：うつくし・かなし（愛し）・いとほし（中心は「気の毒だ」。「かわいい」の意味もある）。", "isJiji": false, "sources": [{"title": "源氏物語 桐壺 本文（渋谷栄一校訂・バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/MurGenj/vol1.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「らうたし」", "url": "https://kobun.weblio.jp/content/%E3%82%89%E3%81%86%E3%81%9F%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-015", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "ゆゆし（不吉だ）", "format": "choice4", "difficulty": 3, "question": "次は『更級日記』の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。踊り字をかなに改めた）。\n\nその五月のついたちに、あねなる人、こうみてなくなりぬ。（中略）かたみにとまりたるおさなき人々を左右にふせたるに、あれたるいたやのひまより月のもりきて、ちごのかほにあたりたるが、いと「ゆゆしく」おぼゆれば、そでをうちおほひて、いまひとりをもかきよせて、思ぞいみじきや。\n\n＊こうみて＝子を産んで。＊かたみに＝形見として。＊おさなき人々＝姉の残した幼い子どもたち。＊いたや＝板ぶきの家。\n\n傍線部「ゆゆしく」の意味として最も適当なものを選べ。", "options": ["すばらしく美しく", "不吉で縁起が悪く", "おそれ多く尊く", "珍しく興味深く", "ほほえましくかわいらしく"], "answer": 1, "answerText": "不吉で縁起が悪く", "explanation": "「ゆゆし」は、触れてはならないものへの恐れから「おそれ多い」「不吉だ」、程度が甚だしいことから「ひどい」「すばらしい」と幅広い。姉が出産で亡くなった直後、形見の赤ん坊の顔に荒れた家のすき間から月の光が差しこんだのを不吉に感じ、作者は袖でおおってもう一人の子も抱き寄せた。", "optionNotes": ["「ゆゆし」には「すばらしい」の意味もあるが、作者はすぐに袖で顔をおおっている。美しいと見とれる場面ではない。", "正しい。母を亡くしたばかりの赤ん坊の顔に月の光が当たるのを、不吉に感じた。", "神聖なものへの「おそれ多い」は「ゆゆし」の元の意味だが、ここは姉を亡くした悲しみの中で子を守ろうとする場面。", "「ゆゆし」にこの意味はない。", "「らうたし」「うつくし」の意味。袖でおおう行動に合わない。"], "pitfall": "「ゆゆし」は良い意味（すばらしい）にも悪い意味（不吉だ・ひどい）にもなる。死や病の場面なら「不吉だ」、人や物をほめる場面なら「すばらしい」と、場面で決める。", "related": "似た幅をもつ語：いみじ（すばらしい／ひどい）、あさまし（驚きあきれる）。", "isJiji": false, "sources": [{"title": "更級日記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SugSara/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ゆゆし」", "url": "https://kobun.weblio.jp/content/%E3%82%86%E3%82%86%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-016", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "ことわり（道理）", "format": "choice4", "difficulty": 1, "question": "次は『徒然草』第百七十四段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。\n\n小鷹によき犬、大鷹に使ひぬれば、小鷹にわろくなるといふ。大につき小をすつる「ことわり」、誠にしかなり。\n\n＊小鷹＝小形の鷹を使ってする狩り。大鷹＝大形の鷹を使ってする狩り。＊しかなり＝そのとおりだ。\n\n傍線部「ことわり」の意味として最も適当なものを選べ。", "options": ["辞退", "言い訳", "ことわざ", "約束", "道理"], "answer": 4, "answerText": "道理", "explanation": "「ことわり」は名詞で「道理・筋道」。小鷹狩りに向いた犬も大鷹狩りに使うと小鷹狩りに向かなくなるという。大きいことに取りつくと小さいことを捨てるという道理は、本当にそのとおりだ、と述べている。", "optionNotes": ["「断り（ことわり）」は後の時代の意味。犬の話から人の生き方へ広げる文脈に合わない。", "犬や人が言い訳をする話ではない。", "直前の「といふ」は言い伝えを示すが、「ことわり」そのものは「道理・筋道」。", "「ちぎり」などの意味。", "正しい。大きいことにつくと小さいことを捨てるという道理は、本当にそのとおりだ。"], "pitfall": "現代語の「断り（辞退）」と同じだと思わない。古文の「ことわり」は「理」と書いて「道理」。形容動詞「ことわりなり」は「もっともだ・当然だ」。", "related": "動詞「ことわる」は古文では「筋道を立てて判断する・説明する」の意味。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ことわり」", "url": "https://kobun.weblio.jp/content/%E7%90%86", "checked": "2026-10-31"}]}, {"id": "tk-tango-017", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "やさし（優美だ）", "format": "choice4", "difficulty": 3, "question": "次は『徒然草』第十四段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。踊り字をかなに改め、引用を『　』で示した）。\n\n和歌こそなほをかしきものなれ。あやしのしづ山がつのしわざも、いひ出づればおもしろく、おそろしき猪のししも、『ふす猪の床』といへば「やさしく」なりぬ。\n\n＊しづ山がつ＝身分の低い山里の人。＊猪のしし＝いのしし。＊ふす猪の床＝いのししの寝床（和歌の言葉）。\n\n傍線部「やさしく」の意味として最も適当なものを選べ。", "options": ["気恥ずかしく、きまりが悪い", "親切で思いやりがある", "簡単でわかりやすい", "優美で風情がある", "身も細るほどつらい"], "answer": 3, "answerText": "優美で風情がある", "explanation": "「やさし」は「痩す」から「身も細る思いだ」「気恥ずかしい」の意味が生まれ、のちに「優美だ・上品だ」の意味を持つようになった。ここでは、恐ろしい猪も「ふす猪の床」と和歌の言葉にすると優美で風情のあるものになる、と和歌のすばらしさを述べている。", "optionNotes": ["「やさし」の古い意味の一つだが、ここは和歌をほめる文脈。", "現代語の「優しい」の意味。猪が親切になるのではない。", "現代語の「易しい」との混同。", "正しい。恐ろしい猪も和歌の言葉で詠むと優美なものになる、と和歌の力をほめている。", "「やさし」の元の意味（痩す＝やせる）だが、ここに合わない。"], "pitfall": "現代語の「優しい（親切）」「易しい（簡単）」で訳さない。前の「おもしろく」と並び、「をかしきもの」（和歌）をほめていることから「優美だ」と決める。", "related": "「やさし」の意味の広がり：身も細る思いだ→気恥ずかしい→慎み深い→優美だ・上品だ／殊勝だ。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「やさし」", "url": "https://kobun.weblio.jp/content/%E5%84%AA%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-tango-018", "version": 1, "status": "verified", "category": "kobun_tango", "topic": "心にくし（奥ゆかしい）", "format": "choice4", "difficulty": 3, "question": "次は『徒然草』第十段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。旧字体を新字体に、踊り字をかなに改めた）。\n\nよき人ののどやかに住みなしたる所は、さし入りたる月の色も、一きはしみじみと見ゆるぞかし。いまめかしくきららかならねど、木だち物ふりて、わざとならぬ庭の草も心あるさまに、簀子、透垣のたよりをかしく、うちある調度も昔覚えてやすらかなるこそ、「心にくし」と見ゆれ。\n\n＊よき人＝教養があり身分の高い人。＊簀子・透垣＝縁側と、すき間のある垣根。＊調度＝家具・道具。\n\n傍線部「心にくし」の意味として最も適当なものを選べ。", "options": ["奥ゆかしい", "憎らしい", "気がかりで恐ろしい", "怪しくいぶかしい", "古くさくみすぼらしい"], "answer": 0, "answerText": "奥ゆかしい", "explanation": "「心にくし」は、よく見えないところまで心がひかれる気持ちで、「奥ゆかしい・上品で心ひかれる」。今風にきらびやかではないが、木立が古び、わざとらしくない庭の草も風情があり、ふだん使いの家具も昔風で落ち着いている住まいこそ奥ゆかしく見える、と述べている。", "optionNotes": ["正しい。派手ではないが、古びて落ち着いた住まいに心がひかれる、とほめている。", "現代語「憎い」からの誤解。「こそ〜見ゆれ」と強調してほめている文。", "中世の軍記物などに見える意味。住まいをほめるこの場面に合わない。", "近世の意味。ここに合わない。", "「物ふりて（古びて）」とあるが、作者はそれを好ましく見ている。"], "pitfall": "「にくし」の字につられて「憎らしい」と訳さない。対になる考え方として、同じ段で「工の心をつくしてみがきたて」た家は「見る目も苦しく、いとわびし」と批判されている。", "related": "似た意味の語：ゆかし（心ひかれる・知りたい）、あらまほし（理想的だ）。", "isJiji": false, "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「心にくし」", "url": "https://kobun.weblio.jp/content/%E5%BF%83%E6%86%8E%E3%81%97", "checked": "2026-10-31"}]}, {"id": "tk-goi-009", "version": 1, "status": "verified", "category": "goi", "topic": "表象の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「表象」の意味として最も適当なものを、次の5つから一つ選べ。\n白いハトは、古くから平和の表象として絵や旗に描かれてきた。", "options": ["表には出さずに、心の中にしまっておく思い。", "物事の表面だけを見て、中身を考えないこと。", "多くの物事から共通する特徴を取り出してまとめた考え。", "形のない抽象的な物事を、具体的な形によって表したもの。", "ある出来事が起こる前に現れる、しるし。"], "answer": 3, "answerText": "形のない抽象的な物事を、具体的な形によって表したもの。", "explanation": "表象は、形のない考えや抽象的な物事を、具体的なものによって表すこと、また、そのもの（象徴・シンボル）。目に見えない「平和」を、白いハトという具体的な姿で表している。", "optionNotes": ["誤り。表に出さない思いは「内心」。「表」に現れる側をいう語なので逆の方向。", "誤り。「皮相」の説明。表象は「表面だけ」という意味ではない。", "誤り。「概念」の説明。辞書でも、表象は具体的な像で、抽象的な概念とは異なるとされる。", "正解。辞書の「象徴。また、象徴的に表すこと」「抽象的なものごとを、別のより具体的なものごとによってあらわすこと」にあたる。", "誤り。「前兆」「兆し」の説明。"], "pitfall": "「概念」と取り違えやすい。概念は共通点を取り出した抽象的な考え、表象は心に浮かぶ像や、具体的な形で表したもの。評論では「心に思い浮かべる像（イメージ）」の意味でも使われる。", "related": "類義語：象徴・シンボル。哲学・心理学では、知覚をもとに心に思い浮かべられる像（心像）をいう。", "isJiji": false, "sources": [{"title": "コトバンク「表象」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E8%A1%A8%E8%B1%A1-121320", "checked": "2026-10-31"}, {"title": "コトバンク「概念」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%A6%82%E5%BF%B5-42803", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-010", "version": 1, "status": "verified", "category": "goi", "topic": "契機（空欄補充）", "format": "choice4", "difficulty": 1, "question": "次の文の空欄に入る語として最も適当なものを、次の5つから一つ選べ。\n昨年の大きな地震を〔　　〕として、町では防災についての話し合いが盛んになった。", "options": ["契機", "帰結", "余地", "弊害", "理念"], "answer": 0, "answerText": "契機", "explanation": "契機は、物事が起こったり変化したりするきっかけ。地震がきっかけとなって話し合いが盛んになった、という文意に合う。「〜を契機として」「〜を契機に」の形でよく使う。", "optionNotes": ["正解。きっかけ、動機の意味。", "誤り。「帰結」は最終的に落ち着いた結論・結果。きっかけとは逆に、物事の終わりの側をいう。", "誤り。「余地」は、さらに何かを行うことのできるゆとり（「再考の余地」）。", "誤り。「弊害」は、他に悪い影響を与える物事。", "誤り。「理念」は、物事がこうあるべきだという根本の考え。"], "pitfall": "「契」の字から「約束」を連想しないこと。契機は「きっかけ」。評論では「〜を契機に（して）」の形で出ることが多い。", "related": "哲学（ヘーゲル）では、全体を成り立たせるのに欠かせない要素や、変化・発展の必然的な段階の意味でも使う。", "isJiji": false, "sources": [{"title": "コトバンク「契機」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%A5%91%E6%A9%9F-58621", "checked": "2026-10-31"}, {"title": "コトバンク「帰結」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%B8%B0%E7%B5%90-473112", "checked": "2026-10-31"}, {"title": "コトバンク「余地」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E4%BD%99%E5%9C%B0-654508", "checked": "2026-10-31"}, {"title": "コトバンク「弊害」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%BC%8A%E5%AE%B3-623848", "checked": "2026-10-31"}, {"title": "コトバンク「理念」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E7%90%86%E5%BF%B5-149180", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-011", "version": 1, "status": "verified", "category": "goi", "topic": "アイデンティティーの意味", "format": "choice4", "difficulty": 1, "question": "次の文の「アイデンティティー」の意味として最も適当なものを、次の5つから一つ選べ。\n故郷を離れて暮らすうちに、彼は自分のアイデンティティーについて考えるようになった。", "options": ["他人の気持ちを、自分のことのように感じ取る力。", "社会の中で身につけた、礼儀や作法。", "自分の利益をいちばんに考える生き方。", "周りの人と同じようにふるまおうとする傾向。", "環境や時間が変わっても、自分は自分であるという感覚。"], "answer": 4, "answerText": "環境や時間が変わっても、自分は自分であるという感覚。", "explanation": "アイデンティティーは、自己が環境や時間の変化にかかわらず、連続する同一のものであること（自己同一性）。故郷を離れたことで「自分とは何者か」を考え始めた、という文意に合う。", "optionNotes": ["誤り。「共感」の説明。", "誤り。「マナー」「礼節」の説明。", "誤り。「利己主義（エゴイズム）」の説明。", "誤り。「同調」の説明。アイデンティティーはむしろ「自分らしさ」に関わる語。", "正解。辞書の「自己同一性」「主体性」にあたる。"], "pitfall": "「アイデンティティーの喪失」「民族のアイデンティティー」のように、個人だけでなく集団についても使う。日本語では「自己同一性」「主体性」と訳されることを押さえる。", "related": "表記は「アイデンティティ」とも書く。辞書には「本人にまちがいないこと、身分証明」の意味（IDカードのID）も載っている。", "isJiji": false, "sources": [{"title": "コトバンク「アイデンティティー」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E3%81%82%E3%81%84%E3%81%A7%E3%82%93%E3%81%A6%E3%81%84%E3%81%A6%E3%81%84%E3%83%BC-421657", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-012", "version": 1, "status": "verified", "category": "goi", "topic": "看過の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「看過」の意味として最も適当なものを、次の5つから一つ選べ。\nデータの改ざんは研究全体の信頼を損なうものであり、とうてい看過できない問題だ。", "options": ["隠れている本当の姿を見抜くこと。", "気づいていながら、そのままにしておくこと。", "細かな点まで、注意深く調べること。", "他人の意見を、そのまま受け入れること。", "前もって結果を見通すこと。"], "answer": 1, "answerText": "気づいていながら、そのままにしておくこと。", "explanation": "看過は、あることを目にしていながら、そのままほうっておくこと、見逃すこと。「看過できない」は「見逃すことはできない（放っておけない）」という意味になる。", "optionNotes": ["誤り。「看破」の説明。「看過できない」を「見抜けない」と読み違えないこと。", "正解。辞書の「見逃すこと」「見過ごすこと」にあたる。", "誤り。「精査」の説明。", "誤り。「受容」などの説明。", "誤り。「予見」の説明。"], "pitfall": "「看過（かんか）＝見過ごす」と「看破（かんぱ）＝見破る」は一字違いで意味がまったく違う。「過」は「過ごす」、「破」は「破る」と字で区別する。", "related": "評論・報道では「看過できない」「看過し得ない」の否定の形で使われることが多い。", "isJiji": false, "sources": [{"title": "コトバンク「看過」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E7%9C%8B%E9%81%8E-469243", "checked": "2026-10-31"}, {"title": "コトバンク「看破」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E7%9C%8B%E7%A0%B4-471215", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-013", "version": 2, "status": "verified", "category": "goi", "topic": "端的の用法", "format": "choice4", "difficulty": 2, "question": "「端的」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["時間がなかったので、報告書の端的だけを読んで会議に出た。", "彼はいつも端的に遅刻してくるので、周りからあきれられている。", "結論を端的に言えば、この計画には予算が足りない。", "彼は端的な家庭に育ったので、ぜいたくを好まない。", "新しい制度は、まだ始まったばかりの端的な段階にある。"], "answer": 2, "answerText": "結論を端的に言えば、この計画には予算が足りない。", "explanation": "端的は、てっとりばやく要点だけをとらえるさま、また、はっきりしているさま。「端的に言えば」は「要点だけを短くはっきり言えば」という意味で、正しい使い方。", "optionNotes": ["誤り。「一部分」「一端」の意味で使っている。端的は「端（はし）の部分」という意味ではない。", "誤り。「たびたび」「しょっちゅう」の意味で使っている。", "正解。要点だけをとらえるさまとして使っている。", "誤り。「質素な」の意味で使っている。", "誤り。「初期の」「初歩的な」の意味で使っている。"], "pitfall": "「端」の字から「はし・一部分・始まり」と取らないこと。端的は「はっきりしているさま」「てっとりばやく要点だけをとらえるさま」。「端的に言えば」「端的な現れ」の形で覚える。", "related": "「不満の端的な現れ」（はっきりした現れ）のような使い方もある。", "isJiji": false, "sources": [{"title": "コトバンク「端的」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E7%AB%AF%E7%9A%84-564477", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-014", "version": 1, "status": "verified", "category": "goi", "topic": "言説（空欄補充）", "format": "choice4", "difficulty": 2, "question": "次の文の空欄に入る語として最も適当なものを、次の5つから一つ選べ。\n「若者の読書離れ」という〔　　〕は広く語られているが、それを裏づける調査は意外に少ない。", "options": ["境遇", "所作", "素養", "余韻", "言説"], "answer": 4, "answerText": "言説", "explanation": "言説は、意見を述べたり物事を説明したりすること、また、その言葉。「若者の読書離れ」という言い方が世の中で語られている一方、裏づけが少ないと続く文意に合う。", "optionNotes": ["誤り。「境遇」はその人が置かれた家庭環境や経済状態などの状況、身の上。", "誤り。「所作」は振る舞い、身のこなし。", "誤り。「素養」はふだんの学習で身につけた技能や知識、たしなみ。", "誤り。「余韻」は音が消えた後に残る響き、事が終わった後に残る味わい。", "正解。世の中で語られている意見・説明の意味。"], "pitfall": "評論では「〜という言説」の形で、世の中で当然のように語られている主張を取り上げ、その根拠を問い直す流れがよく出る。「広く語られている」「裏づけ」が手がかり。", "related": "読みは「げんせつ」（「ごんせつ」とも）。類義語：論説・説明。「〜という言説を問い直す」の形で評論に出る。", "isJiji": false, "sources": [{"title": "コトバンク「言説」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E8%A8%80%E8%AA%AC-186217", "checked": "2026-10-31"}, {"title": "コトバンク「境遇」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%A2%83%E9%81%87-478022", "checked": "2026-10-31"}, {"title": "コトバンク「所作」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%89%80%E4%BD%9C-534505", "checked": "2026-10-31"}, {"title": "コトバンク「素養」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E7%B4%A0%E9%A4%8A-555365", "checked": "2026-10-31"}, {"title": "コトバンク「余韻」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E4%BD%99%E9%9F%BB-652657", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-015", "version": 1, "status": "verified", "category": "goi", "topic": "ステレオタイプの用法", "format": "choice4", "difficulty": 2, "question": "「ステレオタイプ」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["新しい技術を誰よりも早く取り入れる彼は、まさにステレオタイプな人だ。", "この劇は、毎回ちがう筋書きで観客を驚かせるステレオタイプな作品だ。", "左右のスピーカーから音を流して、ステレオタイプの立体感を出した。", "「理系の人は人づきあいが苦手だ」というのは、ステレオタイプな見方にすぎない。", "彼はステレオタイプに意見を変えるので、仲間から信用されていない。"], "answer": 3, "answerText": "「理系の人は人づきあいが苦手だ」というのは、ステレオタイプな見方にすぎない。", "explanation": "ステレオタイプは、行動や考え方が固定的・画一的で新鮮味のないこと、紋切り型。特に、ある集団について単純化された固定的なイメージをいう。「理系の人は〜だ」と決めつける見方がそれにあたる。", "optionNotes": ["誤り。「先進的」の意味で使っている。固定的な型にはまる意味とは逆。", "誤り。毎回ちがう新鮮な作品は、紋切り型（ステレオタイプ）とは逆。", "誤り。音響の「ステレオ」と混同している。", "正解。単純化された固定的な見方として使っている。", "誤り。「たびたび」「気まぐれに」の意味で使っている。ステレオタイプは「変わらない型」。"], "pitfall": "音響の「ステレオ」と結びつけないこと。もとは印刷の「鉛版」（同じ型から何枚も刷る）で、そこから「型にはまって変わらない」の意味になった。", "related": "類義語：紋切り型・類型的・画一的。偏見や差別につながりやすいものとして評論で取り上げられる。", "isJiji": false, "sources": [{"title": "コトバンク「ステレオタイプ」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E3%81%99%E3%81%A6%E3%82%8C%E3%81%8A%E3%81%9F%E3%81%84%E3%81%B7-3156366", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-016", "version": 1, "status": "verified", "category": "goi", "topic": "通底の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「通底して」の意味として最も適当なものを、次の5つから一つ選べ。\n一見ばらばらに見える彼の作品には、故郷への思いが通底している。", "options": ["表面には現れないが、根本のところで共通している。", "物事の奥の奥まで、詳しく知り尽くしている。", "同じ表現が、どの作品でも何度も繰り返されている。", "考え方の土台が、作品ごとに異なっている。", "ほかの作品を手本にして、そっくりまねている。"], "answer": 0, "answerText": "表面には現れないが、根本のところで共通している。", "explanation": "通底は、ある事柄や思想などが、その基本的な部分で他と共通性を持っていること、見えないところで共通する性質があること。ばらばらに見える作品の根っこに、共通して故郷への思いがある、という意味。", "optionNotes": ["正解。辞書の「基本的な部分で共通性を持つ」「見えないところで共通する」にあたる。", "誤り。「通暁」の説明。「通」と「底」の字面から「底まで通じる」と取った誤り。", "誤り。「反復」の説明。通底は表面に同じものが繰り返し出ることではない。", "誤り。共通性をいう語なので、意味が逆。", "誤り。「模倣」の説明。"], "pitfall": "字面から「底まで知り尽くす」と読まないこと。「底（根本）で通じ合う」と覚える。「一見〜に見えるが」という前置きが、表面ではなく根本の共通点を示す手がかり。", "related": "「〜に通底する問題」「両者に通底する発想」の形で評論に出る。類義語：共通・通じる。", "isJiji": false, "sources": [{"title": "コトバンク「通底」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E9%80%9A%E5%BA%95-570606", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-017", "version": 1, "status": "verified", "category": "goi", "topic": "イデオロギー（空欄補充）", "format": "choice4", "difficulty": 2, "question": "次の文の空欄に入る語として最も適当なものを、次の5つから一つ選べ。\n冷戦期の世界は、資本主義と社会主義という二つの〔　　〕の対立によって、大きく分断されていた。", "options": ["コンテクスト", "ノスタルジア", "イデオロギー", "ジレンマ", "ニュアンス"], "answer": 2, "answerText": "イデオロギー", "explanation": "イデオロギーは、政治・社会などについての、歴史的・社会的立場に制約された考え方、思想傾向（特に政治・社会思想）。資本主義と社会主義という政治・経済の考え方の対立を表すのに合う。", "optionNotes": ["誤り。「コンテクスト」は文脈、また、物事の背景となる事情。", "誤り。「ノスタルジア（ノスタルジー）」は故郷や過ぎ去った時代を懐かしむ気持ち、郷愁。", "正解。政治・社会についての思想・考え方の体系。", "誤り。「ジレンマ」は二つの相反する事柄の板挟みになること。二つの思想が対立する状態そのものではない。", "誤り。「ニュアンス」は言葉などの微妙な意味合い。"], "pitfall": "「二つの〜の対立」から「ジレンマ」を選ばないこと。ジレンマは一人（一つの立場）が二つの選択肢の間で板挟みになることで、二つの勢力が対立することではない。", "related": "訳語は「観念形態」。評論では、ある立場に縛られた考え方として、批判的な意味合いで使われることもある。", "isJiji": false, "sources": [{"title": "コトバンク「イデオロギー」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E3%81%84%E3%81%A7%E3%
