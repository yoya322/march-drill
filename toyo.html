<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* 片手で解く縦長の1画面アプリ。下にタブ、出題中は全画面。押すと沈む立体ボタンが基調 */
:root{
  --bg:#F4F8EF; --surface:#FFFFFF; --fg:#1E2A1B; --muted:#66745F; --line:#DCE5D4; --line-d:#C6D2BB;
  --green:#3F51B5; --green-d:#2C3A8C; --green-t:#E2E6F8;
  --red:#F24B4B; --red-d:#C93636; --red-t:#FDE4E4;
  --sky:#1CA7EC; --sky-d:#1588C2; --sky-t:#DDF2FC;
  --yellow:#FFC800; --yellow-d:#D9A900; --gold:#E9A800; --gold-t:#FFF3C9;
  --on-color:#FFFFFF;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",system-ui,sans-serif;
  font-size:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11180F; --surface:#1B2418; --fg:#EDF3E8; --muted:#9BAA93; --line:#2C3A28; --line-d:#3A4B35;
  --green:#7B8BEA; --green-d:#4F5EC2; --green-t:#22274A;
  --red:#F25F5F; --red-d:#B83D3D; --red-t:#3A2020;
  --sky:#35B3F0; --sky-d:#1C86BD; --sky-t:#163246;
  --yellow:#FFCE2E; --yellow-d:#C99E10; --gold:#F2BC2F; --gold-t:#3A3112;
  --on-color:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11180F; --surface:#1B2418; --fg:#EDF3E8; --muted:#9BAA93; --line:#2C3A28; --line-d:#3A4B35;
  --green:#7B8BEA; --green-d:#4F5EC2; --green-t:#22274A;
  --red:#F25F5F; --red-d:#B83D3D; --red-t:#3A2020;
  --sky:#35B3F0; --sky-d:#1C86BD; --sky-t:#163246;
  --yellow:#FFCE2E; --yellow-d:#C99E10; --gold:#F2BC2F; --gold-t:#3A3112;
  --on-color:#FFFFFF; color-scheme:dark;
}
:root[data-size="s"]{font-size:15px} :root[data-size="l"]{font-size:18px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.15rem;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 16px;border-radius:16px;border:2px solid var(--line-d);border-bottom-width:5px;background:var(--surface);font-weight:800;font-size:1rem;width:100%;transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--green);border-color:var(--green-d);color:var(--on-color)}
.btn.sky{background:var(--sky);border-color:var(--sky-d);color:var(--on-color)}
.btn.red{background:var(--red);border-color:var(--red-d);color:var(--on-color)}
.btn.gold{background:var(--yellow);border-color:var(--yellow-d);color:#3B2E00}
.btn.slim{min-height:44px;font-size:.9rem;border-bottom-width:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:12px;font-size:.72rem;font-weight:800;color:var(--muted);min-height:56px}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--green-d);background:var(--green-t)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--green)}}
.badge{position:absolute;top:2px;right:18%;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:var(--on-color);font-size:.7rem;line-height:20px;text-align:center}
.hero{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.1rem;color:var(--gold)}
.streak svg{width:28px;height:28px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-d);display:grid;place-items:center;font-size:.75rem}
.dot.on{background:var(--yellow);border-color:var(--yellow-d)}
.dot.free{background:var(--sky-t);border-color:var(--sky)}
.dot.today{outline:2px solid var(--green);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.note{padding:12px 14px;border-radius:14px;background:var(--gold-t);font-size:.9rem}
.note.sky{background:var(--sky-t)} .note.green{background:var(--green-t)} .note.red{background:var(--red-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line-d);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px 12px;font-weight:700;font-size:.9rem;min-height:48px;text-align:left}
.chip[aria-pressed="true"]{background:var(--green-t);border-color:var(--green)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.li .t{flex:1;min-width:0}
.tag{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--muted)}
.tag.red{background:var(--red-t);color:var(--red-d)} .tag.sky{background:var(--sky-t);color:var(--sky-d)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-h{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:700}
.bar-h span:last-child{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:14px;border-radius:7px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:7px;background:var(--green)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
.sw{width:56px;height:32px;border-radius:16px;border:2px solid var(--line-d);background:var(--bg);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--green);border-color:var(--green-d)}
.sw[aria-checked="true"]::after{left:26px;background:var(--on-color)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{min-height:64px;border-radius:16px;border:2px solid var(--line-d);border-bottom-width:5px;background:var(--surface);font-size:1.9rem;font-weight:800;color:var(--fg);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.tile:disabled{opacity:.28}
.tile.right{border-color:var(--green);background:var(--green-t);opacity:1}
.slots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.slot{width:58px;height:66px;border-radius:12px;border:2px dashed var(--line-d);display:grid;place-items:center;font-size:2rem;font-weight:800;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;background:var(--bg)}
.slot.f{border-style:solid;border-color:var(--sky);background:var(--sky-t)}
.slot.ok{border-style:solid;border-color:var(--green);background:var(--green-t)}
.slot.ng{border-style:solid;border-color:var(--red);background:var(--red-t)}
textarea{width:100%;min-height:110px;border-radius:12px;border:2px solid var(--line-d);background:var(--bg);color:var(--fg);padding:10px;font:inherit;font-size:.8rem}
input[type=text]{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--line-d);background:var(--bg);color:var(--fg);padding:8px 12px;font:inherit}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}

/* 出題画面 */
.quiz{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.quiz.boss{box-shadow:inset 0 0 0 5px var(--gold),inset 0 0 40px var(--gold-t)}
.qhead{padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.qhead-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.x{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:26px;height:26px}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.prog i.ok{background:var(--green)} .prog i.ng{background:var(--red)} .prog i.now{background:var(--sky)}
.prog i.boss{outline:2px solid var(--gold);outline-offset:1px}
.combo{display:flex;align-items:center;gap:2px;font-weight:800;color:var(--gold);min-width:44px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.combo svg{width:22px;height:22px}
.combo.pop{animation:pop .35s}
.qbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qbody-in{max-width:520px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.bossbar{border-radius:14px;padding:10px 12px;background:var(--gold-t);border:2px solid var(--gold);font-weight:800;font-size:.9rem;display:flex;gap:8px;align-items:center}
.bossbar svg{width:22px;height:22px;flex:none;color:var(--gold)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qtext{font-size:1.08rem;font-weight:700;white-space:pre-line}
.qcard.bounce{animation:bounce .45s}
.qcard.shake{animation:shake .4s}
.qcard.burst{animation:burst .6s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:56px;padding:12px 14px;border-radius:16px;border:2px solid var(--line-d);border-bottom-width:5px;background:var(--surface);font-weight:700;font-size:.97rem;width:100%}
.opt .n{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line-d);display:grid;place-items:center;font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-t)}
.opt[aria-pressed="true"] .n{border-color:var(--sky);background:var(--sky);color:var(--on-color)}
.opt.right{border-color:var(--green);background:var(--green-t)}
.opt.right .n{background:var(--green);border-color:var(--green);color:var(--on-color)}
.opt.wrong{border-color:var(--red);background:var(--red-t)}
.opt.wrong .n{background:var(--red);border-color:var(--red);color:var(--on-color)}
.opt:disabled{cursor:default}
.recall-ans{padding:16px;border-radius:16px;background:var(--sky-t);border:2px solid var(--sky);font-weight:800;font-size:1.1rem;text-align:center}
.sheet{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--line);animation:up .3s ease-out}
.sheet.ok{border-color:var(--green)} .sheet.ng{border-color:var(--red)}
.verdict{display:flex;align-items:center;gap:10px}
.verdict svg{width:34px;height:34px;flex:none}
.verdict b{font-size:1.2rem}
.sheet.ok .verdict{color:var(--green-d)} .sheet.ng .verdict{color:var(--red-d)}
.sec-t{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pit{padding:10px 12px;border-radius:12px;background:var(--gold-t)}
.onotes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.onotes li{display:flex;gap:8px}
.onotes .m{flex:none;font-weight:800}
.onotes .m.ok{color:var(--green-d)} .onotes .m.ng{color:var(--red-d)}
.src{font-size:.78rem;color:var(--muted);word-break:break-all}
.src a{color:var(--sky-d)}
.xpchip{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--sky-d);font-size:.9rem}
.qfoot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line);background:var(--surface)}
.qfoot-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.confrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.confrow .btn{flex-direction:column;gap:0;font-size:.9rem;padding:6px}
.confrow .btn .e{font-size:1.3rem;line-height:1.2}
.ask{font-size:.85rem;font-weight:800;color:var(--muted);text-align:center}
.result{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.result .wrap{padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.big{font-size:2rem;font-weight:800;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;max-width:90vw}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes burst{0%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.storebox{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;background:rgba(240,150,40,.14);border:1px solid rgba(240,150,40,.6)}
.storebox b{display:block;margin-bottom:2px}
.storeok{font-size:13px;opacity:.75;line-height:1.5}
.codemodal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.codebox{width:100%;max-width:440px;background:var(--surface,#fff)}
</style>

  <button class="tab" role="tab" data-tab="custom" id="tab-custom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>範囲特訓</button>
  <button class="tab" role="tab" data-tab="revenge" id="tab-revenge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>リベンジ<span class="badge" id="rvBadge" hidden></span></button>
  <button class="tab" role="tab" data-tab="status" id="tab-status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>仕上がり</button>
</div></nav>

<script>

"試験範囲を「モウラ」する。", "長時間の作業で体力を「ショウモウ」する。", "楽しい「モウソウ」にふける。"], "answer": 4, "answerText": "妄想", "explanation": "「軽挙妄動」は、よく考えずに軽はずみに行動すること。「妄」は「みだりに・むやみに」の意で、根拠のない想像を表す「妄想」も同じ字。", "optionNotes": ["× 猛烈＝「猛」（たけだけしい・はげしい）", "× 盲点＝「盲」（目が見えない）。亡を含み妄と形が似る", "× 網羅＝「網」（あみ）。亡を含み形が似る", "× 消耗＝「耗」（へる）", "○ 妄想＝「妄」（みだり・でたらめ）。正解"], "pitfall": "「亡」を含む「妄（女）・盲（目）・網（糸）」の区別。むやみに・でたらめ＝妄。「軽挙猛動」と書かない。", "related": "妄：妄信・迷妄。盲：盲目・盲導犬。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉ほか）「軽挙妄動」", "url": "https://kotobank.jp/word/軽挙妄動-488332", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「猛烈」", "url": "https://kotobank.jp/word/猛烈-645075", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「盲点」", "url": "https://kotobank.jp/word/盲点-142119", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「網羅」", "url": "https://kotobank.jp/word/網羅-645068", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「消耗」", "url": "https://kotobank.jp/word/消耗-531419", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「妄想」", "url": "https://kotobank.jp/word/妄想-142109", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kanji-020", "version": 2, "status": "verified", "category": "kanji", "topic": "布石の「布」（怖・普・赴・扶との区別）", "format": "choice4", "difficulty": 3, "question": "次の文の傍線部「フセキ」のカタカナ「フ」にあたる漢字と同じ漢字を使うものを、次の5つから一つ選べ。\n将来の事業拡大に向けて、今のうちに「フセキ」を打っておく。", "options": ["暗闇に「キョウフ」を感じる。", "寒くなったので「モウフ」を出す。", "スマートフォンが広く「フキュウ」する。", "父が海外に「フニン」する。", "年老いた両親を「フヨウ」する。"], "answer": 1, "answerText": "毛布", "explanation": "「布石」はもとは囲碁で、序盤に先を見越して石を配置すること。転じて、将来に備えて手を打っておくこと。「布」はここでは「しく・ならべる」の意。意味は違うが、「毛布」（ぬの）も同じ字。", "optionNotes": ["× 恐怖＝「怖」（こわい）。布を含み形が似る", "○ 毛布＝「布」（ぬの）。正解", "× 普及＝「普」（あまねく）", "× 赴任＝「赴」（おもむく）", "× 扶養＝「扶」（たすける）"], "pitfall": "「布石」の「布」は「ぬの」ではなく「しく（並べる）」の意だが、字は同じ。「怖」は布にりっしんべんがついた形で、同じフの音なので紛らわしい。", "related": "布：分布・配布・布告（ひろく知らせる）。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉ほか）「布石」", "url": "https://kotobank.jp/word/布石-124825", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「恐怖」", "url": "https://kotobank.jp/word/恐怖-53016", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「毛布」", "url": "https://kotobank.jp/word/毛布-142127", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「普及」", "url": "https://kotobank.jp/word/普及-617004", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「赴任」", "url": "https://kotobank.jp/word/赴任-620029", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉ほか）「扶養」", "url": "https://kotobank.jp/word/扶養-125841", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-001", "version": 1, "status": "verified", "category": "kumitate", "topic": "完璧（璧と壁）", "format": "build", "difficulty": 3, "question": "次の文の「カンペキ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n審査員から「カンペキ」な演技だと絶賛された。", "answerText": "完璧", "tiles": ["完", "璧", "官", "観", "寛", "壁", "癖", "避"], "explanation": "完璧は「傷のない宝玉」の意から、欠点がまったくないこと。「璧」は宝玉のことなので、下が「玉」になる。", "optionNotes": ["正解。カン。欠けたところがない（完全・完成）", "正解。ヘキ。宝玉（双璧）。下が「玉」", "カン。役所・役人（官庁・教官）", "カン。みる（観察・客観）", "カン。心が広い（寛大・寛容）", "ヘキ。かべ（壁面・岸壁）。下が「土」。「完壁」は誤り", "ヘキ。くせ（潔癖・習癖）", "ヒ。さける（避難・逃避）。「辟」の部分が「璧」「壁」「癖」と共通"], "pitfall": "「壁（かべ）」と書く誤りがとても多い。傷がないのは「かべ」ではなく「玉」。下が「土」か「玉」かで見分ける。", "related": "「完璧」は、中国の藺相如（りんしょうじょ）が宝玉（璧）を無事に持ち帰った故事にもとづく。「双璧（＝優劣のない二つのすぐれたもの）」も同じ「璧」。", "isJiji": false, "sources": [{"title": "コトバンク「完璧」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%AE%8C%E7%92%A7-471421", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-002", "version": 2, "status": "verified", "category": "kumitate", "topic": "徐行（徐と除）", "format": "build", "difficulty": 2, "question": "次の文の「ジョコウ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n工事現場の横を、車は「ジョコウ」して通り過ぎた。", "answerText": "徐行", "tiles": ["徐", "行", "除", "叙", "助", "序", "好", "効"], "explanation": "徐行は、電車や自動車などが速度を落としてゆっくり進むこと。「徐」は「ゆっくり」の意で、「徐々に」の「徐」と同じ。", "optionNotes": ["正解。ジョ。ゆっくり（徐行・徐々に）。へんは「彳（ぎょうにんべん）」", "正解。コウ。いく・すすむ（行進・旅行）", "ジョ。のぞく（除外・解除）。へんは「阝（こざとへん）」で形が似ている", "ジョ。のべる（叙述・叙景）", "ジョ。たすける（助力・救助）", "ジョ。はじめ・順番（序幕・順序）", "コウ。このむ（好意・良好）", "コウ。ききめ（効果・効力）"], "pitfall": "「除行」と書く誤りが多い。「除」は「のぞく」。へんが「彳（ぎょうにんべん）」か「阝（こざとへん）」かで見分ける。", "related": "「徐々に（＝少しずつ）」も同じ「徐」。", "isJiji": false, "sources": [{"title": "コトバンク「徐行」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%BE%90%E8%A1%8C-534484", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-003", "version": 1, "status": "verified", "category": "kumitate", "topic": "遺憾（憾と感）", "format": "build", "difficulty": 3, "question": "次の文の「イカン」を漢字に直そう。下のマスから1字ずつ順にタップ。\n相手国の一方的な対応に対し、政府は「イカン」の意を表明した。", "answerText": "遺憾", "tiles": ["遺", "憾", "遣", "違", "偉", "感", "換", "緩"], "explanation": "遺憾は、期待したようにならず心残りであること、残念に思うこと。「遺憾の意を表する」の形でよく使う。「憾」は心の動きを表すので「忄」がつく。", "optionNotes": ["正解。イ。のこす（遺産・遺失）", "正解。カン。心残り（遺憾）。「感」に「忄（りっしんべん）」がついた字", "ケン。つかわす（派遣）。「遺」と形が似ているが、中が「貴」ではない", "イ。ちがう（違反・相違）", "イ。えらい（偉大・偉人）", "カン。感じる（感心・直感）。「忄」がない。「遺感」は誤り", "カン。かえる（交換・換気）", "カン。ゆるい（緩和・緩慢）"], "pitfall": "「遺感」と書く誤りが多い。「憾」は「感」に「忄（りっしんべん）」がついた字。また「遺（のこす）」と「遣（つかわす）」も取り違えやすい。", "related": "「万遺憾なきを期する（＝手落ちのないように万全を期する）」という言い方もある。", "isJiji": false, "sources": [{"title": "コトバンク「遺憾」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E9%81%BA%E6%86%BE-431081", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-004", "version": 1, "status": "verified", "category": "kumitate", "topic": "派遣（遣と遺）", "format": "build", "difficulty": 2, "question": "次の文の「ハケン」を漢字に直そう。下のマスから1字ずつ順にタップ。\n被災地に救援隊を「ハケン」する。", "answerText": "派遣", "tiles": ["派", "遣", "遺", "遭", "波", "覇", "県", "憲"], "explanation": "派遣は、ある使命をもって人をおもむかせること。「遣」は「つかわす（＝行かせる）」の意。", "optionNotes": ["正解。ハ。分かれる・送り出す（派生・流派）", "正解。ケン。つかわす（遣外・分遣）", "イ。のこす（遺産）。「遣」と形が似ている。「派遺」は誤り", "ソウ。あう（遭遇・遭難）。同じ「辶（しんにょう）」で形が似ている", "ハ。なみ（波浪・電波）", "ハ。力で天下を治める（覇権・制覇）。「覇権（ハケン）」は別の語で、この文には合わない（マスに「権」はない）", "ケン。（県庁・県立）", "ケン。おきて（憲法・憲章）"], "pitfall": "「遺（のこす）」と「遣（つかわす）」の取り違えに注意。「遺」は中が「貴」。音読みも「イ」と「ケン」で違う。", "related": "同音の「覇権（＝支配者としての権力）」と区別。「遣」を使う語：遣唐使・小遣い。", "isJiji": false, "sources": [{"title": "コトバンク「派遣」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%B4%BE%E9%81%A3-7319", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-005", "version": 1, "status": "verified", "category": "kumitate", "topic": "緻密（緻・密と蜜）", "format": "build", "difficulty": 3, "question": "次の文の「チミツ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n過去のデータをもとに「チミツ」な計画を練り上げた。", "answerText": "緻密", "tiles": ["緻", "密", "置", "稚", "遅", "恥", "蜜", "治"], "explanation": "緻密は、布地などのきめが細かいこと、転じて細かいところまで注意が行き届いて手落ちのないこと。「緻」も「密」も「細かい・すきまがない」の意。", "optionNotes": ["正解。チ。きめが細かい（緻密・精緻）。へんは「糸」", "正解。ミツ。すきまがない（密接・精密）。下が「山」", "チ。おく（位置・放置）", "チ。おさない（幼稚・稚魚）", "チ。おそい（遅刻・遅延）", "チ。はじる（恥辱・破廉恥）", "ミツ。はちみつ（蜜月）。下が「虫」で、「密」と形が似ている", "ジ・チ。おさめる（政治・治安）"], "pitfall": "「密」（下が山）と「蜜」（下が虫）の取り違えに注意。「緻」は糸の目が細かいことから「糸へん」と覚える。", "related": "「精緻（＝きわめて細かく正確なこと）」も同じ「緻」。", "isJiji": false, "sources": [{"title": "コトバンク「緻密」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%B7%BB%E5%AF%86-566496", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-006", "version": 1, "status": "verified", "category": "kumitate", "topic": "抜粋（粋と砕・酔）", "format": "build", "difficulty": 2, "question": "次の文の「バッスイ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n論文の要点を「バッスイ」してレポートにまとめる。", "answerText": "抜粋", "tiles": ["抜", "粋", "技", "髪", "酔", "砕", "推", "枠"], "explanation": "抜粋は、書物や作品からすぐれた部分や必要な部分を抜き出すこと。「粋」は「まじりけのない、すぐれたもの」の意。", "optionNotes": ["正解。バツ。ぬく（抜群・選抜）", "正解。スイ。まじりけがない・すぐれたもの（純粋・精粋）。へんは「米」", "ギ。わざ（技術・特技）。同じ「扌（てへん）」で形が似ている", "ハツ。かみ（頭髪・整髪）。「抜」と同じ形の部分をもつ", "スイ。よう（麻酔・心酔）。右側が「粋」と同じ形", "サイ。くだく（粉砕・砕石）。右側が「粋」と同じ形", "スイ。おす（推進・推薦）", "訓読みで「わく」（窓枠）。右側が「粋」と同じ形"], "pitfall": "右側が同じ形の「酔・砕・枠」と混同しやすい。すぐれた部分を「ぬき出す」ので、へんは「米」の「粋」。", "related": "辞書には「抜萃」という書き方も載るが、「萃」は常用漢字表にないので「抜粋」と書く。", "isJiji": false, "sources": [{"title": "コトバンク「抜粋」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%8A%9C%E7%B2%8B-602681", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-007", "version": 2, "status": "verified", "category": "kumitate", "topic": "披露（披と被・疲）", "format": "build", "difficulty": 2, "question": "次の文の「ヒロウ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n発表会で、一年間の練習の成果を「ヒロウ」した。", "answerText": "披露", "tiles": ["披", "露", "被", "彼", "疲", "皮", "路", "炉"], "explanation": "披露は「披（ひら）き露（あらわ）す」意から、広く人に知らせること、人前で発表すること。", "optionNotes": ["正解。ヒ。ひらく（披見・披露）。へんは「扌（てへん）」", "正解。ロウ（披露）。ふだんはロ（露出・露店）。あらわす", "ヒ。こうむる（被害・被告）。へんは「衤（ころもへん）」で形が似ている", "ヒ。かれ（彼岸・彼我）", "ヒ。つかれる（疲労・疲弊）。「疲労（ヒロウ）」は別の語で、この文には合わない（マスに「労」はない）", "ヒ。かわ（皮膚・樹皮）", "ロ。みち（路上・道路）", "ロ。いろり（暖炉・原子炉）"], "pitfall": "「被露」「疲露」と書く誤りが多い。手で開いて見せるので「扌（てへん）」の「披」。", "related": "同音の「疲労（＝つかれること）」と区別。「結婚披露宴」も同じ「披露」。", "isJiji": false, "sources": [{"title": "コトバンク「披露」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%8A%AB%E9%9C%B2-614316", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-008", "version": 1, "status": "verified", "category": "kumitate", "topic": "脅威（脅と驚・協）", "format": "build", "difficulty": 2, "question": "次の文の「キョウイ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n外来種の急増は、在来の生態系にとって大きな「キョウイ」となっている。", "answerText": "脅威", "tiles": ["脅", "威", "協", "驚", "恐", "偉", "為", "依"], "explanation": "脅威は、強い力や勢いでおびやかすこと、またおびやかされて感じる恐ろしさ。外来種が生態系を「おびやかす」ので「脅威」。", "optionNotes": ["正解。キョウ。おびやかす（脅迫・脅威）。下が「月（にくづき）」", "正解。イ。人をおそれさせる力（威力・威圧）", "キョウ。力を合わせる（協力・妥協）。「脅」と同じ「劦」の部分をもつ", "キョウ。おどろく（驚嘆）。「驚異（＝驚くほどすばらしいこと）」は別の語で、この文には合わない（マスに「異」はない）", "キョウ。おそれる（恐怖・恐縮）", "イ。えらい（偉大・偉人）", "イ。なす（行為・作為）", "イ。よる（依頼・依然）"], "pitfall": "同音の「驚異（＝驚き不思議がること、驚くほどすばらしい事柄）」と取り違えやすい。「おびやかす」なら「脅威」、「おどろく」なら「驚異」。", "related": "同音異義語：脅威・驚異・胸囲（むねまわり）。", "isJiji": false, "sources": [{"title": "コトバンク「脅威」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%84%85%E5%A8%81-477678", "checked": "2026-10-31"}, {"title": "コトバンク「驚異」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E9%A9%9A%E7%95%B0-477681", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-009", "version": 1, "status": "verified", "category": "kumitate", "topic": "喪失（喪と葬）", "format": "build", "difficulty": 2, "question": "次の文の「ソウシツ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n事故の衝撃で、一時的に記憶を「ソウシツ」した。", "answerText": "喪失", "tiles": ["喪", "失", "葬", "双", "荘", "矢", "質", "疾"], "explanation": "喪失は、失うこと。多く「資格」「権利」「記憶」など抽象的な事柄に使う。「喪」も「失」も「うしなう」の意。", "optionNotes": ["正解。ソウ。うしなう（喪失）。訓読みは「も（喪中）」", "正解。シツ。うしなう（失望・消失）", "ソウ。ほうむる（葬儀・埋葬）", "ソウ。ふたつ（双方・双肩）", "ソウ。おごそか（荘厳・別荘）", "シ。や（一矢を報いる・矢印）。「失」と形が似ている（上につき出ない）", "シツ。（質問・本質）", "シツ。病気・はやい（疾患・疾走）"], "pitfall": "「喪（うしなう）」と「葬（ほうむる）」の取り違えに注意。また「失」と「矢」は上がつき出るかどうかで見分ける。", "related": "「喪失」を使う語：記憶喪失・資格喪失・自信喪失。", "isJiji": false, "sources": [{"title": "コトバンク「喪失」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%96%AA%E5%A4%B1-552444", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-010", "version": 2, "status": "verified", "category": "kumitate", "topic": "未曽有（3字・未と末）", "format": "build", "difficulty": 3, "question": "次の文の「ミゾウ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n観測史上「ミゾウ」の豪雨に見舞われた。", "answerText": "未曽有", "tiles": ["未", "曽", "有", "末", "層", "僧", "右", "由"], "explanation": "未曽有は「未（いま）だ曽（かつ）て有らず」の意で、今までに一度もなかったこと、非常に珍しいこと。「ミ・ゾ・ウ」と1音ずつ3字が対応する（「みぞうう」とも読む）。", "optionNotes": ["正解。ミ。まだ〜ない（未来・未満）。上の横線が短い", "正解。ゾ（未曽有）・ソウ（曽祖父）。「かつて」の意", "正解。ウ（有無）・ユウ（所有）。ある", "マツ。すえ（末代・粉末）。上の横線が長い。「末曽有」は誤り", "ソウ。（高層・断層）。中に「曽」をふくむ", "ソウ。（僧院・高僧）。右に「曽」をふくむ", "ウ。みぎ（右岸・右折）。「有」と形が似ている", "ユ・ユウ。（由来・経由）"], "pitfall": "読みは3音でも漢字は3字。「未（まだ）」を「末（すえ）」と書く誤りに注意。「みぞうゆう」と読む誤りも多い。", "related": "常用漢字表では「曽」の読み「ゾ」の例として「未曽有」が挙がっている。", "isJiji": false, "sources": [{"title": "コトバンク「未曽有」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E6%9C%AA%E6%9B%BD%E6%9C%89-638250", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-011", "version": 1, "status": "verified", "category": "kumitate", "topic": "致命傷（3字・傷と症）", "format": "build", "difficulty": 2, "question": "次の文の「チメイショウ」を漢字に直そう。下のマスから1字ずつ順にタップ。\nその一言が、彼の政治生命にとって「チメイショウ」となった。", "answerText": "致命傷", "tiles": ["致", "命", "傷", "至", "到", "鳴", "症", "障"], "explanation": "致命傷は、もとは死の原因となる重い傷。転じて、取りかえしのつかないほど大きな痛手。命にかかわる「きず」なので「傷」。", "optionNotes": ["正解。チ。いたす（誘致・合致）", "正解。メイ。いのち（運命・生命）", "正解。ショウ。きず（負傷・傷害）", "シ。いたる（至当・冬至）。「致」の左側と同じ形", "トウ。いたる（到着・周到）", "メイ。なく（悲鳴・雷鳴）", "ショウ。病気のしるし（症状・重症）。「致命症」は誤り", "ショウ。さわる（障害・故障）"], "pitfall": "病気の「症（症状）」と書く誤りが多い。ここは「きず」の「傷」。", "related": "「致命傷を負う」のように、文字どおり命にかかわる傷の意味でも使う。", "isJiji": false, "sources": [{"title": "コトバンク「致命傷」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%87%B4%E5%91%BD%E5%82%B7-566516", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-kumi-012", "version": 1, "status": "verified", "category": "kumitate", "topic": "意味深長（4字・深長と慎重）", "format": "build", "difficulty": 3, "question": "次の文の「イミシンチョウ」を漢字に直そう。下のマスから1字ずつ順にタップ。\n彼は「イミシンチョウ」な笑みを浮かべて部屋を出て行った。", "answerText": "意味深長", "tiles": ["意", "味", "深", "長", "慎", "心", "帳", "超"], "explanation": "意味深長は、表現の示す内容が奥深くて含みのあること、表面の意味のほかに別の意味が隠されていること。「意味が深く長い」と覚える。", "optionNotes": ["正解。イ。（意見・決意）", "正解。ミ。（意味・興味）", "正解。シン。ふかい（深夜・水深）", "正解。チョウ。ながい（長所・成長）", "シン。つつしむ（慎重・謹慎）。「意味慎重」は誤り", "シン。こころ（心身・中心）", "チョウ。（帳面・通帳）", "チョウ。こえる（超越・超過）"], "pitfall": "「慎重（シンチョウ）」に引きずられて「意味慎重」と書く誤りが多い。", "related": "類義の言い方：「含蓄がある」（＝表現の奥に深い意味を含んでいる）。", "isJiji": false, "sources": [{"title": "コトバンク「意味深長」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%84%8F%E5%91%B3%E6%B7%B1%E9%95%B7-435954", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-001", "version": 1, "status": "verified", "category": "goi", "topic": "形骸化の意味", "format": "choice4", "difficulty": 1, "question": "次の文の「形骸化」の意味として最も適当なものを、次の5つから一つ選べ。\n毎朝の会議は、いまや報告を読み上げるだけの形骸化した行事になっている。", "options": ["規模が大きくなりすぎて、全体を管理できなくなること。", "古くなったものとして、正式に廃止されること。", "実質的な意味を失い、形式だけが残ること。", "形が整い、完成されたものになること。", "細かな手続きが増えて、手間がかかるようになること。"], "answer": 2, "answerText": "実質的な意味を失い、形式だけが残ること。", "explanation": "「形骸」は中身のない外形（抜けがら）。形骸化は、実質的な意味を失って形式だけが残ること。報告を読み上げるだけで、会議本来の役割を果たしていない状態を指す。", "optionNotes": ["誤り。「肥大化」などに近い意味。", "誤り。形骸化したものは、形式としては残っている（廃止されてはいない）。", "正解。辞書の意味そのもの。", "誤り。「形」の字面からの連想。中身が失われることをいうので逆の方向。", "誤り。「煩雑化」の説明。"], "pitfall": "「形」の字から「形が整う」とプラスの意味に取らないこと。「骸」は「むくろ（なきがら）」で、中身のないことを表す。", "related": "評論では「制度の形骸化」「理念の形骸化」の形でよく出る。", "isJiji": false, "sources": [{"title": "コトバンク「形骸化」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%BD%A2%E9%AA%B8%E5%8C%96-254448", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-002", "version": 2, "status": "verified", "category": "goi", "topic": "相克の意味", "format": "choice4", "difficulty": 2, "question": "次の文の「相克」の意味として最も適当なものを、次の5つから一つ選べ。\n主人公は、家業を継がねばならないという義務感と、画家になりたいという願いとの相克に苦しんだ。", "options": ["二つのものが、互いに足りない点を補い合うこと。", "二つのものの形や性質が、互いによく似ていること。", "対立する二つのものを、より高い次元で一つにまとめること。", "一方が他方を完全に打ち負かし、迷いがなくなること。", "対立・矛盾する二つのものが、互いに相手に勝とうと争うこと。"], "answer": 4, "answerText": "対立・矛盾する二つのものが、互いに相手に勝とうと争うこと。", "explanation": "相克（そうこく）は、対立・矛盾する二つのものが互いに相手に勝とうと争うこと。義務感と願いがぶつかり合い、どちらも引かない状態を表している。", "optionNotes": ["誤り。「相互補完」の説明。", "誤り。「相似」の説明。", "誤り。「止揚（アウフヘーベン）」の説明。", "誤り。決着がついた状態ではなく、争い合っている状態をいう。", "正解。辞書の意味そのもの。"], "pitfall": "「克」は「克服」の「克（かつ）」。「相克」は互いに勝とうとして争うことで、「一方が他方を完全に打ち負かし…」のように勝負がついた状態ではない。読みは「そうこく」。", "related": "「相剋」とも書くが、「剋」は常用漢字表にないので「相克」と書く。五行説の「相克」の対は「相生（そうせい）」。", "isJiji": false, "sources": [{"title": "コトバンク「相克」（デジタル大辞泉ほか）", "url": "https://kotobank.jp/word/%E7%9B%B8%E5%85%8B-552269", "checked": "2026-10-31"}, {"title": "コトバンク「相似」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%9B%B8%E4%BC%BC-89381", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-003", "version": 2, "status": "verified", "category": "goi", "topic": "枚挙にいとまがないの意味", "format": "choice4", "difficulty": 2, "question": "次の文の「枚挙にいとまがない」の意味として最も適当なものを、次の5つから一つ選べ。\n言葉の意味が時代とともに変わった例は、枚挙にいとまがない。", "options": ["たくさんありすぎて、いちいち数えきれない。", "忙しくて、一つ一つ取り上げる時間がない。", "わずかしかなく、数えるまでもない。", "取るに足りないものばかりで、取り上げる価値がない。", "確かな例が見つからず、証明することができない。"], "answer": 0, "answerText": "たくさんありすぎて、いちいち数えきれない。", "explanation": "「枚挙」は一つ一つ数え上げること、「いとま」はひま・余裕。数え上げるひまがないほど例が多い、という意味。", "optionNotes": ["正解。辞書の意味そのもの。", "誤り。「いとま＝ひま」から「忙しい」と取り違えたもの。", "誤り。意味が逆（少ない）。", "誤り。価値の高低はいわない。", "誤り。例が「ない」のではなく、多すぎるのである。"], "pitfall": "「いとまがない＝ひまがない＝忙しい」と考えると「忙しくて、一つ一つ取り上げる時間がない」に引っかかる。この句は「数えきれないほど多い」という量の表現。", "related": "辞書の見出しは「枚挙に遑がない」。「遑」は常用漢字表にない字なので、ふつうはかなで書く。", "isJiji": false, "sources": [{"title": "コトバンク「枚挙に遑がない」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E6%9E%9A%E6%8C%99%E3%81%AB%E9%81%91%E3%81%8C%E3%81%AA%E3%81%84-632850", "checked": "2026-10-31"}, {"title": "コトバンク「枚挙」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%9E%9A%E6%8C%99-632849", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-004", "version": 2, "status": "verified", "category": "goi", "topic": "等閑視の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「等閑視」の意味として最も適当なものを、次の5つから一つ選べ。\n地域住民の小さな声を等閑視してきたことが、今回の対立を招いた。", "options": ["すべてを同等に重要なものとみなすこと。", "騒ぎ立てずに、静かに見守ること。", "疑いの目で、厳しく見張ること。", "いいかげんに扱って、放っておくこと。", "特別に重んじて、最優先に扱うこと。"], "answer": 3, "answerText": "いいかげんに扱って、放っておくこと。", "explanation": "等閑視（とうかんし）は、いいかげんに扱って放っておくこと、なおざりにすること。住民の声を軽く扱ってきたことが対立を招いた、という文意に合う。", "optionNotes": ["誤り。「等（ひとしい）」の字面からの連想。", "誤り。「閑（しずか）」の字面からの連想。", "誤り。「監視」などに近い。", "正解。辞書の意味そのもの。", "誤り。意味が逆（重視）。"], "pitfall": "「等＝ひとしい」「閑＝しずか」と1字ずつ考えると「すべてを同等に…」「騒ぎ立てずに…」に引っかかる。「等閑」は「なおざり」とも読み、「いいかげん・放置」の意。", "related": "「等閑」は「なおざり」とも読み、「なおざりにする」と「等閑視する」はほぼ同じ意味。", "isJiji": false, "sources": [{"title": "コトバンク「等閑視」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%AD%89%E9%96%91%E8%A6%96-579806", "checked": "2026-10-31"}, {"title": "コトバンク「等閑」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%AD%89%E9%96%91-579791", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-005", "version": 1, "status": "verified", "category": "goi", "topic": "首肯の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「首肯しがたい」の意味として最も適当なものを、次の5つから一つ選べ。\nデータの裏付けを欠いたその結論は、にわかには首肯しがたい。", "options": ["すぐには反論しにくい。", "すぐには納得して賛成しにくい。", "すぐには最優先で取り上げにくい。", "すぐには結果を予想しにくい。", "すぐには詳しく調べにくい。"], "answer": 1, "answerText": "すぐには納得して賛成しにくい。", "explanation": "首肯（しゅこう）は、うなずくこと、納得し賛成すること。「首肯しがたい」は「うなずけない・納得できない」の意。裏付けのない結論には賛成できない、という文意に合う。", "optionNotes": ["誤り。意味が逆。首肯は「うなずく（賛成する）」こと。", "正解。「首肯＝納得して賛成すること」。", "誤り。「首」を「首位・第一」と取り違えたもの。", "誤り。予想の意味はない。", "誤り。調査の意味はない。"], "pitfall": "「首」を「首位・首席」の「第一」と考えたり、「首を横に振る＝反対」と逆に取ったりしないこと。「肯」は「肯定」の「肯（うなずく）」。", "related": "「首肯しかねる」も同じ意味。対になる語のイメージは「否定・否認」。", "isJiji": false, "sources": [{"title": "コトバンク「首肯」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E9%A6%96%E8%82%AF-528402", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-006", "version": 2, "status": "verified", "category": "goi", "topic": "朝令暮改（空欄補充）", "format": "choice4", "difficulty": 2, "question": "次の文の空欄に入る四字熟語として最も適当なものを、次の5つから一つ選べ。\n会社の方針が週ごとに変わる〔　　〕ぶりに、社員はすっかり振り回されている。", "options": ["朝三暮四", "竜頭蛇尾", "本末転倒", "朝令暮改", "千載一遇"], "answer": 3, "answerText": "朝令暮改", "explanation": "朝令暮改は、朝に出した命令を夕方にはもう改めること、方針などが絶えず変わって定まらないこと。方針が週ごとに変わり社員が振り回されている文意に合う。", "optionNotes": ["誤り。目先の違いに気をとられて実際は同じであることに気づかないこと、また、うまい言葉で人をだますこと。「朝」の字が同じで混同しやすい。", "誤り。初めは勢いがよいが、終わりは振るわないこと。", "誤り。根本的で重要なこととささいなことを取り違えること。", "正解。方針などが絶えず変わって定まらないこと。", "誤り。千年に一度しかめぐりあえないほどまれな機会。"], "pitfall": "「朝三暮四」と混同しやすい。朝三暮四は「方針が変わる」ことではなく、「目先の違いにとらわれて結局同じであることに気づかない」こと。", "related": "朝三暮四は『荘子』などに見える、猿にトチの実を与える故事から。", "isJiji": false, "sources": [{"title": "コトバンク「朝令暮改」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%9C%9D%E4%BB%A4%E6%9A%AE%E6%94%B9-569196", "checked": "2026-10-31"}, {"title": "コトバンク「朝三暮四」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%9C%9D%E4%B8%89%E6%9A%AE%E5%9B%9B-568433", "checked": "2026-10-31"}, {"title": "コトバンク「竜頭蛇尾」（デジタル大辞泉・四字熟語を知る辞典ほか）", "url": "https://kotobank.jp/word/%E7%AB%9C%E9%A0%AD%E8%9B%87%E5%B0%BE-658886", "checked": "2026-10-31"}, {"title": "コトバンク「本末転倒」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%9C%AC%E6%9C%AB%E8%BB%A2%E5%80%92-632568", "checked": "2026-10-31"}, {"title": "コトバンク「千載一遇」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%8D%83%E8%BC%89%E4%B8%80%E9%81%87-549957", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-007", "version": 1, "status": "verified", "category": "goi", "topic": "試金石の用法", "format": "choice4", "difficulty": 3, "question": "「試金石」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["将来の独立に備えて、今のうちから人脈づくりという試金石を打っておく。", "来月の初戦は、新しい監督の手腕が問われる試金石となるだろう。", "彼の鋭い問題提起は、停滞していた議論に試金石を投じた。", "長年こつこつと続けた努力が試金石となって、彼は大きな成功をつかんだ。", "試金石のように固い決意で、彼は最後まで計画をやり抜いた。"], "answer": 1, "answerText": "来月の初戦は、新しい監督の手腕が問われる試金石となるだろう。", "explanation": "試金石は、もとは金などの純度を調べるのに使う黒い硬い石。転じて、物の価値や人の力量などを計る基準となる物事。初戦が新監督の力量を計る物事になる、という使い方が正しい。", "optionNotes": ["誤り。将来のための備えは「布石を打つ」。", "正解。人の力量を計る基準となる物事として使っている。", "誤り。問題を投げかけるのは「一石を投じる」。", "誤り。成功を支える土台の意味は「礎（いしずえ）」など。", "誤り。石の「固さ」のたとえではない。"], "pitfall": "「〜を打つ（布石）」「〜を投じる（一石）」など、「石」のつく別の言い回しと混ぜないこと。試金石は「ためす（試す）」もの、と字から押さえる。", "related": "「布石」はもとは囲碁で序盤に石を配置すること、転じて将来のための備え。", "isJiji": false, "sources": [{"title": "コトバンク「試金石」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%A9%A6%E9%87%91%E7%9F%B3-518154", "checked": "2026-10-31"}, {"title": "コトバンク「布石」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%B8%83%E7%9F%B3-124825", "checked": "2026-10-31"}, {"title": "コトバンク「一石を投じる」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E4%B8%80%E7%9F%B3%E3%82%92%E6%8A%95%E3%81%98%E3%82%8B-434302", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-008", "version": 2, "status": "verified", "category": "goi", "topic": "呉越同舟の用法", "format": "choice4", "difficulty": 3, "question": "「呉越同舟」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["日ごろ激しく競い合っている二つの店が、商店街を守るために手を組んだ。まさに呉越同舟だ。", "幼いころからの親友どうしが、そろって同じ会社に就職した。まさに呉越同舟だ。", "チームの全員が、優勝という目標に向かって心を一つにした。まさに呉越同舟だ。", "家族そろって船に乗り、島めぐりを楽しんだ。まさに呉越同舟だ。", "意見の合わない二人が話し合いを打ち切り、別々の道を歩むことにした。まさに呉越同舟だ。"], "answer": 0, "answerText": "日ごろ激しく競い合っている二つの店が、商店街を守るために手を組んだ。まさに呉越同舟だ。", "explanation": "呉越同舟は、仲の悪い者どうしが同じ所に居合わせたり行動を共にしたりすること。また、敵対していても共通の困難や利害のために協力し合うこと。競い合う店どうしが商店街のために協力する例が正しい。", "optionNotes": ["正解。対立する者どうしが共通の利害のために協力している。", "誤り。仲のよい者どうしには使わない。", "誤り。もともと対立していない仲間の団結なので合わない（「一致団結」など）。", "誤り。文字どおり「同じ舟に乗る」だけの意味ではない。", "誤り。対立する者が「行動を共にする」のが呉越同舟。別々の道を行くのでは逆。"], "pitfall": "「同じ舟に乗る＝仲間」と考えて「親友どうし」「チームの全員」の選択肢に引っかかりやすい。前提は「仲の悪い者・敵どうし」であること。", "related": "『孫子』九地篇の、互いに憎み合う呉の人と越の人も同じ舟で嵐にあえば助け合う、という話による。", "isJiji": false, "sources": [{"title": "コトバンク「呉越同舟」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%91%89%E8%B6%8A%E5%90%8C%E8%88%9F-498116", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-001", "category": "kobun_bunpo", "topic": "動詞の活用（ナ変「死ぬ」と下二段「生る」）", "difficulty": 2, "question": "次は『方丈記』冒頭部分の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は一部改めた）。\n\n知らず、「A生れ（むまれ）」「B死ぬる」人、いづかたより来りて、いづかたへか去る。\n\n傍線部A「生れ」、B「死ぬる」の活用の種類と活用形の組み合わせとして最も適当なものを選べ。", "options": ["A ラ行四段活用・連用形／B ナ行下二段活用・連体形", "A ラ行下二段活用・未然形／B ナ行変格活用・終止形", "A ラ行下二段活用・連用形／B ナ行変格活用・連体形", "A ラ行下二段活用・連用形／B ナ行下二段活用・連体形", "A ラ行四段活用・未然形／B ナ行変格活用・連体形"], "answer": 2, "answerText": "A ラ行下二段活用・連用形／B ナ行変格活用・連体形", "explanation": "A「生る（むまる・うまる）」はれ／れ／る／るる／るれ／れよと活用するラ行下二段。ここは下の「死ぬる」と並べて続ける連用形（連用中止法）。B「死ぬ」はな／に／ぬ／ぬる／ぬれ／ねと活用するナ変で、体言「人」に続くので連体形。", "optionNotes": ["「生る」は四段ではない（「生るる」「生るれ」の形がある下二段）。「死ぬ」はナ変。", "「死ぬる」は「人」に続く連体形。終止形は「死ぬ」。Aも未然形ではなく、下へ続ける連用形。", "正しい。下二段の連用形「生れ」と、ナ変の連体形「死ぬる」。", "「死ぬ」はナ変。下二段「寝（ぬ）」も連体形が「ぬる」なので混同しやすい。", "「生る」は下二段。Aは連用中止法なので連用形。"], "pitfall": "「ぬる」で終わる連体形はナ変（死ぬる・往ぬる）にも下二段（寝ぬる）にもある。ナ変は「死ぬ」「往（い）ぬ（去ぬ）」の2語だけと覚え、ほかは下二段と判断する。", "related": "ナ変の活用：な・に・ぬ・ぬる・ぬれ・ね。「死す」はサ変なので別の語。", "sources": [{"title": "方丈記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/ChoHojo/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「死ぬ」", "url": "https://kobun.weblio.jp/content/%E6%AD%BB%E3%81%AC", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「生まる」", "url": "https://kobun.weblio.jp/content/%E7%94%9F%E3%81%BE%E3%82%8B", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-002", "category": "kobun_bunpo", "topic": "ナ行下二段「寝（ぬ）」の活用形（接続から判定）", "difficulty": 3, "question": "次は『宇治拾遺物語』「児のかいもちひするにそら寝したる事」（児のそら寝）の一節である（本文は教科書等で通行の本文による。国史大系本とは表記が一部異なる）。\n\nさりとて、し出ださむを待ちて「A寝」ざらむも、わろかりなむと思ひて、片方に寄りて、「B寝」たるよしにて、出で来るを待ちけるに、\n\n＊A・Bはどちらも「ね」と読む。\n\nA・Bの「寝」の活用の種類と活用形の組み合わせとして最も適当なものを選べ。", "options": ["A ナ行変格活用・未然形／B ナ行変格活用・連用形", "A ナ行下二段活用・連用形／B ナ行下二段活用・未然形", "A ナ行四段活用・未然形／B ナ行四段活用・連用形", "A ナ行下二段活用・未然形／B ナ行下二段活用・終止形", "A ナ行下二段活用・未然形／B ナ行下二段活用・連用形"], "answer": 4, "answerText": "A ナ行下二段活用・未然形／B ナ行下二段活用・連用形", "explanation": "「寝（ぬ）」はね／ね／ぬ／ぬる／ぬれ／ねよと活用するナ行下二段。Aは打消「ず」（ざら）が未然形接続なので未然形、Bは完了・存続「たり」が連用形接続なので連用形。未然形と連用形が同じ「ね」なので、下の助動詞の接続で決める。", "optionNotes": ["ナ変は「死ぬ」「往ぬ」の2語だけ。ナ変なら未然形は「な」、連用形は「に」になる。", "AとBが逆。「ず」は未然形、「たり」は連用形に付く。", "四段なら未然形は「な」になる。「寝」は下二段。", "「たり」は連用形接続。終止形なら「ぬ」の形になる。", "正しい。打消「ず」→未然形、完了・存続「たり」→連用形。"], "pitfall": "一字の動詞「寝（ぬ）」はナ変と勘違いしやすい。また下二段は未然形と連用形が同じ形なので、形ではなく下に付く語（ず・む＝未然、たり・けり・て＝連用）で見分ける。", "related": "一字の動詞：得（う）・経（ふ）・寝（ぬ）は下二段。着る・見る・似る・煮る・干る・射る・居る・率るは上一段。蹴るは下一段。", "sources": [{"title": "ウィキブックス「高等学校国語総合/宇治拾遺物語」（児のそら寝 本文・語句）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "宇治拾遺物語（国史大系本）ウィキソース", "url": "https://ja.wikisource.org/wiki/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ぬ（完了・確述の助動詞／寝）」", "url": "https://kobun.weblio.jp/content/%E3%81%AC", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-003", "category": "kobun_bunpo", "topic": "形容詞の活用の種類（シク活用「久し」）", "difficulty": 2, "question": "次は『方丈記』冒頭部分の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は一部改めた）。\n\nよどみに浮ぶうたかたは、かつ消えかつ結びて「久しく」とどまることなし。\n\n＊うたかた＝水の泡。\n\n傍線部「久しく」の文法的説明として最も適当なものを選べ。", "options": ["形容詞・ク活用・連用形", "形容詞・シク活用・連用形", "形容動詞・ナリ活用・連用形", "形容詞・シク活用・終止形", "形容詞・シク活用・連体形"], "answer": 1, "answerText": "形容詞・シク活用・連用形", "explanation": "「久し」は「なる」を付けると「久しくなる」となるのでシク活用（しく・しく・し・しき・しけれ）。ここは用言「とどまる」に続くので連用形。", "optionNotes": ["「なる」を付けると「久しくなる」と「しく」になるのでシク活用。ク活用なら「高くなる」のように「く」になる。", "正しい。シク活用の連用形「久しく」。", "形容動詞なら「久しなり」「久しに」などの形になるが、そうした形はない。", "終止形は「久し」。「久しく」は下の用言に続く連用形。", "連体形は「久しき」。"], "pitfall": "「久し」は終止形が「〜し」で終わるので、ク活用かシク活用か終止形からは決められない。「なる」を付けて「〜くなる」なら直前の形で判断：「久しくなる」→シク活用、「高くなる」→ク活用。", "related": "ク活用：く・く・し・き・けれ（補助活用から・かり・かる・かれ）。シク活用：しく・しく・し・しき・しけれ（補助活用しから・しかり・しかる・しかれ）。", "sources": [{"title": "方丈記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/ChoHojo/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「久し」", "url": "https://kobun.weblio.jp/content/%E4%B9%85%E3%81%97", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-004", "category": "kobun_bunpo", "topic": "「し」の識別（過去「き」の連体形）", "difficulty": 3, "question": "次の傍線部「し」のうち、過去の助動詞であるものを一つ選べ。いずれも『和泉式部日記』の一節である（本文はバージニア大学図書館 Japanese Text Initiative の三条西家本による。表記は読みやすく改めた）。", "options": ["夢よりもはかなき世の中を、嘆きわびつつ明か「し」暮らすほどに", "つれづれも少しなぐさむ心ち「し」て過ぐす", "あはれなるをり「し」もと思ひて", "故宮にさぶらひ「し」小舎人童なりけり", "さもあらぬを心う「し」と思ふほども"], "answer": 3, "answerText": "故宮にさぶらひし小舎人童なりけり", "explanation": "「さぶらひ」（四段動詞「さぶらふ」の連用形）に付き、体言「小舎人童」に続くので、過去の助動詞「き」の連体形「し」。（亡き宮にお仕えしていた小舎人童であった。）", "optionNotes": ["四段動詞「明かす」の連用形「明かし」の活用語尾（夜を明かし日を暮らす）。", "名詞「心ち」に付くサ変動詞「す」の連用形（ここちして＝気持ちがして）。", "「しも」の「し」は強意の副助詞。取り除いても「あはれなるをりも」と意味が通る。", "正しい。連用形に付き体言に続く＝過去「き」の連体形。", "形容詞「心憂し」（つらい・情けない）の終止形の活用語尾。下に「と」が続く。"], "pitfall": "「し」の識別は、①連用形＋し＋体言・係り結び→過去「き」の連体形、②名詞・副詞などに付き「する」の意味→サ変「す」の連用形、③取り除いても意味が通る→強意の副助詞、④形容詞・動詞の一部→活用語尾。動詞の語尾なのに「し」が付いていると見誤らない。", "related": "過去「き」の活用：せ・○・き・し・しか・○。カ変・サ変には特殊な付き方（こし・こしか、せし・せしか、しき）をする。", "sources": [{"title": "和泉式部日記（三条西家本）本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/IzuSanj/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「き（過去の助動詞）」", "url": "https://kobun.weblio.jp/content/%E3%81%8D", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「し（副助詞・サ変連用形など）」", "url": "https://kobun.weblio.jp/content/%E3%81%97", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-005", "category": "kobun_bunpo", "topic": "「さす」の識別（使役か尊敬か）", "difficulty": 3, "question": "次は『大鏡』「道長」の、藤原伊周（帥殿）と藤原道長が弓の腕を競った場面（いわゆる「弓争ひ」）である（本文はウィキソース所収『国文大観』本による。表記は読みやすく一部改めた）。\n\n帥殿の南の院にて人々集めて弓あそばししに、この殿渡らせ給へれば、思ひかけずあやしと中関白殿おぼし驚きて、いみじう饗応し申させ給ひて、下﨟におはしませど、さきに立て奉りて、まづ「A射させ」奉り給ひけるに、帥殿の矢かず今ふたつおとり給ひぬ。（中略）又「B射させ」給ふとて仰せらるるやう、「道長が家より御門后立ち給ふべきものならば、この矢あたれ」と仰せらるるに、\n\n＊帥殿＝藤原伊周。＊この殿＝藤原道長。＊中関白殿＝藤原道隆（伊周の父）。\n＊Aを含む「まづ射させ奉り給ひける」の主語は中関白殿、Bを含む「又射させ給ふ」の主語は道長である。\n\n傍線部A・Bの「させ」の文法的意味の組み合わせとして最も適当なものを選べ。", "options": ["A 使役／B 尊敬", "A 尊敬／B 尊敬", "A 尊敬／B 使役", "A 使役／B 使役", "A 受身／B 尊敬"], "answer": 0, "answerText": "A 使役／B 尊敬", "explanation": "Aは主語の中関白殿が、客の道長に先に「射させる」場面で、射る人（道長）が別にいるので使役。後の「奉り」は道長への謙譲、「給ひ」は中関白殿への尊敬。Bは道長自身が射る動作に「させ給ふ」が付いた最高敬語で、「させ」は尊敬。", "optionNotes": ["正しい。A＝中関白殿が道長に射させる（使役）、B＝道長が自分で射る動作への尊敬。", "Aは主語（中関白殿）と射る人（道長）が別なので使役。", "逆。Bは「道長が家より…この矢あたれ」と言って道長自身が射ている。", "Bに「…に射させる」相手はいない。道長本人の動作で、「給ふ」と重ねた尊敬。", "「さす」の受身は軍記物の武士の言葉に限られる特殊な用法。ここには当たらない。"], "pitfall": "「させ給ふ」は最高敬語（尊敬＋尊敬）とは限らない。「誰に〜させるのか」という相手が文脈にいれば使役。主語と、実際に動作をする人が同じかどうかを確かめる。", "related": "「す」「さす」「しむ」は単独なら使役、「給ふ」「おはします」などの尊敬語と一緒なら尊敬のことが多い（ただし使役の相手がいれば使役）。", "sources": [{"title": "大鏡（國文大觀）ウィキソース（底本：国立国会図書館デジタルコレクション所蔵『国文大観』歴史部1）", "url": "https://ja.wikisource.org/wiki/%E5%A4%A7%E9%8F%A1_%28%E5%9C%8B%E6%96%87%E5%A4%A7%E8%A7%80%29", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「さす（使役・尊敬の助動詞）」", "url": "https://kobun.weblio.jp/content/%E3%81%95%E3%81%99", "checked": "2026-10-31"}]}, {"version": 2, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-006", "category": "kobun_bunpo", "topic": "「まし」の意味（ためらいの意志）", "difficulty": 2, "question": "次は『和泉式部日記』で、帥宮（そちのみや）が女に語る言葉の一部である（本文はバージニア大学図書館 Japanese Text Initiative の三条西家本による。表記は読みやすく改めた。前後略）。\n\nまたたびたび帰るほどの心ちのわりなかりしも、人げなくおぼえなどせしかば、いかにせ「まし」と思ふをりをりもあれど、\n\n＊わりなし＝つらい。＊人げなし＝人並みでない、体裁が悪い。\n\n傍線部「まし」の文法的意味として最も適当なものを選べ。", "options": ["反実仮想（もし…だったら…だろうに）", "推量（…だろう）", "ためらいの意志（…しようかしら）", "打消推量（…ないだろう）", "希望（…であればよいのに）"], "answer": 2, "answerText": "ためらいの意志", "explanation": "疑問の語「いかに」とともに用いた「いかにせまし」は「どうしようかしら」と迷う気持ちを表す、ためらいの意志の「まし」。宮は、女のもとを訪ねても会えずに何度も帰ったつらさから、どうしたものかと迷ったことを語っている。", "optionNotes": ["反実仮想なら「ましかば〜まし」「せば〜まし」など、事実と反対の仮定が前にある。ここにはない。", "中世以降の「まし」には推量の用法もあるが、ここは疑問語「いかに」と組んだ迷いの表現。", "正しい。「いかに〜まし」「や〜まし」の形は、ためらいの意志。", "打消推量は「じ」「まじ」。「まし」に打消の意味はない。", "希望（悔恨）の「まし」は、実際と異なる事態を述べて「そうならよいのに」と願う用法。ここは迷い。"], "pitfall": "「まし」を見たらすぐ反実仮想と決めない。疑問の語（いかに・何・や・いづれ）と組んでいたら「…しようかしら」のためらいの意志。", "related": "「まし」の4用法：①反実仮想 ②悔恨・希望 ③ためらいの意志 ④（中世以降）推量・意志。", "sources": [{"title": "和泉式部日記（三条西家本）本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/IzuSanj/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「まし」", "url": "https://kobun.weblio.jp/content/%E3%81%BE%E3%81%97", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-007", "category": "kobun_bunpo", "topic": "係り結び（こそ〜「め」＝「む」の已然形）", "difficulty": 2, "question": "次は『更級日記』の一節で、源氏物語に夢中になっていた少女時代の作者が、自分の将来を想像していたことを振り返る場面である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく一部改めた。前略）。\n\n……宇治の大将の浮舟の女君のやうにこそあら「め」と思ひける心、まづいとはかなくあさまし。\n\n＊宇治の大将＝薫。浮舟の女君＝薫に愛された女性。いずれも源氏物語の登場人物。\n\n傍線部「め」の文法的説明として最も適当なものを選べ。", "options": ["推量の助動詞「む」の連体形で、係助詞「こそ」の結び", "推定の助動詞「めり」の連用形", "推量の助動詞「む」の已然形で、下に接続助詞「ど」が省略されている", "推量の助動詞「む」の命令形", "推量の助動詞「む」の已然形で、係助詞「こそ」の結び"], "answer": 4, "answerText": "推量の助動詞「む」の已然形で、係助詞「こそ」の結び", "explanation": "係助詞「こそ」があるので結びは已然形。推量の助動詞「む」（ま・○・む・む・め・○）の已然形が「め」。「浮舟の女君のようにきっとなるだろう」と思っていたことを表す。", "optionNotes": ["「む」の連体形は「む」。「こそ」の結びは連体形ではなく已然形。", "「めり」なら連用形も「めり」。「め」という形はない。", "「こそ〜已然形、」と文が続けば逆接になるが、ここは「と思ひける」と引用されて文が終わっている。", "「む」に命令形はない（ま・○・む・む・め・○）。", "正しい。こそ→已然形の結びで、「む」の已然形「め」。"], "pitfall": "「め」を見たら「む」の已然形を疑い、上に「こそ」があるか探す。「ぞ・なむ・や・か」なら結びは連体形、「こそ」だけが已然形。", "related": "「やうに」は比況の助動詞「やうなり」の連用形（〜のように）。", "sources": [{"title": "更級日記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SugSara/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「む（推量の助動詞）」", "url": "https://kobun.weblio.jp/content/%E3%82%80", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「やうなり」", "url": "https://kobun.weblio.jp/content/%E3%82%84%E3%81%86%E3%81%AA%E3%82%8A", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-bunpo-008", "category": "kobun_bunpo", "topic": "「ぬ」の確述（強意）＋「べし」", "difficulty": 2, "question": "次は『徒然草』第百三十七段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による）。\n\n花は盛りに、月はくまなきをのみ見るものかは。（中略）咲き「ぬ」べきほどの梢、散りしをれたる庭などこそ見所多けれ。\n\n傍線部「ぬ」の文法的意味と、「咲きぬべきほどの梢」の意味の組み合わせとして最も適当なものを選べ。", "options": ["完了 ── もう咲いてしまったころの梢", "確述（強意） ── 今にも咲きそうなころの梢", "打消 ── 咲くはずのないころの梢", "完了 ── 咲いてしまっているはずのころの梢", "打消 ── 咲かないにちがいないころの梢"], "answer": 1, "answerText": "確述（強意） ── 今にも咲きそうなころの梢", "explanation": "「咲き」は連用形なので、この「ぬ」は打消「ず」ではなく完了の助動詞「ぬ」（終止形）。下に推量の「べし」が付く「ぬべし」では、確述（強意）で「きっと…だろう・今にも…しそうだ」。満開の前の、今にも咲きそうな梢を言っている。", "optionNotes": ["「べし」と組んだ「ぬ」は確述。また「散りしをれたる庭」と対になるのは、咲く前の梢。", "正しい。ぬ（確述）＋べし（推量）＝今にも咲きそうな。", "打消「ず」の連体形「ぬ」は未然形に付く（咲かぬ）。「咲き」は連用形。", "「ぬべし」の「ぬ」は完了ではなく確述。満開前の梢という本文の対比にも合わない。", "打消なら「咲かぬ」となる。連用形「咲き」に付く「ぬ」は打消ではない。"], "pitfall": "「ぬ」の上が連用形なら完了の「ぬ」。さらに下に「む・べし・らむ」など推量の語が来たら、完了ではなく確述（強意）で「きっと・今にも」と訳す。", "related": "「なむ（ぬ＋む）」「ぬべし」「つべし」「てむ」は確述＋推量の形。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「ぬ（完了・確述の助動詞／寝）」", "url": "https://kobun.weblio.jp/content/%E3%81%AC", "checked": "2026-10-31"}]}, {"version": 2, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-tango-001", "category": "kobun_tango", "topic": "念ず（がまんする）", "difficulty": 2, "question": "次は『宇治拾遺物語』「児のそら寝」の一節である（本文は教科書等で通行の本文による。表記は一部改めた）。ぼたもちができあがったのに、児は一度の呼びかけで返事をするのはきまりが悪いと思い、寝たふりを続けている。\n\nいま一声呼ばれていらへむと、「念じて」寝たるほどに、「や、な起こし奉りそ。をさなき人は寝入り給ひにけり」と言ふ声のしければ、\n\n＊いらふ＝返事をする。\n\n傍線部「念じて」の意味として最も適当なものを選べ。", "options": ["心の中で神仏に祈って", "声に出して念仏を唱えて", "すっかりあきらめて", "じっとがまんして", "うっかり油断して"], "answer": 3, "answerText": "じっとがまんして", "explanation": "「念ず」には「心の中で祈る」と「がまんする・こらえる」の意味がある。ここは、もう一度呼ばれてから返事をしようと、起きたいのをこらえて寝たふりをしている場面なので「がまんして」。", "optionNotes": ["「念ず」の①の意味だが、ここで児は祈っているのではなく、返事をしたいのをこらえている。", "念仏を唱える場面ではない。寝たふりを続けている。", "あきらめたのではなく、もう一度呼ばれるのを待っている。", "正しい。起きたい気持ちをこらえて寝たふりを続けている。", "わざと寝たふりをしているので、油断ではない。"], "pitfall": "「念ず」を現代語の「念じる＝祈る」だけで覚えていると誤る。我慢する場面では「こらえる」。", "related": "同じ場面の「わびし」（つらい・情けない）、「ずちなし」（どうしようもない）、「無期（むご）」（長い時間）も頻出。", "sources": [{"title": "ウィキブックス「高等学校国語総合/宇治拾遺物語」（児のそら寝 本文・語句）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "宇治拾遺物語（国史大系本）ウィキソース", "url": "https://ja.wikisource.org/wiki/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「念ず」", "url": "https://kobun.weblio.jp/content/%E5%BF%B5%E3%81%9A", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-tango-002", "category": "kobun_tango", "topic": "うたてし（がっかりだ・情けない）", "difficulty": 2, "question": "次は『宇治拾遺物語』「田舎の児、桜の散るを見て泣く事」の結びである（本文はウィキソース所収の国史大系本による。表記は読みやすく改めた）。桜が散るのを見て泣く児を、僧が「桜ははかないものだから」と慰めたところ、児は次のように答えた。\n\n「桜の散らんは、あながちにいかがせん、苦しからず。我てての作りたる麦の花散りて、実の入らざらん思ふがわびしき」と言ひて、さくりあげて、よよと泣きける。「うたてし」やな。\n\n＊てて＝父。＊さくりあぐ＝しゃくりあげる。\n\n傍線部「うたてし」の意味として最も適当なものを選べ。", "options": ["がっかりする（情けない）", "かわいらしい", "すばらしい", "不思議だ", "恐ろしい"], "answer": 0, "answerText": "がっかりする（情けない）", "explanation": "児は桜の風情を惜しんで泣いたのではなく、父の作った麦の実りを心配して泣いていた。語り手はそれを「がっかりすることだなあ」と評している。学研全訳古語辞典もこの箇所を「がっかりするなあ」と訳す。", "optionNotes": ["正しい。風流心からの涙と思ったら実利の心配だったことへの失望。", "児のしぐさをほめる言葉ではない。「うつくし」と混同しない。", "ほめる語ではない。「うたてし」は不快・失望を表す。", "「あやし」の意味。", "「おそろし」の意味。この場面に恐ろしさはない。"], "pitfall": "「うたてし」「うたて」は、事態がいやな方向に進むことへの不快・失望を表す。話の「落ち」で語り手が評する言葉として出やすい。", "related": "「うたてし」には「いたわしい・気の毒だ」の意味もある（平家物語など）。文脈で判断する。", "sources": [{"title": "宇治拾遺物語（国史大系本）ウィキソース", "url": "https://ja.wikisource.org/wiki/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「うたてし」", "url": "https://kobun.weblio.jp/content/%E3%81%86%E3%81%9F%E3%81%A6%E3%81%97", "checked": "2026-10-31"}]}, {"version": 2, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-tango-003", "category": "kobun_tango", "topic": "まめまめし（実用的だ）", "difficulty": 2, "question": "次は『更級日記』「物語」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。作者は、地方から上京してきたおばの家を訪ねた。\n\nをばなる人の田舎よりのぼりたる所に渡いたれば、「いとうつくしう生ひなりにけり」など、あはれがり、めづらしがりて、帰るに、「何をか奉らむ。「まめまめしき」物は、まさなかりなむ。ゆかしくし給ふなる物を奉らむ」とて、源氏の五十余巻、櫃に入りながら、……\n\n＊渡いたれば＝（親が作者を）行かせたところ。＊まさなし＝よくない、ふさわしくない。\n\n傍線部「まめまめしき」の意味として最も適当なものを選べ。", "options": ["心のこもった", "豪華な", "珍しい", "古くさい", "実用的な"], "answer": 4, "answerText": "実用的な", "explanation": "おばは「実用的な物はよくないだろう。（あなたが）見たがっていらっしゃるという物を差し上げよう」と言って、源氏物語などの物語を贈った。「まめまめし」は「まめ（実直・実用）」を重ねた語で、ここは「実用的だ」。", "optionNotes": ["「まめまめし」の①は人の態度について「まじめだ・本気だ」の意味。ここは物について言う②「実用的だ」で、「心のこもった」では、見たがっている物語と対比する文脈に合わない。", "豪華さを言う語ではない。", "「めづらし」の意味。", "「古めかし」の意味。", "正しい。日用品のような実用品はやめて、作者が見たがる物語を贈ろうという文脈。"], "pitfall": "「まめまめし」には①まじめだ・本気だ、②実用的だ、の2つの意味がある。物について言うときは②。対になる「ゆかしくし給ふなる物（物語）」がヒント。", "related": "「まめなり」＝まじめだ・実用的だ。対義語は「あだなり」（誠実でない・はかない）。", "sources": [{"title": "更級日記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SugSara/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「まめまめし」", "url": "https://kobun.weblio.jp/content/%E3%81%BE%E3%82%81%E3%81%BE%E3%82%81%E3%81%97", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-tango-004", "category": "kobun_tango", "topic": "くまなし（かげりがない）", "difficulty": 2, "question": "次は『徒然草』第百三十七段の冒頭である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は一部改めた）。\n\n花は盛りに、月は「くまなき」をのみ見るものかは。雨にむかひて月を恋ひ、たれこめて春の行方知らぬも、なほあはれに情深し。\n\n傍線部「くまなき」の意味として最も適当なものを選べ。", "options": ["欠けて細くなっている", "雲に見え隠れしている", "かげりがない（満月の）", "抜け目のない", "夜明け前の"], "answer": 2, "answerText": "かげりがない", "explanation": "「くま（隈）」は暗いところ・かげ。「くまなし」はかげりがないことで、月について言えば一点の曇りもない満月。「花は満開のときに、月はかげりのない満月のときにだけ見るものだろうか、いやそうではない」という段の主張になる。", "optionNotes": ["欠けた月は「くまなき」月の反対。", "雲に隠れる月は、むしろ兼好が味わい深いとする月の姿。", "正しい。かげりのない満月。", "「くまなし」には人について「抜け目ない」の意味もあるが、ここは月の様子。", "時刻を表す語ではない。"], "pitfall": "「くまなし」は対象で訳し分ける。月・光なら「かげりがない」、人・心なら「抜け目ない・ゆきとどいている」。", "related": "「〜ものかは」は反語（…だろうか、いや…ない）。この段は、盛りだけでなく盛りの前後にも趣があると説く。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「くまなし」", "url": "https://kobun.weblio.jp/content/%E3%81%8F%E3%81%BE%E3%81%AA%E3%81%97", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-tango-005", "category": "kobun_tango", "topic": "あなかま（しっ、静かに）", "difficulty": 1, "question": "次は『更級日記』「大納言殿の姫君」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。夜ふけに物語を読んでいた作者のそばに、どこからか美しい猫がやって来た。\n\nいづくより来つる猫ぞと見るに、姉なる人、「「あなかま」、人に聞かすな。いとをかしげなる猫なり。飼はむ」とあるに、\n\n傍線部「あなかま」の意味として最も適当なものを選べ。", "options": ["ああ、かわいい", "しっ、静かに", "さあ、急いで", "おや、まあ", "ああ、恐ろしい"], "answer": 1, "answerText": "しっ、静かに", "explanation": "「あなかま」は人の話や声を止めるときの言葉で「しっ、静かに」。すぐ後の「人に聞かすな（人に聞かせるな）」と合わせて、迷い込んだ猫のことを人に知られないよう制している。", "optionNotes": ["「をかしげなる猫なり」の部分と混同しない。「あなかま」は声を止める語。", "正しい。直後の「人に聞かすな」と内容が一致する。", "急がせる言葉ではない。", "驚きを表す語ではない。", "恐ろしさを表す語ではない。"], "pitfall": "「あな」は「ああ」という感動詞だが、「あなかま」は一語で「静かに」。「かま」は「かまし（やかましい）」の語幹。", "related": "「あなかしこ」＝ああ恐れ多い（下に禁止を伴うと「決して…するな」）。", "sources": [{"title": "更級日記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SugSara/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「あなかま」", "url": "https://kobun.weblio.jp/content/%E3%81%82%E3%81%AA%E3%81%8B%E3%81%BE", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-tango-006", "category": "kobun_tango", "topic": "あやし（粗末だ・みすぼらしい）", "difficulty": 3, "question": "次は『和泉式部日記』の一節である（本文はバージニア大学図書館 Japanese Text Initiative の三条西家本による。表記は読みやすく改めた）。帥宮（そちのみや）が人目を忍んで、女（作者）の家を初めて訪ねる場面。\n\n「しのびて物へ行かん」とのたまはすれば、「さなめり」と思ひてさぶらふ。「あやしき」御車にておはしまいて、かくなむと言はせたまへれば、\n\n＊のたまはす＝おっしゃる。主語は帥宮。\n\n傍線部「あやしき」の意味として最も適当なものを選べ。", "options": ["不思議な力をもつ", "きらびやかで立派な", "いつもの見慣れた", "粗末な（みすぼらしい）", "不安で落ち着かない"], "answer": 3, "answerText": "粗末な（みすぼらしい）", "explanation": "宮は「しのびて（人目を忍んで）」出かけるので、身分にふさわしい立派な車ではなく、目立たない粗末な車で来た。「あやし」には「不思議だ」系の意味と、「身分が低い・粗末だ」系の意味があり、ここは後者。", "optionNotes": ["「あやし」の「不思議だ」の意味だが、車について言う文脈に合わない。", "人目を忍ぶ外出なので、立派な車は使わない。", "「あやし」には「見慣れない」の意味があり、「見慣れた」はその反対。", "正しい。お忍びのための粗末な車。", "「あやし」には「不安だ」の意味もあるが、車の様子を言う語として合わない。"], "pitfall": "「あやし」は漢字で2系統。【怪し】不思議だ・変だ、【賤し】身分が低い・粗末だ。身分の高い人が質素な物を使う場面や、庶民について言う場面では【賤し】。", "related": "「あやしの賤（しづ）」＝身分の低い者。『徒然草』第百九段「あやしき下臈なれども」も【賤し】。", "sources": [{"title": "和泉式部日記（三条西家本）本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/IzuSanj/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「あやし」", "url": "https://kobun.weblio.jp/content/%E3%81%82%E3%82%84%E3%81%97", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-keigo-001", "category": "kobun_keigo", "topic": "二方面の敬語（参り給ふ）の敬意の対象", "difficulty": 2, "question": "次は『大鏡』「頼忠」の一節（いわゆる「三船の才」）である（本文はウィキソース所収『国文大観』本による。表記は読みやすく一部改めた）。\n\n一とせ入道殿大井川の逍遥せさせ給ひしに、作文の船、管弦の船、和歌の船と分たせ給ひて、その道にたへなる人々をのせさせ給ひしに、この大納言殿の「参り給へ」るを、入道殿、「かの大納言いづれの船にか乗らるべき」とのたまはすれば、「和歌の船にのり侍らむ」とのたまひて、よみたまへるぞかし。\n\n＊入道殿＝藤原道長。＊大納言殿＝藤原公任。＊作文＝漢詩を作ること。\n\n傍線部「参り給へ」の「参り」と「給へ」は、それぞれ語り手から誰への敬意を表すか。組み合わせとして最も適当なものを選べ。", "options": ["参り＝入道殿／給へ＝大納言殿", "参り＝大納言殿／給へ＝入道殿", "参り＝入道殿／給へ＝入道殿", "参り＝大納言殿／給へ＝大納言殿", "参り＝和歌の船の人々／給へ＝大納言殿"], "answer": 0, "answerText": "参り＝入道殿／給へ＝大納言殿", "explanation": "「参る」は「行く・来」の謙譲語で、参上する先（入道殿＝道長）を敬う。「給ふ」は尊敬の補助動詞で、動作をする人（参上した大納言殿＝公任）を敬う。", "optionNotes": ["正しい。謙譲語→動作の受け手（参上先の道長）、尊敬語→動作の主体（公任）。", "逆。参上する主体は大納言殿なので、主体を敬うのは尊敬語「給へ」のほう。", "尊敬語「給へ」は動作の主体（大納言殿）を敬う。入道殿は参上される側。", "謙譲語「参り」は主体ではなく、参上する先の人を敬う。", "大納言殿は入道殿のもとへ参上した。船の人々が参上先ではない。"], "pitfall": "謙譲語は「動作を受ける人」、尊敬語は「動作をする人」への敬意。「参り給ふ」は「誰が・どこへ参上したか」を先に確かめる。", "related": "この話で公任は和歌の船に乗って「小倉山嵐の風の寒ければ紅葉の錦着ぬ人ぞなき」と詠んだ。", "sources": [{"title": "大鏡（國文大觀）ウィキソース（底本：国立国会図書館デジタルコレクション所蔵『国文大観』歴史部1）", "url": "https://ja.wikisource.org/wiki/%E5%A4%A7%E9%8F%A1_%28%E5%9C%8B%E6%96%87%E5%A4%A7%E8%A7%80%29", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「参る」", "url": "https://kobun.weblio.jp/content/%E5%8F%82%E3%82%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまふ（四段・下二段）」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%BE%E3%81%B5", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-keigo-002", "category": "kobun_keigo", "topic": "下二段「給ふ」（謙譲）の識別と敬意の対象", "difficulty": 3, "question": "次は『和泉式部日記』冒頭部分で、亡き宮（故宮）に仕えていた小舎人童（こどねりわらわ）が女（作者）に近況を語る言葉である（本文はバージニア大学図書館 Japanese Text Initiative の三条西家本による。表記は読みやすく改めた）。\n\n「そのことと候はでは、なれなれしきさまにやとつつましう候ふうちに、日ごろは山寺にまかり歩きてなん。いとたよりなく、つれづれに思ひ「たまふ」らるれば、御かはりにも見たてまつらんとてなん、帥の宮に参りてさぶらふ」と語る。\n\n＊帥の宮＝故宮の弟。＊「思ひたまふらるれ」の「思ふ」の主語は小舎人童自身。\n\n傍線部「たまふ」の説明として最も適当なものを選べ。", "options": ["尊敬語で、小舎人童から女への敬意", "尊敬語で、作者から小舎人童への敬意", "謙譲語で、小舎人童から帥の宮への敬意", "丁寧語で、作者から読者への敬意", "謙譲語（下二段活用）で、小舎人童から聞き手の女への敬意"], "answer": 4, "answerText": "謙譲語（下二段活用）で、小舎人童から聞き手の女への敬意", "explanation": "会話文の中で、話し手自身の「思ふ」に付いた「たまふ」は、下二段活用の謙譲の補助動詞（…させていただく）。話し手（小舎人童）が聞き手（女）にへりくだって敬意を表す。自分の動作を尊敬する尊敬語「給ふ」（四段）ではない。", "optionNotes": ["「思ふ」のは小舎人童自身。自分の動作に尊敬語は使わない。", "会話文の敬語は話し手からの敬意。作者からではない。また童自身に尊敬語は使わない。", "帥の宮を敬うのは、後の「参り」（謙譲語）。「思ひたまふ」は聞き手への敬意。", "「たまふ」は丁寧語ではない。また会話文なので作者からの敬意ではない。", "正しい。話し手自身の「思ふ」に付く下二段「たまふ」＝謙譲。敬意は聞き手へ。"], "pitfall": "「給ふ」は四段なら尊敬、下二段なら謙譲。下二段の「給ふ」は、会話文・手紙で、話し手自身の「思ふ・見る・聞く・知る」に付くのが目印。", "related": "下二段「給ふ」の活用：へ・へ・（ふ）・ふる・ふれ・○。「思ひ給へて」「見給ふる」などの形でも出る。", "sources": [{"title": "和泉式部日記（三条西家本）本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/IzuSanj/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまふ（四段・下二段）」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%BE%E3%81%B5", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-keigo-003", "category": "kobun_keigo", "topic": "会話文中の尊敬語（給ふ）の敬意の方向", "difficulty": 2, "question": "次は『更級日記』「大納言殿の姫君」の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は読みやすく改めた）。作者と姉がかわいがっていた猫について、病気の姉が見た夢を作者に語っている。\n\n「夢にこの猫のかたはらに来て、『おのれは、侍従の大納言殿の御むすめのかくなりたるなり。さるべき縁のいささかありて、この中の君のすずろにあはれと思ひ出で「給へ」ば、ただしばしここにあるを、このごろ下衆の中にありて、いみじうわびしきこと』と言ひて、……」\n\n＊中の君＝次女。ここでは作者。＊『 』は、夢の中で猫が姉のそばに来て言った言葉。\n\n傍線部「給へ」は、誰から誰への敬意を表すか。最も適当なものを選べ。", "options": ["姉から猫（大納言殿の御むすめ）へ", "作者から姉へ", "猫（大納言殿の御むすめ）から中の君（作者）へ", "猫（大納言殿の御むすめ）から姉へ", "中の君（作者）から侍従の大納言へ"], "answer": 2, "answerText": "猫（大納言殿の御むすめ）から中の君（作者）へ", "explanation": "『 』は猫（侍従の大納言の娘の生まれ変わり）の言葉なので、敬意は話し手の猫から。「給へ」は尊敬の補助動詞で、「思ひ出づ」の主体である中の君（作者）を敬う。", "optionNotes": ["「給へ」は猫の言葉の中にあり、話し手は姉ではない。", "会話文中の敬語は話し手からの敬意。作者からではない。", "正しい。話し手＝猫、尊敬語→動作の主体（あはれと思い出す中の君）。", "姉はこの言葉の聞き手。聞き手を敬うのは丁寧語（侍り・候ふ）で、尊敬語は動作の主体を敬う。", "侍従の大納言は「御むすめ」の父として話題に出るだけで、この動作の主体ではない。"], "pitfall": "会話文の敬語は「誰の言葉か（話し手）」と「敬語の種類」の2段階で決める。尊敬語→動作をする人、謙譲語→動作を受ける人、丁寧語→聞き手。", "related": "猫は「侍従の大納言の姫君」の生まれ変わりと名乗り、作者が姫君の筆跡を見てしみじみ思い出していたことが縁だと語る。", "sources": [{"title": "更級日記 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/SugSara/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「たまふ（四段・下二段）」", "url": "https://kobun.weblio.jp/content/%E3%81%9F%E3%81%BE%E3%81%B5", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-001", "category": "kobun_kaishaku", "topic": "「もぞ」（…したら困る）の解釈", "difficulty": 3, "question": "次は『宇治拾遺物語』「児のそら寝」の一節である（本文は教科書等で通行の本文による）。ぼたもちができあがり、僧が寝たふりをしている児を一度起こした場面。\n\nうれしとは思へども、ただ一度にいらへむも、「待ちけるかともぞ思ふ」とて、\n\n＊いらふ＝返事をする。\n\n傍線部の解釈として最も適当なものを選べ。", "options": ["（僧たちは）待っていたのかときっと思うだろうと期待して", "（ずっと）待っていたのかと（僧たちが）思うと困ると考えて", "待っていたのかと（僧たちが）まさか思わないだろうと考えて", "待っていたのだと自分でも思いこもうとして", "待っていたのかと（僧たちが）思ってくれればよいと考えて"], "answer": 1, "answerText": "待っていたのかと（僧たちが）思うと困ると考えて", "explanation": "「もぞ＋連体形（思ふ）」は、悪い事態を心配する「…したら困る」。すぐ返事をすると、ぼたもちをずっと待っていたのかと僧たちに思われて困る、と児は考えた。", "optionNotes": ["「もぞ」は期待ではなく、心配・危惧を表す。", "正しい。もぞ＝…したら困る。思う主体は僧たち。", "打消の語はない。「思ふ」をそのまま「思う」と訳す。", "思う主体は児自身ではなく、児を見ている僧たち。", "願望ではない。思われることを避けたいので、もう一度呼ばれるまで待つ。"], "pitfall": "係助詞「も」＋「ぞ」が文中にあり、文末が連体形で「悪いことが起こるのを心配する」文脈なら「…したら困る・…したら大変だ」。「もこそ」も同じ。", "related": "例：「門よくさしてよ。雨もぞ降る」（徒然草・第百四段）＝雨が降ったら大変だ。", "sources": [{"title": "ウィキブックス「高等学校国語総合/宇治拾遺物語」（児のそら寝 本文・語句）", "url": "https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E5%9B%BD%E8%AA%9E%E7%B7%8F%E5%90%88/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "宇治拾遺物語（国史大系本）ウィキソース", "url": "https://ja.wikisource.org/wiki/%E5%AE%87%E6%B2%BB%E6%8B%BE%E9%81%BA%E7%89%A9%E8%AA%9E", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「もぞ」", "url": "https://kobun.weblio.jp/content/%E3%82%82%E3%81%9E", "checked": "2026-10-31"}]}, {"version": 2, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-002", "category": "kobun_kaishaku", "topic": "会話文の敬語（仕る・候ふ）を含む現代語訳", "difficulty": 1, "question": "次は『徒然草』第百九段の一節である（本文はバージニア大学図書館 Japanese Text Initiative の公開本文による。表記は一部改めた）。木登りの名人が、高い木の上の男が軒の高さまで降りてきたところで初めて「気をつけて降りよ」と声をかけた理由を、作者に答える場面。\n\n「その事に候。目くるめき、枝危きほどは、己が恐れ侍れば申さず。あやまちは、やすき所になりて、必ず仕る事に候」と言ふ。\n\n「あやまちは、やすき所になりて、必ず仕る事に候」の現代語訳として最も適当なものを選べ。", "options": ["失敗は、危険な所でこそ、必ずいたすものでございます。", "失敗は、易しい所になってから、決していたさないものでございます。", "失敗は、易しい所になってから、必ずさせるものでございましょう。", "失敗は、易しい所になってから、必ずいたすものでございます。", "失敗は、易しい所になっても、必ずお仕えするべきでございます。"], "answer": 3, "answerText": "失敗は、易しい所になってから、必ずいたすものでございます。", "explanation": "「やすき」は「易し」の連体形（たやすい・安全な）。「仕る」はここでは「す」の丁寧語「いたす」、「に候」は断定「に」＋丁寧語「候ふ」で「…でございます」。危ない所ではなく、易しい所になってから失敗するという教え。", "optionNotes": ["「やすき所」は易しい所。危ない所では本人が気をつけるので失敗しない、という話。", "打消の語はない。「必ず仕る」は「必ずいたす」。", "「仕る」に使役の意味はない。「候」も推量ではない。", "正しい。仕る＝いたす、に候＝でございます。", "ここの「仕る」は「お仕えする」ではなく「（失敗を）いたす」。"], "pitfall": "「仕る」は「お仕えする」（「仕ふ」の謙譲語）のほか、「す」「行ふ」の謙譲語（して差し上げる）や丁寧語（いたす）にもなる。ここは失敗を「する」意味で、丁寧語の「いたす」。", "related": "学研全訳古語辞典はこの箇所を「失敗は、易しい所になってから、必ずいたすものでございます」と訳す。", "sources": [{"title": "徒然草 本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/YosTsur/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「仕る」", "url": "https://kobun.weblio.jp/content/%E4%BB%95%E3%82%8B", "checked": "2026-10-31"}]}, {"version": 1, "status": "verified", "format": "choice4", "isJiji": false, "id": "tk-kaishaku-003", "category": "kobun_kaishaku", "topic": "「などか〜ざりつる」（疑問）と「見ゆ」＝来る", "difficulty": 3, "question": "次は『和泉式部日記』の冒頭部分である（本文はバージニア大学図書館 Japanese Text Initiative の三条西家本による。表記は読みやすく改めた）。恋人だった宮（故宮）を亡くした女（作者）のもとに、故宮に仕えていた小舎人童が久しぶりにやって来た。\n\nあはれにもののおぼゆるほどに来たれば、「などか久しく見えざりつる。遠ざかる昔のなごりにも思ふを」など言はすれば、「そのことと候はでは、なれなれしきさまにやとつつましう候ふうちに、……」\n\n＊言はす＝（取り次ぎの者に）言わせる。主語は女。\n\n「などか久しく見えざりつる」の現代語訳として最も適当なものを選べ。", "options": ["どうして長い間姿を見せなかったのか。", "どうして長い間姿を見せないことがあろうか、いや、見せていたはずだ。", "どうして長い間（私の姿が）見えなかったのだろうか。", "なんとかして長い間会わずにいたいものだ。", "どうして長い間（あなたは私を）見ていなかったのか。"], "answer": 0, "answerText": "どうして長い間姿を見せなかったのか。", "explanation": "「などか」は「どうして…か」と理由を問う副詞で、係助詞「か」を含むので文末は連体形「つる」（完了「つ」）。「見ゆ」はここでは「姿を見せる・やって来る」。童は続けて来なかった理由を答えているので、反語ではなく疑問。", "optionNotes": ["正しい。などか（疑問）＋見え（姿を見せる）＋ざり（打消）＋つる（完了）。", "童が来なかったのは事実で、童もその理由を答えている。反語では文脈に合わない。", "ここの「見ゆ」は「（童が）姿を見せる・来る」。女の姿が見える意味ではない。", "「などか」は疑問・反語の副詞。願望（なんとかして）は「いかで」。", "「見ゆ」は「見る」ではない。見る主体が逆になっている。"], "pitfall": "「見ゆ」は「見える」のほかに「姿を見せる・来る」「会う」「結婚する」などの意味がある。人について「見えず」と言えば「来ない・顔を見せない」。", "related": "「などか」は文脈で疑問と反語を分ける。理由を答える返事が続けば疑問。", "sources": [{"title": "和泉式部日記（三条西家本）本文（バージニア大学図書館 Japanese Text Initiative）", "url": "https://jti.lib.virginia.edu/japanese/texts/IzuSanj/text.html", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「などか」", "url": "https://kobun.weblio.jp/content/%E3%81%AA%E3%81%A9%E3%81%8B", "checked": "2026-10-31"}, {"title": "学研全訳古語辞典（Weblio古語辞典）「見ゆ」", "url": "https://kobun.weblio.jp/content/%E8%A6%8B%E3%82%86", "checked": "2026-10-31"}]}, {"id": "tk-gendai-001", "version": 1, "status": "verified", "category": "gendai", "topic": "接続語（逆接→要約）地図と解釈", "format": "choice4", "difficulty": 1, "question": "次の文章の空欄（ ア ）（ イ ）に入る語の組み合わせとして最も適当なものを、次の5つから一つ選べ。\n\n地図は、現実の土地をそのまま縮めて写したものだと考えられがちである。（ ア ）、実際の地図は、使う目的に応じて情報を取捨選択した結果である。道路地図には山の高さを示す線がほとんど描かれず、登山用の地図には商店の名前がほとんど載らない。何を描き、何を省くかは、作り手が決めているのである。（ イ ）、地図とは世界の縮小コピーではなく、作り手が何を重要と見なしたかを示す一つの解釈だといえる。", "options": ["ア たとえば　イ しかし", "ア だから　イ つまり", "ア しかし　イ つまり", "ア しかし　イ たとえば", "ア さらに　イ ところで"], "answer": 2, "answerText": "ア しかし　イ つまり", "explanation": "アの前は「そのまま写したものだと考えられがち」という一般的な見方、後は「実際は取捨選択の結果」という反対の内容なので逆接の「しかし」。イの後は、道路地図・登山地図の例を受けて「地図とは〜一つの解釈だ」とまとめているので、言い換え・要約の「つまり」。", "optionNotes": ["誤り。アの後は前の見方の具体例ではなく、それを打ち消す内容。", "誤り。アの前後は「考えられがち」→「実際は」と反対の関係で、順接の「だから」は合わない。", "正解。ア＝逆接、イ＝前の内容をまとめる言い換え。", "誤り。アは正しいが、イの後は例ではなく、例を受けた結論。", "誤り。「さらに」は同じ方向の内容を付け加える語。イの「ところで」は話題転換で、結論につながらない。"], "pitfall": "イの直前に具体例が並んでいるので「たとえば」を選びがち。空所の「後ろ」が例なのか、例を受けた結論なのかを見る。", "related": "「つまり・すなわち・要するに」は言い換え・要約。筆者の主張はこの後に来やすい。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「取捨選択」", "url": "https://kotobank.jp/word/%E5%8F%96%E6%8D%A8%E9%81%B8%E6%8A%9E-528540", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉）「解釈」", "url": "https://kotobank.jp/word/%E8%A7%A3%E9%87%88-42466", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉）「逆接」", "url": "https://kotobank.jp/word/%E9%80%86%E6%8E%A5-476074", "checked": "2026-10-31"}]}, {"id": "tk-gendai-002", "version": 1, "status": "verified", "category": "gendai", "topic": "接続語「だからといって」科学の暫定性", "format": "choice4", "difficulty": 2, "question": "次の文章の空欄（　　）に入る語として最も適当なものを、次の5つから一つ選べ。\n\n科学の理論は、どれほど多くの実験で確かめられても、それで絶対に正しいと証明されたことにはならない。次に行う実験が、理論と食い違う結果を示す可能性は常に残るからである。（　　）、科学の知識が信頼に値しないということにはならない。誤りを示す証拠によって覆される可能性に開かれているからこそ、科学は誤りを修正しながら前進することができる。確かさが暫定的であることは、科学の弱点ではなく、むしろその強みなのである。", "options": ["そのため", "なぜなら", "いわば", "たとえば", "だからといって"], "answer": 4, "answerText": "だからといって", "explanation": "空所の前は「理論は絶対に正しいとは証明されない」。後は「信頼に値しないということにはならない」と、前の内容から導かれそうな結論を打ち消している。「前のことを認めても、そこから予想される結論にはならない」と示す「だからといって」が入る。", "optionNotes": ["誤り。「そのため」は前が原因で後が結果。後ろは結論を打ち消す内容なので合わない。", "誤り。「なぜなら」は理由を示し、文末が「〜からだ」とな ]}, {"id": "tk-gendai-009", "version": 1, "status": "verified", "category": "gendai", "topic": "語句補充「一面的」旅行の案内書", "format": "choice4", "difficulty": 2, "question": "次の文章の空欄（　　）に入る語句として最も適当なものを、次の5つから一つ選べ。\n\n旅行の案内書は、その土地の名所や名物を手際よく教えてくれる。しかし、案内書を片手に歩く旅行者は、書かれている場所を確かめて回ることに終始しがちである。見るべきものがあらかじめ決められているため、案内書に載らない路地の暮らしや、季節ごとの小さな変化は目に入りにくい。案内書がもたらす知識は便利である一方、土地の姿を（　　）にとらえさせてしまうおそれもある。見知らぬ土地を知るには、案内書を閉じて歩く時間も必要なのだろう。", "options": ["一面的", "多面的", "主体的", "具体的", "立体的"], "answer": 0, "answerText": "一面的", "explanation": "案内書に書かれた場所だけを見て回り、載らない暮らしや変化が「目に入りにくい」とある。つまり土地の一部分にかたよった見方しかできなくなるので、「ある一つの面にかたよっているさま」を表す「一面的」が入る。", "optionNotes": ["正解。書かれた一部分にかたよった見方になることを表す。", "誤り。「多面的」はさまざまな面から見るさまで、本文と逆。", "誤り。「主体的」は自分の意思で行動するさま。決められたものを見て回る本文と逆。", "誤り。「具体的」は形や内容がはっきりしているさま。「おそれ」とつながらない。", "誤り。「立体的」はいろいろな角度からとらえるさまで、本文と逆。"], "pitfall": "空所の後の「おそれ」から、マイナスの意味の語が入ると分かる。プラスの語（多面的・主体的・立体的）は外せる。", "related": "一面的⇔多面的。「〜に終始する」は始めから終わりまで同じことをすること。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「一面的」", "url": "https://kotobank.jp/word/%E4%B8%80%E9%9D%A2%E7%9A%84-433727", "checked": "2026-10-31"}]}, {"id": "tk-gendai-010", "version": 1, "status": "verified", "category": "gendai", "topic": "脱文挿入（たとえば・この例）言語の区切り方", "format": "choice4", "difficulty": 2, "question": "次の文章には、下の一文が抜けている。この一文が入る位置として最も適当なものを、本文中の【A】〜【E】から一つ選べ。\n\n抜けている一文：「たとえば日本語は、年上か年下かによって『兄』と『弟』を言い分けるが、英語では普通どちらも同じ一語で表す。」\n\nある言語の言葉を別の言語に置き換えるとき、意味がぴったり重なる語が見つかるとは限らない。【A】一つの語が指し示す範囲は、言語ごとに少しずつずれているからである。【B】この例のように、ある言語が細かく区別するものを、別の言語はまとめて一つで表すことがある。【C】こうしたずれは、翻訳を難しくする原因になる。【D】しかし同時に、それぞれの言語が世界をどのように区切っているかを教えてくれる手がかりにもなる。【E】", "options": ["【A】", "【B】", "【C】", "【D】", "【E】"], "answer": 1, "answerText": "【B】", "explanation": "抜けた一文は「たとえば」で始まる具体例。直前に「語の指し示す範囲は言語ごとにずれている」という一般的な説明があり、直後の「この例のように」が具体例を受けている【B】が適当。", "optionNotes": ["誤り。【A】に入れると、第一文とその理由（〜からである）の間を例が分断し、後の「この例のように」も例を直接受けられない。", "正解。一般論→たとえば（例）→この例のように（まとめ）と続く。", "誤り。「この例のように」の後では、例が後回しになり順序が逆。", "誤り。「翻訳を難しくする」と「しかし同時に」の間に例を入れると、逆接の流れが切れる。", "誤り。結論の後に例が来ることにな るが、使い方によっては、その道具なしでは何もできない状態を生むこともある。ただし、これは道具を手放すべきだということではない。道具に任せる部分と、自分で考える部分とを意識的に分けることができれば、私たちは道具の恩恵を受けながら、自らの力を保つこともできるはずである。", "options": ["地図アプリを使う人は、使わない人に比べて方向感覚が劣っていることが明らかになっている。", "道具に頼りすぎる危険を避けるためには、便利な道具の使用をできるだけ控えるべきである。", "道具は、使い方次第で、人の能力を補うものにも、人をそれに依存させるものにもなりうる。", "案内に従うだけの移動が増えたのは、人々が自分の居場所を意識しなくなったからである。", "道具に任せる部分と自分で考える部分を分ければ、道具から受ける恩恵はいっそう大きくなる。"], "answer": 2, "answerText": "道具は、使い方次第で、人の能力を補うものにも、人をそれに依存させるものにもなりうる。", "explanation": "第三文「道具は人の能力を補ってくれるが、使い方によっては、その道具なしでは何もできない状態を生むこともある」の言い換えなので合致する。", "optionNotes": ["誤り。本文は意識する機会が減ると述べるだけで、比べた結果が「明らかになっている」とは言っていない（言い過ぎ・本文にない）。", "誤り。本文は「道具を手放すべきだということではない」と述べており、逆。", "正解。第三文の内容と一致。", "誤り。本文では、案内に従う移動が原因で、意識する機会が減るのが結果。因果が逆。", "誤り。本文は「恩恵を受けながら、自らの力を保つ」と述べている。恩恵が「いっそう大きくなる」とは言っていない（部分的に正しいが後半がすり替え）。"], "pitfall": "「恩恵はいっそう大きくなる」という選択肢は前半が本文どおりなので選びやすい。後半の「恩恵がいっそう大きくなる」が本文の「自らの力を保つ」とずれていることに注意。", "related": "「恩恵」は恵み。「依存」は他に頼って存在すること。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「恩恵」", "url": "https://kotobank.jp/word/%E6%81%A9%E6%81%B5-41880", "checked": "2026-10-31"}, {"title": "コトバンク（デジタル大辞泉）「依存」", "url": "https://kotobank.jp/word/%E4%BE%9D%E5%AD%98-715", "checked": "2026-10-31"}]}, {"id": "tk-gendai-017", "version": 1, "status": "verified", "category": "gendai", "topic": "内容不一致（写真と体験）", "format": "choice4", "difficulty": 2, "question": "次の文章の内容と合致しないものを、次の5つから一つ選べ。\n\n旅先で写真を撮ることは、その場の光景を確実に残す方法のように思われる。しかし、撮影に気を取られるあまり、目の前の風景をじっくり眺めることがおろそかになる場合がある。後で写真を見返せば、写っているものは思い出せても、そのとき吹いていた風の冷たさや、周囲のざわめきまでは呼び起こせないことも多い。写真は記憶を助ける道具であるが、体験そのものの代わりにはならない。シャッターを切る前に、まず自分の感覚で場面を味わうことが、記憶を豊かにする第一歩なのである。", "options": ["写真を撮ることに夢中になると、目の前の風景を十分に味わえなくなることがある。", "写真を見返しても、撮影したときの感覚の細部までは思い出せないことが多い。", "写真は記憶を助けるが、体験したことのすべてを代わりに残してくれるわけではない。", "記憶を豊かにするためには、旅先では写真を撮らないようにするべきである。", "写真は光景を確実に残す方法のように思われるが、それだけで体験を十分に残せるわけではない。"], "answer": 3, "answerText": "記憶を豊かにするためには、旅先では写真を撮らないようにするべきである。", "explanation": "本文は「シャッターを切る前に、まず自分の感覚で場面を味わう」ことを勧めており、写真を撮ること自体を否定してはいない。「撮らないようにするべき」は言い過ぎで、合致しない。", "optionNotes": ["合致する。第二文の言い換え。", "合致する。第三文の言い換え。", "合致する。「記憶を助ける道具であるが、体験そのものの代わりにはならない」の言い換え。", "合致しない（正解）。本文は「撮る前にまず味わう」と言っており、撮るなとは言っていない（言い過ぎ）。", "合致する。第一文と第四文を合わせた内容。"], "pitfall": "最終文の「まず」を読み落とすと、「撮るな」という主張だと誤解する。順序を言っているだけ。", "related": "「疎か（おろそか）」はいいかげんにして軽く扱うさま。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「疎か」", "url": "https://kotobank.jp/word/%E7%96%8E%E3%81%8B-455550", "checked": "2026-10-31"}]}, {"id": "tk-gendai-018", "version": 1, "status": "verified", "category": "gendai", "topic": "傍線部の理由（速報と事実確認）", "format": "choice4", "difficulty": 2, "question": "次の文章の傍線部①「報道機関にとって『遅れること』が必ずしも欠点ではない」とあるが、そう言えるのはなぜか。最も適当なものを、次の5つから一つ選べ。\n\nインターネットの普及により、事件や事故の第一報は、発生から数分のうちに世界中へ伝わるようになった。速報の価値は大きいが、情報が早く出回るほど、事実の確認が追いつかないまま誤った内容が広がる危険も高まる。一度広まった誤りは、後から訂正が出されても、最初の情報ほどには人々の目に届かない。だからこそ、①報道機関にとって「遅れること」が必ずしも欠点ではない時代が来ているのである。確かめてから伝えるという姿勢が、かえって信頼の証しとなるからだ。", "options": ["速さを競っても個人の発信にはかなわず、報道機関が速報で優位に立つことはもはやできないから。", "訂正の情報は最初の情報よりも広く伝わるため、報道機関は誤りを恐れずに速報を出せるから。", "速報には価値がなく、人々は時間をかけて書かれた詳しい記事だけを求めるようになっているから。", "誤った情報が広まるのは報道機関が事実確認を怠っているからであり、それを改める必要があるから。", "誤った情報が早く広まりやすく訂正も届きにくい中では、確かめてから伝えることが、かえって信頼につながるから。"], "answer": 4, "answerText": "誤った情報が早く広まりやすく訂正も届きにくい中では、確かめてから伝えることが、かえって信頼につながるから。", "explanation": "傍線部の直後に「確かめてから伝えるという姿勢が、かえって信頼の証しとなるからだ」と理由が書かれている。その前提として、誤りが早く広がり、訂正が届きにくいという事情（第二・三文）がある。両方をふまえたものが適当。", "optionNotes": ["誤り。個人の発信との競争は本文にない。", "誤り。本文は訂正が「最初の情報ほどには人々の目に届かない」と述べており、逆。", "誤り。本文は「速報の価値は大きい」と述べている（言い過ぎ）。", "誤り。誤りが広まる原因を報道機関の怠慢だとは述べていない（本文にない）。", "正解。傍線部直後の理由と、その前提の事情を合わせている。"], "pitfall": "理由を問う設問では、傍線部の前後の「〜からだ」「だからこそ」を探す。ここでは前（だからこそ）と後（からだ）の両方に根拠がある。", "related": "「証し（あかし）」は確かであることを示すもの。「証」の訓読み。", "isJiji": false, "sources": [{"title": "コトバンク（デジタル大辞泉）「証」", "url": "https://kotobank.jp/word/%E8%A8%BC-163237", "checked": "2026-10-31"}]}, {"id": "tk-gendai-019", "version": 1, "status": "verified", "category": "gendai", "topic": "傍線部の言い換え（道具が遠い存在になる）", "format": "choice4", "difficulty": 3, "question": "次の文章の傍線部①「道具が便利に
