81%8A%E3%82%8D%E3%81%8E%E3%83%BC-3143178", "checked": "2026-10-31"}, {"title": "コトバンク「コンテクスト」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E3%81%93%E3%82%93%E3%81%A6%E3%81%8F%E3%81%99%E3%81%A8-3180989", "checked": "2026-10-31"}, {"title": "コトバンク「ノスタルジア」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E3%81%AE%E3%81%99%E3%81%9F%E3%82%8B%E3%81%98%E3%81%82-3162970", "checked": "2026-10-31"}, {"title": "コトバンク「ジレンマ」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E3%81%98%E3%82%8C%E3%82%93%E3%81%BE-3155828", "checked": "2026-10-31"}, {"title": "コトバンク「ニュアンス」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E3%81%AB%E3%82%86%E3%81%82%E3%82%93%E3%81%99-3215484", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-018", "version": 1, "status": "verified", "category": "goi", "topic": "機微の意味", "format": "choice4", "difficulty": 2, "question": "次の文の「機微」の意味として最も適当なものを、次の5つから一つ選べ。\nこの小説は、家族の間で揺れ動く人情の機微を丁寧に描いている。", "options": ["人と人とを結びつける、目に見えない決まりごと。", "表面からはわかりにくい、微妙な心の動きや事情。", "はっきりと口に出された、強い感情。", "長い年月の間に、少しずつ移り変わっていくこと。", "他人に知られてはならない、重大な秘密。"], "answer": 1, "answerText": "表面からはわかりにくい、微妙な心の動きや事情。", "explanation": "機微は、表面だけでは知ることのできない、微妙なおもむきや事情。「人情の機微」は、外からは見えにくい心の細やかな動きのこと。", "optionNotes": ["誤り。「しきたり」「義理」などの説明。", "正解。辞書の「表面だけでは知ることのできない、微妙なおもむきや事情」にあたる。", "誤り。機微は表に出ない微妙なものをいうので、逆の方向。", "誤り。「変遷」の説明。", "誤り。「機密」の説明。「機」の字が同じなので混同しやすい。"], "pitfall": "「機密（重要な秘密）」と混同しないこと。機微の「微」は「かすか・微妙」。「人情の機微に触れる」「心の機微」の形で覚える。", "related": "類義語：微妙・おもむき・ひだ。", "isJiji": false, "sources": [{"title": "コトバンク「機微」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%A9%9F%E5%BE%AE-475397", "checked": "2026-10-31"}, {"title": "コトバンク「機密」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%A9%9F%E5%AF%86-475753", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-019", "version": 1, "status": "verified", "category": "goi", "topic": "遡及の意味", "format": "choice4", "difficulty": 2, "question": "次の文の「遡及し」の意味として最も適当なものを、次の5つから一つ選べ。\n新しい規則は、施行日より前に結ばれた契約には遡及しない。", "options": ["これから先の物事に、前もって備える。", "決められた範囲をこえて、広く行き渡る。", "関係するすべてのものに、同時に効力を及ぼす。", "過去にさかのぼって、効力や影響を及ぼす。", "一度決めたことを取り消して、もとに戻す。"], "answer": 3, "answerText": "過去にさかのぼって、効力や影響を及ぼす。", "explanation": "遡及は、過去にさかのぼって影響・効力を及ぼすこと。新しい規則が、施行日より前の契約にまでさかのぼって適用されることはない、という意味。", "optionNotes": ["誤り。時間の向きが逆（未来に向けた備え）。", "誤り。「普及」の説明。「及」の字が同じで混同しやすい。", "誤り。「同時に」ではなく「過去にさかのぼって」が要点。", "正解。辞書の「過去にさかのぼって影響・効力を及ぼすこと」にあたる。", "誤り。「撤回」の説明。"], "pitfall": "「遡」は「さかのぼる」と読む字（常用漢字）。「遡及＝さかのぼって及ぼす」と字から意味を組み立てる。「普及」の「及」と混ぜないこと。", "related": "読みは「そきゅう」（「さっきゅう」は慣用読み）。「規定の適用を四月に遡及して行う」のように、法律や制度の文章でよく使われる。", "isJiji": false, "sources": [{"title": "コトバンク「遡及」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E9%81%A1%E5%8F%8A-510979", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-020", "version": 1, "status": "verified", "category": "goi", "topic": "アナロジーの用法", "format": "choice4", "difficulty": 3, "question": "「アナロジー」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["二人の主張はまったくのアナロジーで、どこにも共通点がない。", "会議でのやりとりを、アナロジーとして一字一句記録した。", "試合に負けた悔しさがアナロジーとなって、彼を練習に打ち込ませた。", "花粉のアナロジーで、春になるとくしゃみが止まらない。", "先生は、水の流れとのアナロジーによって、電気が流れるしくみを説明した。"], "answer": 4, "answerText": "先生は、水の流れとのアナロジーによって、電気が流れるしくみを説明した。", "explanation": "アナロジーは、類似、また、ある事柄の似ている点をもとに他の事柄をおしはかること（類推・類比）。よく知られた水の流れとの似た点を手がかりに、電気のしくみを説明するのは正しい使い方。", "optionNotes": ["誤り。アナロジーは「似ている点」に基づく語なので、「共通点がない」とは逆。", "誤り。「記録」の意味で使っている。", "誤り。「原動力」「ばね」の意味で使っている。", "誤り。「アレルギー」と音が似ていることによる取り違え。", "正解。似ている点を手がかりに考える「類推」として使っている。"], "pitfall": "「似ている点がある二つのもの」と「おしはかる」の両方が要点。音の似た「アレルギー」や、逆の「対照・対立」と取り違えないこと。", "related": "訳語：類推・類比。評論では、比喩（たとえ）による説明の根っこにある考え方として出てくる。", "isJiji": false, "sources": [{"title": "コトバンク「アナロジー」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E3%81%82%E3%81%AA%E3%82%8D%E3%81%98%E3%83%BC-3141258", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-021", "version": 1, "status": "verified", "category": "goi", "topic": "不可逆（空欄補充）", "format": "choice4", "difficulty": 2, "question": "次の文の空欄に入る語として最も適当なものを、次の5つから一つ選べ。\n時間の流れは〔　　〕的であり、過ぎ去った一日を取り戻すことは誰にもできない。", "options": ["循環", "不可逆", "可塑", "可逆", "断続"], "answer": 1, "answerText": "不可逆", "explanation": "不可逆は、ある状態に変化したものが、再びもとの状態に戻ることができないこと。「過ぎ去った一日を取り戻すことはできない」という後半の説明に合う。", "optionNotes": ["誤り。「循環」は、ひとめぐりしてもとへ戻ることを繰り返すこと。もとに戻る点で文意と逆。", "正解。もとの状態に戻れないことの意味。", "誤り。「可塑」は、思うように物の形をつくれること。「可塑的」は形を変えやすいさま。", "誤り。「可逆」は、もとの状態に戻りうること。「不可逆」と正反対。", "誤り。「断続」は、時々とぎれながら続くこと。"], "pitfall": "「可逆」と「不可逆」の取り違えに注意。「逆＝もとへ戻る」が「可＝できる」か「不可＝できない」かで考える。空欄の後の「取り戻すことは〜できない」が決め手。", "related": "評論では「不可逆な変化」「時間の不可逆性」の形で出る。対義語：可逆。", "isJiji": false, "sources": [{"title": "コトバンク「不可逆」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E4%B8%8D%E5%8F%AF%E9%80%86-616692", "checked": "2026-10-31"}, {"title": "コトバンク「循環」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%BE%AA%E7%92%B0-529723", "checked": "2026-10-31"}, {"title": "コトバンク「可塑」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E5%8F%AF%E5%A1%91-463053", "checked": "2026-10-31"}, {"title": "コトバンク「可逆」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E5%8F%AF%E9%80%86-459877", "checked": "2026-10-31"}, {"title": "コトバンク「断続」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%96%AD%E7%B6%9A-564365", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-022", "version": 1, "status": "verified", "category": "goi", "topic": "予定調和の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「予定調和」の意味として最も適当なものを、次の5つから一つ選べ。\nどの回も最後は主人公が勝つという予定調和の展開に、視聴者は物足りなさを感じ始めた。", "options": ["あらかじめ予定を立て、計画どおりに物事を進めること。", "対立する者どうしが話し合い、互いに歩み寄って折り合いをつけること。", "物事が人々の予想する流れのとおりに進み、結果も予想どおりになること。", "思いがけない出来事によって、それまでの計画が大きく狂うこと。", "異なる要素が互いを引き立て合い、全体が美しくまとまること。"], "answer": 2, "answerText": "物事が人々の予想する流れのとおりに進み、結果も予想どおりになること。", "explanation": "予定調和は、もとはライプニッツの哲学の用語。転じて、小説・映画・政治などで、人々が予想する流れに沿って事態が動き、結果も予想どおりであることをいう。毎回主人公が勝つ、先の読める展開を指している。", "optionNotes": ["誤り。「計画的」の説明。「予定」の字面からの連想。", "誤り。「妥協」「折衷」の説明。", "正解。辞書の「予想する流れに沿って事態が動き、結果も予想通りであること」にあたる。", "誤り。予想どおりになることとは逆。", "誤り。「調和」の字面だけから考えた説明。"], "pitfall": "「調和」の字からプラスの意味（美しくまとまる）に取らないこと。評論では「予定調和を破る」「予定調和的な結末」のように、先が読めて意外性がないことを批判的にいう場合が多い。", "related": "もとはライプニッツの説：世界の秩序は、あらかじめ神によって調和するように定められているという考え。", "isJiji": false, "sources": [{"title": "コトバンク「予定調和」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E4%BA%88%E5%AE%9A%E8%AA%BF%E5%92%8C-146335", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-023", "version": 2, "status": "verified", "category": "goi", "topic": "所産の用法", "format": "choice4", "difficulty": 3, "question": "「所産」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["言語は、長い歴史の中で人々が生み出してきた文化の所産である。", "祖父から受け継いだ土地や家などの所産を、兄弟で分け合った。", "責任の所産をはっきりさせないまま、話し合いは終わってしまった。", "能の舞台では、役者の無駄のない美しい所産に目を奪われた。", "この計画がうまくいくかどうかは、まだまったくの所産だ。"], "answer": 0, "answerText": "言語は、長い歴史の中で人々が生み出してきた文化の所産である。", "explanation": "所産は、ある事の結果として生み出されたもの、作り出したもの。言語を、人々が長い歴史の中で生み出してきた文化の産物ととらえる使い方は正しい。", "optionNotes": ["正解。生み出されたものの意味で使っている。", "誤り。「財産」「資産」の意味で使っている。", "誤り。「所在」（物事がある所・ありか）と取り違えている。「責任の所在」が正しい。", "誤り。「所作」（身のこなし・しぐさ）と取り違えている。", "誤り。「未知数」の意味で使っている。"], "pitfall": "「所在」「所作」と一字違いで、読みも似ている。所産の「産」は「うむ」で、「〜の所産」は「〜が生み出したもの」と覚える。", "related": "評論では「時代の所産」「努力の所産」「歴史的な所産」の形で出る。", "isJiji": false, "sources": [{"title": "コトバンク「所産」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%89%80%E7%94%A3-534538", "checked": "2026-10-31"}, {"title": "コトバンク「所在」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%89%80%E5%9C%A8-534511", "checked": "2026-10-31"}, {"title": "コトバンク「所作」（デジタル大辞泉・精選版日本国語大辞典）", "url": "https://kotobank.jp/word/%E6%89%80%E4%BD%9C-534505", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-024", "version": 2, "status": "verified", "category": "goi", "topic": "足をすくわれる（空欄補充・体の部分）", "format": "choice4", "difficulty": 2, "question": "次の文の（　）に入る語として最も適当なものを、次の5つから一つ選べ。\n優勝候補だからといって油断していると、格下の相手に（　）をすくわれることになる。", "options": ["手", "首", "足", "腰", "肩"], "answer": 2, "answerText": "足", "explanation": "「足をすくう」は、相手のすきをついて失敗させること。足を払って支えを失わせることから。受け身の「足をすくわれる」で、すきをつかれて思いがけず失敗させられる意。", "optionNotes": ["誤り。「手をすくわれる」という慣用句はない。", "誤り。「首をすくめる」（驚いたり恐れ入ったりして首を縮める）と混同しやすいが、「すくめる」は別の動詞。", "正解。「足をすくう」は相手のすきをついて失敗させること。受け身の形で、油断などから思わぬ失敗をさせられる意になる。", "誤り。「腰をすくわれる」という慣用句はない。", "誤り。「肩をすくめる」（身を縮こまらせる・どうしようもないというしぐさ）と混同しやすいが、「すくめる」は別の動詞。"], "pitfall": "「足元をすくわれる」と言う人が多いが、辞書等で本来の言い方とされるのは「足をすくわれる」。文化庁の平成28年度調査では「足下をすくわれる」を使う人が64.4％、「足をすくわれる」は26.3％だった（平成19年度は74.1％と16.7％）。", "related": "「すくう」に当たる漢字は常用漢字表にないので、かなで書く。「首をすくめる」「肩をすくめる」の「すくめる」も同様。", "isJiji": false, "sources": [{"title": "コトバンク「足をすくう」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%B6%B3%E3%82%92%E6%8E%AC%E3%81%86-424313", "checked": "2026-10-31"}, {"title": "コトバンク「足をすくわれる」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E8%B6%B3%E3%82%92%E6%8E%AC%E3%82%8F%E3%82%8C%E3%82%8B-424314", "checked": "2026-10-31"}, {"title": "コトバンク「首をすくめる」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E9%A6%96%E3%82%92%E7%AB%A6%E3%82%81%E3%82%8B-484722", "checked": "2026-10-31"}, {"title": "コトバンク「肩をすくめる」（デジタル大辞泉）", "url": "https://kotobank.jp/word/%E8%82%A9%E3%82%92%E7%AB%A6%E3%82%81%E3%82%8B-463210", "checked": "2026-10-31"}, {"title": "文化庁 平成28年度「国語に関する世論調査」の結果の概要", "url": "https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/h28_chosa_kekka.pdf", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-025", "version": 1, "status": "verified", "category": "goi", "topic": "舌先三寸の意味（口先三寸との混同）", "format": "choice4", "difficulty": 3, "question": "次の文の「舌先三寸」の意味として最も適当なものを、次の5つから一つ選べ。\n彼は舌先三寸で客を丸め込み、必要のない商品まで買わせてしまった。", "options": ["ほんの少しの言い間違い。", "相手を言い負かすほどの、筋の通った鋭い議論。", "相手の気持ちを思いやった、心のこもった言葉。", "口数が少なく、必要なことしか言わないこと。", "口先だけでうまく相手をあしらうこと。また、その言葉。"], "answer": 4, "answerText": "口先だけでうまく相手をあしらうこと。また、その言葉。", "explanation": "「舌先三寸」は、口先だけでうまく相手をあしらうこと、またその言葉。中身や真心がないのに、言葉だけは巧みだというよくない意味で使う。", "optionNotes": ["誤り。「三寸」から「わずか」を連想した誤り。言い間違いの意味はない。", "誤り。中身のある議論ではなく、口先だけのうまさをいう。", "誤り。逆。心のこもらない上辺だけの言葉をいう。", "誤り。口数の多い少ないではなく、口先でうまくあしらうことをいう。", "正解。辞書の意味そのもの。心のこもらない、上辺だけの巧みな言葉をいう。"], "pitfall": "「口先三寸」と言う人が多いが、本来の言い方は「舌先三寸」。文化庁の平成23年度調査では、「本心でない上辺だけの巧みな言葉」を「口先三寸」と言う人が56.7％、「舌先三寸」は23.3％だった。", "related": "江戸時代には「舌三寸」と言い、近代以降に「舌先三寸」の形が現れた（四字熟語を知る辞典）。", "isJiji": false, "sources": [{"title": "コトバンク「舌先三寸」（デジタル大辞泉・精選版日本国語大辞典・四字熟語を知る辞典）", "url": "https://kotobank.jp/word/%E8%88%8C%E5%85%88%E4%B8%89%E5%AF%B8-520446", "checked": "2026-10-31"}, {"title": "文化庁 平成23年度「国語に関する世論調査」の結果の概要", "url": "https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/h23_chosa_kekka.pdf", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-026", "version": 1, "status": "verified", "category": "goi", "topic": "眉をひそめるの用法", "format": "choice4", "difficulty": 2, "question": "「眉をひそめる」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["合格の知らせを聞いて、彼は眉をひそめて喜んだ。", "電車の中で大声で騒ぐ若者たちに、周りの乗客は眉をひそめた。", "難しい問題がようやく解けて、彼女はほっと眉をひそめた。", "久しぶりに会った友人と、眉をひそめて笑い合った。", "彼は眉をひそめて、夕焼けに染まる山々をうっとりと眺めた。"], "answer": 1, "answerText": "電車の中で大声で騒ぐ若者たちに、周りの乗客は眉をひそめた。", "explanation": "「眉をひそめる」は、心配なことがあったり、他人の嫌な行為に不快を感じたりして顔をしかめること。眉と眉の間を寄せる表情で、喜び・安心・感動の場面には使わない。", "optionNotes": ["誤り。喜びの表情ではない。", "正解。他人の嫌な行為に不快を感じて顔をしかめる場面。", "誤り。安心した場面には使わない。", "誤り。笑顔とは逆の、不快や心配の表情。", "誤り。うっとりする（感動する）表情ではない。"], "pitfall": "表情を表す慣用句は「どんな気持ちのときの顔か」で判断する。「眉をひそめる」は不快・心配。なお文化庁の平成26年度調査では、辞書等で本来の言い方とされる「眉をひそめる」と、「眉をしかめる」を使う人が同じ44.5％だった。", "related": "同じ意味で「眉根を寄せる」とも言う（デジタル大辞泉）。", "isJiji": false, "sources": [{"title": "コトバンク「眉をひそめる」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%9C%89%E3%82%92%E9%A1%B0%E3%82%81%E3%82%8B-635864", "checked": "2026-10-31"}, {"title": "文化庁 平成26年度「国語に関する世論調査」の結果の概要", "url": "https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/h26_chosa_kekka.pdf", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-027", "version": 1, "status": "verified", "category": "goi", "topic": "腹に据えかねるの意味", "format": "choice4", "difficulty": 2, "question": "次の文の「腹に据えかねる」の意味として最も適当なものを、次の5つから一つ選べ。\n約束を何度も破ったうえに謝りもしない彼の態度は、さすがに腹に据えかねる。", "options": ["怒りを心の中におさめておくことができない。", "どうするべきか、なかなか決心がつかない。", "相手の考えが理解できず、納得がいかない。", "心配で、食事ものどを通らない。", "相手の本心が分からず、信用しきれない。"], "answer": 0, "answerText": "怒りを心の中におさめておくことができない。", "explanation": "「据える」は落ち着かせて置くこと、「〜かねる」は「〜できない」。怒りを腹（心の中）に置いておけない、つまり我慢できないほど腹が立つ、という意味。", "optionNotes": ["正解。我慢できないほど腹が立つ、という意味。", "誤り。「腹を据える」（覚悟を決める）からの連想。怒りの表現である。", "誤り。理解・納得の問題ではなく、怒りをこらえられないことをいう。", "誤り。「腹」から食事を連想した誤り。", "誤り。信用の問題ではない。"], "pitfall": "「腹を据える」（覚悟を決める）と混同して「決心がつかない」と取りやすい。「腹に据えかねる」は怒りを我慢できないこと。", "related": "「腹を据える」には「がまんしてこらえる」の意味もあり、「あまりのことに腹を据えかねる」という形も辞書に載っている（デジタル大辞泉）。", "isJiji": false, "sources": [{"title": "コトバンク「腹に据えかねる」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%85%B9%E3%81%AB%E6%8D%AE%E3%81%88%E3%81%8B%E3%81%AD%E3%82%8B-604811", "checked": "2026-10-31"}, {"title": "コトバンク「腹を据える」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%85%B9%E3%82%92%E6%8D%AE%E3%81%88%E3%82%8B-604829", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-028", "version": 1, "status": "verified", "category": "goi", "topic": "目から鼻へ抜けるの意味", "format": "choice4", "difficulty": 3, "question": "次の文の「目から鼻へ抜ける」の意味として最も適当なものを、次の5つから一つ選べ。\n目から鼻へ抜けるような彼女のことだから、この難しい場面もきっと上手に切り抜けるだろう。", "options": ["見たり聞いたりしたことを、すぐに忘れてしまう。", "驚きのあまり、ぼうぜんとする。", "人の話を素直に信じ、だまされやすい。", "非常に頭の働きがよく、抜け目がない。", "ひどく恥ずかしい思いをする。"], "answer": 3, "answerText": "非常に頭の働きがよく、抜け目がない。", "explanation": "「目から鼻へ抜ける」は、非常に頭の働きがよいさま。また、抜け目なくすばしこいさま。目で見たことがすぐ鼻へ通じるほど、物事の判断が速いということ。", "optionNotes": ["誤り。「抜ける」から「記憶が抜ける」と連想した誤り。意味は逆に近い。", "誤り。驚きの表現ではない。", "誤り。逆。抜け目がなく、だまされにくい人をいう。", "正解。非常に賢く、すばしこいさまをいう。", "誤り。恥ずかしさの表現ではない。"], "pitfall": "「抜ける」を「抜けている（間が抜けている）」「忘れる」と結びつけると、ほめ言葉なのに悪い意味に取ってしまう。", "related": "類語に「一を聞いて十を知る」がある（デジタル大辞泉）。", "isJiji": false, "sources": [{"title": "コトバンク「目から鼻へ抜ける」（デジタル大辞泉・精選版日本国語大辞典・ことわざを知る辞典）", "url": "https://kotobank.jp/word/%E7%9B%AE%E3%81%8B%E3%82%89%E9%BC%BB%E3%81%B8%E6%8A%9C%E3%81%91%E3%82%8B-642683", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-029", "version": 2, "status": "verified", "category": "goi", "topic": "手をこまねくの用法（誤っているもの）", "format": "choice4", "difficulty": 3, "question": "「手をこまねく」の使い方として誤っているものを、次の5つから一つ選べ。", "options": ["相手チームの速攻に備え、全員が自陣で手をこまねいて待ち構えた。", "被害が広がっていくのを、手をこまねいて見ているわけにはいかない。", "対策を考えずに手をこまねいているうちに、客足はすっかり遠のいてしまった。", "行政が手をこまねいている間にも、空き家は増え続けている。", "ただ手をこまねいていても、事態がよくなることはない。"], "answer": 0, "answerText": "相手チームの速攻に備え、全員が自陣で手をこまねいて待ち構えた。", "explanation": "「手をこまねく」は腕組みをすること。そこから、何もしないで傍観している意味で使う。「準備して待ち構える」という意味はない。", "optionNotes": ["誤った使い方なので、これが答え。「準備して待ち構える」意味で使っている。", "正しい。何もしないで見ている、の意。", "正しい。何もせずにいるうちに、の意。", "正しい。行政が何も手を打たずにいる、の意。", "正しい。何もしないでいても、の意。"], "pitfall": "文化庁の令和元年度調査では、本来の意味とされる「何もせずに傍観している」が37.2％、本来の意味ではない「準備して待ち構える」が47.4％で、誤った意味の方が多かった。", "related": "「手をこまぬく」とも言う。同じ意味の言い方に「手をつかねる」「腕をこまぬく」がある（デジタル大辞泉）。", "isJiji": false, "sources": [{"title": "コトバンク「手をこまねく」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%89%8B%E3%82%92%E6%8B%B1%E3%81%8F-573179", "checked": "2026-10-31"}, {"title": "文化庁 令和元年度「国語に関する世論調査」の結果の概要", "url": "https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/92531901_01.pdf", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-030", "version": 1, "status": "verified", "category": "goi", "topic": "面目躍如の用法", "format": "choice4", "difficulty": 2, "question": "「面目躍如」の使い方として最も適当なものを、次の5つから一つ選べ。", "options": ["大事な場面で三振に倒れた四番打者は、面目躍如たる姿を見せた。", "部屋の大掃除を終え、面目躍如とした気分で休日を過ごした。", "入社したばかりの彼は、面目躍如たる思いで初出社の日を迎えた。", "ベテラン捕手が延長戦で決勝打を放ち、面目躍如たる活躍を見せた。", "失敗の責任を取り、彼は面目躍如として職を辞した。"], "answer": 3, "answerText": "ベテラン捕手が延長戦で決勝打を放ち、面目躍如たる活躍を見せた。", "explanation": "「面目躍如」は、その人本来の姿（実力）が生き生きと現れているさま。世間の評価や地位にふさわしい活躍をする様子をいう。「面目躍如たる」「面目躍如として」の形で使う。", "optionNotes": ["誤り。失敗して評価を下げる場面は「面目を失う」であり、逆。", "誤り。「すっきりした気分」の意味はない。", "誤り。「新たな決意」の意味ではない。実力を発揮した様子をいう。", "正解。実績のある人が、その評判にふさわしい活躍をしている。", "誤り。責任を取って身を引く意味はない。"], "pitfall": "「面目」があるから「面目を失う」と混同しないこと。「躍如」は生き生きとした様子で、よい評価がいっそう高まる場面に使う。", "related": "「面目」は世間に対する名誉、「躍如」は生き生きとした様子（四字熟語を知る辞典）。2024年の本番では、漢字の問題で「面目躍如」の「躍」が問われた。", "isJiji": false, "sources": [{"title": "コトバンク「面目躍如」（デジタル大辞泉・精選版日本国語大辞典・四字熟語を知る辞典）", "url": "https://kotobank.jp/word/%E9%9D%A2%E7%9B%AE%E8%BA%8D%E5%A6%82-644744", "checked": "2026-10-31"}, {"title": "コトバンク「面目を失う」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E9%9D%A2%E7%9B%AE%E3%82%92%E5%A4%B1%E3%81%86-644726", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-031", "version": 1, "status": "verified", "category": "goi", "topic": "天地無用の意味", "format": "choice4", "difficulty": 3, "question": "次の文の「天地無用」の意味として最も適当なものを、次の5つから一つ選べ。\n引っ越し業者は、「天地無用」と書かれた段ボール箱を慎重に運んだ。", "options": ["上下を気にせず、どの向きで運んでもよい。", "中身が壊れやすいので、投げたり落としたりしてはいけない。", "水にぬれると傷むので、雨の当たる場所に置いてはいけない。", "上下を逆さまにしてはいけない。", "中身が大切なものなので、勝手に開けてはいけない。"], "answer": 3, "answerText": "上下を逆さまにしてはいけない。", "explanation": "「天地無用」は、運送する荷物などに表示する語で、破損の恐れがあるため上と下を逆にしてはいけない、という意味。「天地」は上と下、「無用」は「してはいけない」（禁止）の意。", "optionNotes": ["誤り。逆。「無用」を「必要ない」と取った誤り。", "誤り。破損の恐れがあるための表示ではあるが、言葉が指示しているのは「上下を逆にするな」ということ。", "誤り。水ぬれの注意ではない。", "正解。破損の恐れがあるので、上下を逆にして扱うなという注意書き。", "誤り。開封の禁止ではない。"], "pitfall": "「無用＝いらない」と取ると「上下を気にしなくてよい」と逆の意味になる。文化庁の平成25年度調査では、本来の意味「上下を逆にしてはいけない」が55.5％、本来の意味ではない「上下を気にしないでよい」が29.2％だった。", "related": "「無用」には「してはいけない」（禁止）の意味がある。「立ち入り無用」「開放無用」など（デジタル大辞泉）。", "isJiji": false, "sources": [{"title": "コトバンク「天地無用」（デジタル大辞泉・精選版日本国語大辞典・四字熟語を知る辞典）", "url": "https://kotobank.jp/word/%E5%A4%A9%E5%9C%B0%E7%84%A1%E7%94%A8-578495", "checked": "2026-10-31"}, {"title": "コトバンク「無用」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%84%A1%E7%94%A8-642340", "checked": "2026-10-31"}, {"title": "文化庁 平成25年度「国語に関する世論調査」の結果の概要", "url": "https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/h25_chosa_kekka.pdf", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-032", "version": 1, "status": "verified", "category": "goi", "topic": "付和雷同（空欄補充）", "format": "choice4", "difficulty": 2, "question": "次の文の（　）に入る四字熟語として最も適当なものを、次の5つから一つ選べ。\n自分の考えを持たずに多数派の意見に（　）するばかりでは、話し合いの意味がない。", "options": ["首尾一貫", "独立独歩", "付和雷同", "自問自答", "不偏不党"], "answer": 2, "answerText": "付和雷同", "explanation": "「付和雷同」は、一定の主義・主張がなく、安易に他の説に賛成すること。「自分の考えを持たずに」「多数派の意見に」という文脈に合う。", "optionNotes": ["誤り。方針や考え方が始めから終わりまで変わらず筋が通っていること。文脈と逆の内容になる。", "誤り。他人にたよらず、自分の信じるところに従って行動すること。逆。", "正解。一定の主義・主張がなく、安易に他の説に賛成すること。", "誤り。自分で問いかけ自分で答えること。「意見に〜する」とは続かない。", "誤り。どの党派・主義にもかたよらず、公平・中立の立場をとること。"], "pitfall": "「不和雷同」と書くのは誤り（デジタル大辞泉）。「付和」は他人の意見につき従うこと。", "related": "反対の方向の語として「独立独歩」（他人にたよらず自分の信じるところに従って行動すること）をあわせて覚えるとよい。", "isJiji": false, "sources": [{"title": "コトバンク「付和雷同」（デジタル大辞泉・精選版日本国語大辞典・四字熟語を知る辞典）", "url": "https://kotobank.jp/word/%E4%BB%98%E5%92%8C%E9%9B%B7%E5%90%8C-622901", "checked": "2026-10-31"}, {"title": "コトバンク「首尾一貫」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E9%A6%96%E5%B0%BE%E4%B8%80%E8%B2%AB-529240", "checked": "2026-10-31"}, {"title": "コトバンク「独立独歩」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%8B%AC%E7%AB%8B%E7%8B%AC%E6%AD%A9-583026", "checked": "2026-10-31"}, {"title": "コトバンク「自問自答」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E8%87%AA%E5%95%8F%E8%87%AA%E7%AD%94-524314", "checked": "2026-10-31"}, {"title": "コトバンク「不偏不党」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E4%B8%8D%E5%81%8F%E4%B8%8D%E5%85%9A-620210", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-033", "version": 1, "status": "verified", "category": "goi", "topic": "当意即妙（空欄補充）", "format": "choice4", "difficulty": 2, "question": "次の文の（　）に入る四字熟語として最も適当なものを、次の5つから一つ選べ。\n台本にない突然の質問にも、司会者は（　）な受け答えをして、会場を笑いに包んだ。", "options": ["意気消沈", "当意即妙", "優柔不断", "無味乾燥", "旧態依然"], "answer": 1, "answerText": "当意即妙", "explanation": "「当意即妙」は、すばやくその場面に適応して機転をきかすこと。台本にない突然の質問に、その場でうまく応じた様子に合う。", "optionNotes": ["誤り。意気込みが衰え、元気がなくなること。会場を笑わせる場面に合わない。", "正解。すばやくその場面に適応して機転をきかすこと。", "誤り。気が弱く決断力に乏しいこと。文脈に合わない。", "誤り。おもしろみも風情もないこと。会場が笑いに包まれた結果と合わない。", "誤り。もとのままで変化や進歩のないさま。受け答えの様子を表す語ではない。"], "pitfall": "「即妙」の「即」は「すぐに」、「妙」は「すぐれている」。「とういそくみょう」と読む。文脈の「突然の質問にも」「笑いに包んだ」が手がかり。", "related": "", "isJiji": false, "sources": [{"title": "コトバンク「当意即妙」（デジタル大辞泉・精選版日本国語大辞典・四字熟語を知る辞典）", "url": "https://kotobank.jp/word/%E5%BD%93%E6%84%8F%E5%8D%B3%E5%A6%99-579492", "checked": "2026-10-31"}, {"title": "コトバンク「意気消沈」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%84%8F%E6%B0%97%E6%B6%88%E6%B2%88-431221", "checked": "2026-10-31"}, {"title": "コトバンク「優柔不断」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E5%84%AA%E6%9F%94%E4%B8%8D%E6%96%AD-650751", "checked": "2026-10-31"}, {"title": "コトバンク「無味乾燥」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E7%84%A1%E5%91%B3%E4%B9%BE%E7%87%A5-642293", "checked": "2026-10-31"}, {"title": "コトバンク「旧態依然」（デジタル大辞泉・精選版日本国語大辞典ほか）", "url": "https://kotobank.jp/word/%E6%97%A7%E6%85%8B%E4%BE%9D%E7%84%B6-477145", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-034", "version": 1, "status": "verified", "category": "goi", "topic": "天衣無縫の意味（人柄について）", "format": "choice4", "difficulty": 3, "question": "次の文の「天衣無縫」の意味として最も適当なものを、次の5つから一つ選べ。\n幼いころから少しも変わらない彼女の天衣無縫な人柄は、誰からも愛された。", "options": ["身なりにこだわらず、いつも質素な服装をしているさま。", "何事も周到に計算して、抜かりなくふるまうさま。", "周りの目を気にして、本心を見せないさま。", "人付き合いが広く、誰とでもすぐに打ち解けるさま。", "飾り気がなく、無邪気で自然なさま。"], "answer": 4, "answerText": "飾り気がなく、無邪気で自然なさま。", "explanation": "「天衣無縫」は、天人の衣には縫い目がないという話から、詩や文章に技巧の跡が見えず自然で完全なこと。転じて、人柄が飾り気なく無邪気なことをいう。この文は人柄についての使い方。", "optionNotes": ["誤り。「衣」「縫」から服装と取った誤り。", "誤り。逆。作為（わざとらしさ）がないことをいう。", いと言いますから。", "大勢の人が集まって、枯れ木も山のにぎわいで、会場はとてもにぎやかになった。", "葉を落とした木々が秋の山を彩り、まさに枯れ木も山のにぎわいだ。", "強豪チームに有名な選手が次々と加わり、まさに枯れ木も山のにぎわいだ。", "八十歳を過ぎても現役で働く祖父は、まさに枯れ木も山のにぎわいだ。"], "answer": 0, "answerText": "人数が足りないのなら、私も参加しましょう。枯れ木も山のにぎわいと言いますから。", "explanation": "「枯れ木も山のにぎわい」は、枯れ木でも山に趣を添えるのに役立つことから、つまらないものでも、ないよりはましであることのたとえ。自分のことをへりくだって言うときに使う。", "optionNotes": ["正解。自分を「つまらないもの」とへりくだり、いないよりはましだと言っている。", "誤り。「人が集まればにぎやかになる」は本来の意味ではないとされる。", "誤り。山の景色そのものを言う表現ではない。", "誤り。すぐれたものが集まることではなく、つまらないものでもないよりはまし、の意。", "誤り。年をとっても元気だとほめる意味はない。"], "pitfall": "文化庁の平成26年度調査では、本来の意味「つまらないものでも無いよりはまし」が37.6％、本来の意味ではない「人が集まればにぎやかになる」が47.2％だった。人を誘うときに使うと、相手を「つまらないもの」にたとえることになってしまう。", "related": "", "isJiji": false, "sources": [{"title": "コトバンク「枯れ木も山のにぎわい」（デジタル大辞泉・精選版日本国語大辞典・ことわざを知る辞典）", "url": "https://kotobank.jp/word/%E6%9E%AF%E3%82%8C%E6%9C%A8%E3%82%82%E5%B1%B1%E3%81%AE%E8%B3%91%E3%82%8F%E3%81%84-468374", "checked": "2026-10-31"}, {"title": "文化庁 平成26年度「国語に関する世論調査」の結果の概要", "url": "https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/h26_chosa_kekka.pdf", "checked": "2026-10-31"}, {"title": "文化庁「常用漢字表」（平成22年内閣告示）", "url": "https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/pdf/joyokanjihyo_20101130.pdf", "checked": "2026-10-31"}]}, {"id": "tk-goi-037", "version": 1, "status": "verified", "category": "goi", "topic": "蛇足（空欄補充・故事成語）", "format": "choice4", "difficulty": 1, "question": "次の文の（　）に入る語として最も適当なものを、次の5つから一つ選べ。\n説明はもう十分だったのに、最後に付け加えた一言は（　）で、かえって話の印象を弱めてしまった。", "options": ["圧巻", "白眉", "漁夫の利", "背水の陣", "蛇足"], "answer": 4, "answerText": "蛇足", "explanation": "「蛇足」は、付け加える必要のないもの。蛇の絵を早く描く競争で、最初に描き上げた者が足まで描いてしまったために負けたという故事から。", "optionNotes": ["誤り。全体の中で最もすぐれた部分。印象を弱めた一言には合わない。", "誤り。多数の中で最もすぐれているもののたとえ。逆の意味になる。", "誤り。両者が争うすきに第三者が利益を横取りすること。", "誤り。一歩もひけない状況で全力を尽くすこと。", "正解。付け加える必要のない余計なもの。"], "pitfall": "「最後に付け加えた」「かえって印象を弱めた」が手がかり。「圧巻」「白眉」はどちらも「最もすぐれたもの」で、ほめる語。", "related": "「圧巻」は、昔の中国の官吏登用試験で、最もすぐれた答案をいちばん上にのせたことから（デジタル大辞泉）。", "isJiji": false, "sources": [ function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function getCode(){return lsGet(NAME_KEY)?(lsGet(CODE_KEY)||""):"";}
function getName(){return lsGet(NAME_KEY)||"";}
// 合言葉は自由な文字（ひらがな・漢字・英数字）。表記ゆれ（全角半角・大文字小文字・空白）はそろえる
function normName(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/\s+/g,"");}
async function codeOf(name){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("march-drill:"+normName(name)));return "h-"+[...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,"0")).join("");}
let SYNC={busy:false,dirty:false,last:+(lsGet(KEY+"-sync")||0),err:false};
function summary(){
  const L=S.log.slice(-50),t=today();const cats={};
  cats["合言葉:"+getName()]=null;
  Object.keys(CATS).forEach(k=>{const a=acc(k);cats[CATS[k]]=a.a==null?null:Math.round(a.a*100);});
  return {total:S.log.length,recent:L.length?Math.round(L.filter(l=>l.ok).length/L.length*100):null,streak:streakView(),today:S.days[t]||0,revenge:revengePool().length,cats};
}
function cloudPush(keep){
  const code=getCode();if(!SYNC_URL||!code||SYNC.busy)return;
  SYNC.busy=true;SYNC.dirty=false;
  const body=JSON.stringify({code,app:KEY,savedAt:S.savedAt||Date.now(),data:S,summary:summary()});
  fetch(SYNC_URL,{method:"POST",keepalive:!!keep&&body.length<60000,headers:{"Content-Type":"text/plain;charset=utf-8"},body})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw 0;SYNC.last=Date.now();SYNC.err=false;lsSet(KEY+"-sync",String(SYNC.last));})
    .catch(()=>{SYNC.err=true;SYNC.dirty=true;}).finally(()=>{SYNC.busy=false;});
}
async function cloudGet(code){
  const r=await fetch(SYNC_URL+"?code="+encodeURIComponent(code)+"&app="+encodeURIComponent(KEY));const j=await r.json();
  if(!j.ok)throw new Error("ng");return j.data||null;
}
function adopt(o){if(!o||o.v!==1||!o.cards)return false;S=Object.assign(fresh(),o,{settings:Object.assign(fresh().settings,o.settings||{})});try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}return true;}
// 開いたとき：クラウドの方が新しければ取り込む（別の端末で解いた分）

/* ===== 問題バンク ===== */
function bank(){const m=new Map();BANK_BASE.forEach(q=>m.set(q.id,q));(S.extra||[]).forEach(q=>{const o=m.get(q.id);if(!o||(q.version||1)>=(o.version||1))m.set(q.id,q);});return [...m.values()].filter(q=>q.status==="verified");}
function card(id){return S.cards[id]||(S.cards[id]={stage:0,due:null,seen:0,ok:0,ng:0,revenge:false,hits:0,hitDay:null,confWrong:false,grad:false,checkDue:null});}
function isDue(q,t){const c=S.cards[q.id];if(!c||c.seen===0)return false;if(c.grad)return c.checkDue!=null&&c.checkDue<=t;return c.stage>=1&&c.due!=null&&c.due<=t;}
function acc(cat,n=20){const L=S.log.filter(l=>l.cat===cat).slice(-n);if(!L.length)return {a:null,n:0};return {a:L.filter(l=>l.ok).length/L.length,n:L.length};}
function targetDiff(cat){const {a,n}=acc(cat);if(a==null||n<4)return 2;if(a>.9)return 3;if(a<.6)return 1;return 2;}
function mastery(cat){const qs=bank().filter(q=>q.category===cat);if(!qs.length)return null;let s=0;qs.forEach(q=>{const c=S.cards[q.id];if(!c)return;s+=c.grad?1:Math.min(c.stage,5)/5;});return s/qs.length;}
function revengePool(){return bank().filter(q=>S.cards[q.id]&&S.cards[q.id].revenge);}

function interleave(list){const out=[];let rest=list.slice();while(rest.length){let i=rest.findIndex(q=>!(out.length>=2&&out[out.length-1].category===q.category&&out[out.length-2].category===q.category));if(i<0)i=0;out.push(rest.splice(i,1)[0]);}return out;}

const WARM_N=2,SHORT_CATS=["kanji","kumitate","goi","kobun_tango"];
// 軽さの点数（小さいほど軽い）：難しさ・文章の長さ・前回の出来で決める
function ease(q){const c=S.cards[q.id];let s=q.difficulty*2;if(!SHORT_CATS.includes(q.category))s+=3;if(String(q.question).length>120)s+=2;if(c&&c.seen){if(c.confWrong)s+=4;else if(c.stage>=1)s-=2;else s+=1;}return s;}
function warmOrder(set,B,due){
  const isWarm=q=>ease(q)<=3;
  let warm=set.filter(isWarm).sort((a,b)=>ease(a)-ease(b)).slice(0,WARM_N);
  // 軽い問題が足りない日は、前に正解した短い問題（なければ基本の新問）と入れ替える
  if(warm.length<WARM_N){
    const ids=new Set(set.map(q=>q.id)),dueIds=new Set(due.map(q=>q.id));
    const pool=shuffle(B.filter(q=>!ids.has(q.id)&&isWarm(q))).sort((a,b)=>ease(a)-ease(b));
    while(warm.length<WARM_N&&pool.length){
      let ri=-1,worst=-1;set.forEach((q,i)=>{if(warm.includes(q)||dueIds.has(q.id))return;const e=ease(q);if(e>worst){worst=e;ri=i;}});
      if(ri<0)break;const add=pool.shift();set[ri]=add;warm.push(add);
    }
  }
  // それでも足りなければ、セットの中で一番軽いものを使う
  if(warm.length<WARM_N){const more=set.filter(q=>!warm.includes(q)).sort((a,b)=>ease(a)-ease(b));while(warm.length<WARM_N&&more.length)warm.push(more.shift());}
  warm.sort((a,b)=>ease(a)-ease(b));
  const rest=set.filter(q=>!warm.includes(q)).sort((a,b)=>(a.difficulty-b.difficulty)||(ease(a)-ease(b)));
  return warm.concat(interleave(rest));
}
function pickDaily(){
  const B=bank(),t=today(),n=Math.min(10,B.length);
  let due=B.filter(q=>isDue(q,t)).sort((a,b)=>{const A=S.cards[a.id],C=S.cards[b.id];return (C.confWrong-A.confWrong)||((A.due||A.checkDue||0)-(C.due||C.checkDue||0));}).slice(0,6);
  const unseen=shuffle(B.filter(q=>!S.cards[q.id]||S.cards[q.id].seen===0)).sort((a,b)=>Math.abs(a.difficulty-targetDiff(a.category))-Math.abs(b.difficulty-targetDiff(b.category)));
  const minNew=Math.min(3,unseen.length);
  if(due.length>n-minNew)due=due.slice(0,n-minNew);
  let set=due.concat(unseen.slice(0,n-due.length));
  if(set.length<n){const ids=new Set(set.map(q=>q.id));const rest=shuffle(B.filter(q=>!ids.has(q.id))).sort((a,b)=>(acc(a.category).a??.5)-(acc(b.category).a??.5));set=set.concat(rest.slice(0,n-set.length));}
  // BOSS（第10問）：応用問題を、苦手すぎない分野から
  let bossIdx=-1,best=-1;
  set.forEach((q,i)=>{if(!isBossable(q))return;const a=acc(q.category).a;const sc=(a==null?.6:(a>=.4&&a<=.9?1:.3))+Math.random()*.1;if(sc>best){best=sc;bossIdx=i;}});
  if(bossIdx<0){const ids=new Set(set.map(q=>q.id));const cand=B.filter(q=>isBossable(q)&&!ids.has(q.id));if(cand.length&&set.length){const dueIds=new Set(due.map(q=>q.id));let ri=set.findIndex(q=>!dueIds.has(q.id));if(ri<0)ri=set.length-1;set[ri]=pick(cand);bossIdx=ri;}}
  let boss=null;if(bossIdx>=0){boss=set.splice(bossIdx,1)[0];}
  set=warmOrder(set,B,due);if(boss)set.push(boss);
  return {list:set,bossId:boss?boss.id:null,warm:Math.min(WARM_N,set.length)};
}
function pickCustom(cats,n){
  const B=bank().filter(q=>cats.includes(q.category)),t=today();
  const due=shuffle(B.filter(q=>isDue(q,t)));const ids=new Set(due.map(q=>q.id));
  const unseen=shuffle(B.filter(q=>!ids.has(q.id)&&(!S.cards[q.id]||S.cards[q.id].seen===0)));unseen.forEach(q=>ids.add(q.id));
  const rest=shuffle(B.filter(q=>!ids.has(q.id))).sort((a,b)=>(acc(a.category).a??.5)-(acc(b.category).a??.5));
  return {list:interleave(due.concat(unseen,rest).slice(0,n)),bossId:null};
}
function pickRevenge(n=10){
  const P=shuffle(revengePool()).sort((a,b)=>{const A=S.cards[a.id],C=S.cards[b.id];return (C.confWrong-A.confWrong)||(A.hits-C.hits);});
  return {list:interleave(P.slice(0,n)),bossId:null};
}

/* ===== 判定後の記録（間隔反復） ===== */
function applyResult(q,correct,conf){
  const c=card(q.id),t=today(),r={};
  c.seen++;S.log.push({id:q.id,cat:q.category,d:t,ok:correct,conf});if(S.log.length>3000)S.log=S.log.slice(-3000);
  if(correct){
    c.ok++;
    if(conf==="guess"){c.revenge=true;if(c.stage<1)c.stage=1;c.grad=false;c.due=t+INTERVAL[c.stage];r.guess=true;}
    else{
      if(c.grad){c.checkDue=null;}
      else if(c.stage>=5){c.grad=true;c.due=null;c.checkDue=t+60;r.grad=true;}
      else{c.stage++;c.due=t+INTERVAL[c.stage];}
      if(c.revenge){
        if(c.hits>=1&&c.hitDay!=null&&c.hitDay<t){c.revenge=false;c.hits=0;c.hitDay=null;S.popped++;r.popped=true;}
        else if(c.hits===0){c.hits=1;c.hitDay=t;r.cracked=true;}
        else r.sameDay=true;
      }
      c.confWrong=false;
    }
  }else{
    c.ng++;c.stage=1;c.due=t+1;c.grad=false;c.checkDue=null;c.revenge=true;c.hits=0;c.hitDay=null;
    if(conf==="sure"){c.confWrong=true;r.confWrong=true;}
  }
  save();return r;
}

   </div></header>
   <div class="qbody" id="qbody"><div class="qbody-in">
     ${isBoss?`<div class="bossbar">${IC.crown}BOSS BATTLE：本番レベルの応用・引っかけ問題</div>`:""}
     ${item.retry?`<div class="note sky small">取り返しチャンス！さっき間違えた問題です</div>`:""}
     ${!item.retry&&SES.mode==="daily"&&SES.idx<(SES.warm||0)?`<div class="note small">ウォームアップ ${SES.idx+1}/${SES.warm}：まずは軽く、リズムをつかもう</div>`:""}
     <div class="qcard stack" id="qcard">
       <div class="qmeta"><span class="tag">${esc(CATS[q.category])}</span><span class="tag">${DIFF[q.difficulty]||""}</span>${q.isJiji?`<span class="tag sky">時事 ${esc(q.asOf||"")}</span>`:""}</div>
       <div class="qtext">${esc(q.question)}</div>
       <div id="qarea"></div>
     </div>
     <div id="sheet"></div>
   </div></div>
   <footer class="qfoot"><div class="qfoot-in" id="qfoot"></div></footer>`;
  $("#qx").onclick=()=>{if(confirmQuit())quitSession();};
  renderArea();renderFoot();
  $("#qbody").scrollTop=0;
}
let quitArm=0;
function confirmQuit(){if(Date.now()-quitArm<2500)return true;quitArm=Date.now();toast("もう一度押すと中断します（ここまでの記録は残ります）");return false;}
function progHTML(){
  let h="";for(let i=0;i<SES.first;i++){const d=SES.done[i];const cls=d===true?"ok":d===false?"ng":(i===firstIndex()?"now":"");const isB=SES.bossId&&i===SES.first-1;h+=`<i class="${cls} ${isB?"boss":""}"></i>`;}return h;
}
function firstIndex(){let c=0;for(let i=0;i<SES.idx;i++)if(!SES.queue[i].retry)c++;return SES.queue[SES.idx]&&SES.queue[SES.idx].retry?-1:c;}

function renderArea(){
  const q=QS.q,a=$("#qarea");
  if(q.format==="build"){
    const ans=[...q.answerText],rev=QS.phase==="reveal";
    const slots=ans.map((c,k)=>{const t=QS.picked[k];const ch=t==null?"":q.tiles[t];let cls=t==null?"":"f";if(rev)cls=(ch===c)?"ok":"ng";return `<div class="slot ${cls}">${esc(ch)}</div>`;}).join("");
    const full=QS.picked.length>=ans.length;
    a.innerHTML=`<div class="slots" aria-label="答えの欄">${slots}</div>${rev&&!QS.correct?`<p class="small" style="text-align:center;margin:0 0 10px">正しくは <b style="font-size:1.3em">${esc(q.answerText)}</b></p>`:""}<div class="tiles">${QS.tperm.map(i=>{const used=QS.picked.includes(i);const right=rev&&ans.includes(q.tiles[i]);return `<button class="tile ${right?"right":""}" data-i="${i}" ${(used||full||rev)&&!right?"disabled":""} ${rev?"tabindex=-1":""}>${esc(q.tiles[i])}</button>`;}).join("")}</div>`;
    a.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(QS.phase!=="answer")return;const i=+b.dataset.i;if(QS.picked.includes(i)||QS.picked.length>=ans.length)return;QS.picked.push(i);if(QS.picked.length===ans.length)QS.phase=S.settings.conf?"conf":"judge";renderArea();renderFoot();if(QS.phase==="judge")judge(null);});
    return;
  }
  if(q.format==="write"){
    if(QS.phase==="reveal"){a.innerHTML=`<div class="recall-ans" style="text-align:left">あなたの答え：${esc(QS.typed||"（空欄）")}</div>`;return;}
    a.innerHTML=`<input type="text" id="qin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" value="${esc(QS.typed||"")}" style="font-size:1.1rem">`;
    const inp=$("#qin");inp.oninput=()=>{QS.typed=inp.value;renderFoot();};inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();checkWrite();}};
    return;
  }
  if(q.format==="recall"){
    a.innerHTML=QS.revealed?`<div class="recall-ans">${esc(q.answerText)}</div>`:`<p class="muted small" style="margin:0">答えを頭の中で言ってから、めくってください。</p>`;
    return;
  }
  if(q.format==="order"){
    a.innerHTML=`<p class="muted small" style="margin:0 0 8px">古い順にタップ（${QS.order.length}/${q.options.length}）</p><div class="opts">${q.options.map((o,i)=>{const k=QS.order.indexOf(i);const cls=QS.phase==="reveal"?(QS.correct?"right":"wrong"):"";return `<button class="opt ${cls}" data-i="${i}" aria-pressed="${k>=0}" ${QS.phase==="reveal"?"disabled":""}><span class="n">${k>=0?k+1:""}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
    a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(QS.phase==="reveal")return;const i=+b.dataset.i;if(QS.order.includes(i))return;QS.order.push(i);if(QS.order.length===q.options.length)QS.phase=S.settings.conf?"conf":"judge";renderArea();renderFoot();if(QS.phase==="judge")judge(null);});
    return;
  }
  a.innerHTML=`<div class="opts">${QS.perm.map((i,k)=>{const o=q.options[i];let cls="";if(QS.phase==="reveal"){if(i===q.answer)cls="right";else if(i===QS.sel)cls="wrong";}return `<button class="opt ${cls}" data-i="${i}" aria-pressed="${QS.phase!=="reveal"&&QS.sel===i}" ${QS.phase==="reveal"?"disabled":""}><span class="n">${CIRC[k]||k+1}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
  a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(QS.phase==="reveal")return;QS.sel=+b.dataset.i;if(S.settings.conf){QS.phase="conf";renderArea();renderFoot();}else{judge(null);}});
}
function renderFoot(){
  const f=$("#qfoot"),q=QS.q;
  if(QS.phase==="reveal"){f.innerHTML=`<button class="btn primary" id="next">${SES.idx+1<SES.queue.length?"次へ":"結果を見る"}</button>`;$("#next").onclick=next;return;}
  if(q.format==="write"){
    f.innerHTML=`<button class="btn primary" id="wchk" ${(QS.typed||"").trim()?"":"disabled"}>答え合わせ</button>`;$("#wchk").onclick=checkWrite;return;
  }
  if(q.format==="recall"){
    if(!QS.revealed){f.innerHTML=`<button class="btn sky" id="flip">答えを見る</button>`;$("#flip").onclick=()=>{QS.revealed=true;renderArea();renderFoot();};}
    else{f.innerHTML=`<div class="ask">言えた？</div><div class="confrow"><button class="btn" id="r1"><span class="e">🔥</span>言えた</button><button class="btn" id="r2"><span class="e">🤔</span>あいまい</button><button class="btn" id="r3"><span class="e">💭</span>言えなかった</button></div>`;
      $("#r1").onclick=()=>judge("sure",true);$("#r2").onclick=()=>judge("guess",true);$("#r3").onclick=()=>judge(null,false);}
    return;
  }
  if(QS.phase==="conf"){
    f.innerHTML=`<div class="ask">どのくらい自信がある？</div><div class="confrow"><button class="btn" id="c1"><span class="e">🔥</span>自信あり</button><button class="btn" id="c2"><span class="e">🤔</span>たぶん</button><button class="btn" id="c3"><span class="e">🎲</span>勘</button></div>${q.format==="order"?`<button class="btn slim" id="redo">並べ直す</button>`:""}${q.format==="build"?`<button class="btn slim" id="redo">やり直す</button>`:""}`;
    $("#c1").onclick=()=>judge("sure");$("#c2").onclick=()=>judge("maybe");$("#c3").onclick=()=>judge("guess");
    const r=$("#redo");if(r)r.onclick=()=>{QS.order=[];QS.picked=[];QS.phase="answer";renderArea();renderFoot();};
    return;
  }
  if(q.format==="build"){f.innerHTML=QS.picked.length?`<div class="confrow" style="grid-template-columns:1fr 1fr"><button class="btn slim" id="back1">1字もどす</button><button class="btn slim" id="redo">やり直す</button></div>`:`<div class="ask">字を順番にタップしよう（${[...q.answerText].length}字）</div>`;const b1=$("#back1");if(b1)b1.onclick=()=>{QS.picked.pop();renderArea();renderFoot();};const r=$("#redo");if(r)r.onclick=()=>{QS.picked=[];renderArea();renderFoot();};return;}
  if(q.format==="order"&&QS.order.length){f.innerHTML=`<button class="btn slim" id="redo">並べ直す</button>`;$("#redo").onclick=()=>{QS.order=[];renderArea();renderFoot();};return;}
  f.innerHTML=`<div class="ask">${q.format==="order"?"順番にタップして答えよう":"答えをタップしよう"}</div>`;
}

function judge(conf,recallOk){
  const q=QS.q,item=QS.item;
  let correct;
  if(q.format==="recall"||q.format==="write")correct=!!recallOk;
  else if(q.format==="order")correct=JSON.stringify(QS.order)===JSON.stringify(q.answer);
  else if(q.format==="build")correct=QS.picked.map(i=>q.tiles[i]).join("")===q.answerText;
  else correct=QS.sel===q.answer;
  QS.correct=correct;QS.phase="reveal";
  const isBoss=q.id===SES.bossId&&!item.retry;
  let r={};let gain=0;let bonus=false;
  if(!item.retry){
    r=applyResult(q,correct,conf);
    SES.done.push(correct);if(correct)SES.firstOk++;
    if(!correct){SES.wrongIds.push(q.id);SES.queue.push({q,retry:true});}
    if(r.popped)SES.popped++;if(r.cracked)SES.cracked++;if(r.confWrong)SES.confNg++;
    if(isBoss)SES.boss=correct;
  }else{SES.retakes++;if(correct)SES.retakeOk++;}
  if(correct){SES.combo++;SES.maxCombo=Math.max(SES.maxCombo,SES.combo);gain=item.retry?4:10;if(SES.combo>=3)gain+=5;if(isBoss)gain+=20;if(!item.retry&&Math.random()<.1){bonus=true;gain*=2;}}
  else{SES.combo=0;gain=2;}
  if(conf&&conf!=="guess"&&!item.retry)gain+=1;
  SES.xp+=gain;S.xp+=gain;save();
  // 演出
  const qc=$("#qcard");qc.classList.remove("bounce","shake","burst");void qc.offsetWidth;
  if(r.popped){qc.classList.add("burst");tone(SND.pop);vib([20,40,20]);}
  else if(correct){qc.classList.add("bounce");tone(SND.ok);vib(15);}
  else{qc.classList.add("shake");tone(SND.ng);vib([40,30,40]);}
  if(isBoss&&correct){tone(SND.fan);confetti();}
  const cb=$("#combo");cb.innerHTML=SES.combo>=2?IC.flame+SES.combo:"";if(SES.combo>=2){cb.classList.remove("pop");void cb.offsetWidth;cb.classList.add("pop");}
  $(".prog").innerHTML=progHTML();
  renderArea();renderFoot();renderSheet(correct,conf,r,isBoss,gain,bonus);
}

function message(correct,conf,r,isBoss){
  if(isBoss)return pick(correct?MSG.bossWin:MSG.bossLose);
  if(r.popped)return "撃破！カードが弾けて消えた。もう自分の知識だ";
  if(r.cracked)return "ヒビが入った！別の日にもう1回正解で撃破";
  if(!correct&&conf==="sure")return pick(MSG.confNg);
  if(correct&&conf==="guess")return pick(MSG.guessOk);
  if(correct&&MSG.combo[SES.combo])return MSG.combo[SES.combo];
  if(correct&&(QS.q.category==="kokusai"||QS.q.category==="kokukei")&&Math.random()<.2)return pick(MSG.eng);
  return pick(correct?MSG.ok:MSG.ng);
}

function renderSheet(correct,conf,r,isBoss,gain,bonus){
  const q=QS.q;
  let notes="";
  if(q.format==="order"){
    notes=`<div class="sec-t">正しい順番</div><ol class="onotes">${q.answer.map((i,k)=>`<li><span class="m ok">${k+1}</span><span>${esc(q.options[i])}${q.optionNotes&&q.optionNotes[i]?`<br><span class="muted">${esc(q.optionNotes[i])}</span>`:""}</span></li>`).join("")}</ol>`;
  }else if(q.format==="build"&&q.optionNotes){
    notes=`<div class="sec-t">マスの字の説明</div><ul class="onotes">${QS.tperm.map(i=>{const ok=[...q.answerText].includes(q.tiles[i]);return `<li><span class="m ${ok?"ok":"ng"}">${esc(q.tiles[i])}</span><span>${esc(q.optionNotes[i]||"")}${QS.picked.includes(i)&&!ok?` <span class="tag red">あなたが選んだ字</span>`:""}</span></li>`;}).join("")}</ul>`;
  }else if(q.format!=="recall"&&q.format!=="write"&&q.optionNotes){
    notes=`<div class="sec-t">選択肢ごとの説明</div><ul class="onotes">${QS.perm.map((i,k)=>{const n=q.optionNotes[i];return `<li><span class="m ${i===q.answer?"ok":"ng"}">${CIRC[k]||k+1}</span><span>${esc(n)}${i===QS.sel&&i!==q.answer?` <span class="tag red">あなたの答え</span>`:""}</span></li>`;}).join("")}</ul>`;
  }
  const src=(q.sources||[]).map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)).join("<br>");
  $("#sheet").innerHTML=`<section class="sheet ${correct?"ok":"ng"}" aria-live="polite">
    <div class="verdict">${correct?IC.ok:IC.ng}<div><b>${correct?(isBoss?"BOSS撃破！":"正解！"):(isBoss?"BOSSに挑んだ！":"ナイスチャレンジ")}</b><div class="small">${esc(message(correct,conf,r,isBoss))}</div></div></div>
    <div class="row" style="gap:8px"><span class="xpchip">+${gain} XP</span>${bonus?`<span class="tag sky">ボーナス解説 XP×2</span>`:""}${r.guess?`<span class="tag red">リベンジに追加</span>`:""}${!correct&&!QS.item.retry?`<span class="tag red">リベンジに追加</span>`:""}</div>
    ${q.format!=="recall"&&q.format!=="write"&&q.format!=="order"&&q.format!=="build"&&!correct?`<div><div class="sec-t">正解</div><div style="font-weight:800">${CIRC[QS.perm.indexOf(q.answer)]||""} ${esc(q.options[q.answer])}</div></div>`:""}
    ${q.format==="recall"||q.format==="write"||q.format==="build"?`<div><div class="sec-t">答え</div><div style="font-weight:800">${esc(q.answerText)}</div>${q.format==="write"&&q.accept&&q.accept.length>1?`<div class="small muted">正解にする表記：${q.accept.map(esc).join("／")}</div>`:""}</div>`:""}
    ${q.format==="write"&&!correct&&!QS.item.retry&&(QS.typed||"").trim()?`<button class="btn slim" id="wfix">表記が違うだけで、合っていた</button>`:""}
    <div><div class="sec-t">解説</div><div>${esc(q.explanation)}</div></div>
    ${q.pitfall?`<div class="pit"><div class="sec-t">落とし穴</div><div>${esc(q.pitfall)}</div></div>`:""}
    ${notes}
    ${q.related?`<div><div class="sec-t">あわせて覚えると強い</div><div class="small">${esc(q.related)}</div></div>`:""}
    ${src?`<div class="src">出典：${src}</div>`:""}
    <div id="flagBox"><button class="btn slim" id="flagBtn">${IC.flag}これ合ってる？</button></div>
  </section>`;
  const wf=$("#wfix");if(wf)wf.onclick=()=>{fixWrite();};
  const fb=$("#flagBtn");fb.onclick=()=>{$("#flagBox").innerHTML=`<div class="stack"><input type="text" id="flagMemo" placeholder="どこが気になった？（なくてもOK）"><button class="btn slim sky" id="flagSave">親に知らせる印を付ける</button></div>`;$("#flagSave").onclick=()=>{S.flags.push({id:q.id,version:q.version||1,topic:q.topic,q:String(q.question).slice(0,60),memo:$("#flagMemo").value.trim(),day:today()});save();$("#flagBox").innerHTML=`<div class="note sky small">印を付けました。「仕上がり」タブからまとめて親に送れます。</div>`;};};
  setTimeout(()=>{const s=$("#sheet .sheet");if(s)s.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});},250);
}

function checkWrite(){const q=QS.q;const v=norm(QS.typed);const acc=(q.accept&&q.accept.length?q.accept:[q.answerText]).map(norm);const ok=acc.includes(v);judge(ok?"sure":null,ok);}
function fixWrite(){ // 表記ゆれの自己申告：記録を正解に直す（勘扱い＝リベンジには残す）
  const q=QS.q,c=card(q.id),t=today();
  const L=S.log;for(let i=L.length-1;i>=0;i--){if(L[i].id===q.id&&L[i].d===t){L[i].ok=true;L[i].conf="guess";break;}}
  c.ng=Math.max(0,c.ng-1);c.ok++;c.confWrong=false;c.stage=Math.max(c.stage,1);c.due=t+1;c.revenge=true;
  SES.done[SES.done.length-1]=true;SES.firstOk++;SES.wrongIds=SES.wrongIds.filter(id=>id!==q.id);
  const qi=SES.queue.findIndex((it,i)=>i>SES.idx&&it.retry&&it.q.id===q.id);if(qi>=0)SES.queue.splice(qi,1);
  save();$(".prog").innerHTML=progHTML();const w=$("#wfix");if(w)w.outerHTML=`<div class="note green small">正解に直しました。念のためリベンジに残しています。</div>`;$("#next").textContent=SES.idx+1<SES.queue.length?"次へ":"結果を見る";
}
function next(){SES.idx++;if(SES.idx<SES.queue.length)showQ();else finish();}

function finish(){
  const t=today();
  S.days[t]=(S.days[t]||0)+1;
  const s=S.streak;let usedFreeze=false;
  if(s.last!==t){if(s.last===t-1)s.count++;else if(s.last===t-2&&s.freezeWeek!==weekOf(t)){s.count++;s.freezeWeek=weekOf(t);usedFreeze=true;}else s.count=1;s.last=t;}
  let cheer="";if(CHEERS.length&&[3,7,14,30].includes(s.count)&&!S.cheered.includes(s.count)){cheer=pick(CHEERS);S.cheered.push(s.count);}
  save();cloudPush();
  const sc=SES.firstOk,n=SES.first,rate=n?sc/n:0;
  const head=rate===1?"パーフェクト！":rate>=.8?"すばらしい仕上がり！":rate>=.5?"着実に前進！":"いい練習になった！";
  const good=[];good.push(`今日も${n}問を積み上げた`);if(SES.retakeOk)good.push(`間違えた問題を${SES.retakeOk}問その場で取り返した`);if(SES.popped)good.push(`リベンジを${SES.popped}問撃破`);if(SES.cracked)good.push(`${SES.cracked}問にヒビを入れた`);if(SES.maxCombo>=3)good.push(`最大${SES.maxCombo}連続正解`);if(SES.confNg)good.push(`思い込みを${SES.confNg}つ発見（ここが一番伸びる）`);
  const wrongLeft=SES.wrongIds.filter(id=>S.cards[id]&&S.cards[id].revenge).length;
  const sets=S.days[t];
  const R=$("#result");
  R.innerHTML=`<div class="wrap stack">
    <div class="big">${esc(head)}</div>
    ${SES.boss===true?`<div class="note" style="text-align:center;font-weight:800">${IC.crown.replace('<svg','<svg width="22" height="22" style="vertical-align:-4px;color:var(--gold)"')} BOSS撃破</div>`:SES.boss===false?`<div class="note sky" style="text-align:center">BOSSはリベンジに登録。次は倒せる</div>`:""}
    <div class="card stack"><div class="sec-t">今日よかったこと</div><ul style="margin:0;padding-left:1.2em">${good.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div>
    <div class="stats">
      <div class="stat"><b>${sc}/${n}</b><span>正解</span></div>
      <div class="stat"><b>+${SES.xp}</b><span>XP</span></div>
      <div class="stat"><b>${s.count}</b><span>連続日数</span></div>
    </div>
    ${usedFreeze?`<div class="note sky small">お休みチケットを使って、連続記録をつなげました。</div>`:""}
    ${cheer?`<div class="note"><div class="sec-t">家族から</div>${esc(cheer)}</div>`:""}
    ${sets>=5?`<div class="note sky">${MSG.rest}</div>`:""}
    ${wrongLeft?`<button class="btn red" id="goRv">間違えた${wrongLeft}問を今すぐリベンジ</button>`:""}
    <button class="btn ${wrongLeft?"":"primary"}" id="again">${sets>=5?"それでももう1セット":"もう1セット"}</button>
    <button class="btn slim" id="home">ホームへ</button>
  </div>`;
  R.hidden=false;R.scrollTop=0;$("#quiz").hidden=true;
  const mode=SES.mode;SES=null;
  const close=()=>{R.hidden=true;$("#tabs").hidden=false;document.body.style.overflow="";};
  const g=$("#goRv");if(g)g.onclick=()=>{close();startSession("revenge");};
  $("#again").onclick=()=>{close();startSession(mode==="revenge"?"daily":mode);};
  $("#home").onclick=()=>{close();setTab("daily");};
  if(rate===1)confetti();
}

/* ===== 紙吹雪 ===== */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx");c.hidden=false;const x=c.getContext("2d");const W=c.width=innerWidth,H=c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=["--green","--yellow","--sky","--red","--gold"].map(v=>cs.getPropertyValue(v).trim()||"#58CC02");
  const P=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*11-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});if(++f<110)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.hidden=true;}})();
}

setTab("daily");
</script>
</body></html>
